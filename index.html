<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Poranek Franka</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#0b0c14;overflow:hidden;
    font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-user-select:none;user-select:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  canvas{width:min(100vw, calc(100vh * 16 / 9));height:auto;aspect-ratio:16/9;
    image-rendering:pixelated;image-rendering:crisp-edges;
    box-shadow:0 0 0 4px #1a1c2c, 0 0 60px rgba(0,0,0,.8);touch-action:none;display:block;}
  canvas:focus{outline:3px solid #f8d878;outline-offset:6px;}
  #dotyk{position:fixed;inset:auto 0 0 0;display:none;justify-content:space-between;
    padding:14px 18px;box-sizing:border-box;pointer-events:none;}
  #dotyk .grupa{display:flex;gap:12px;pointer-events:auto;}
  #dotyk button{width:78px;height:78px;border-radius:10px;border:3px solid #fffeff;font-size:32px;color:#fffeff;
    background:rgba(0,0,0,.45);font-family:monospace;}
  #dotyk button:active{background:rgba(248,216,120,.6);}
  body.dotyk #dotyk{display:flex;}
  #glosnik{position:fixed;top:10px;right:12px;width:44px;height:44px;border:3px solid #fffeff;
    border-radius:8px;background:rgba(0,0,0,.5);color:#fffeff;font-size:20px;cursor:pointer;}

  /* --- telefon trzymany pionowo: poproś o obrót --- */
  #obroc{position:fixed;inset:0;z-index:99;display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:26px;padding:24px;box-sizing:border-box;
    background:#0000bc;color:#fffeff;text-align:center;
    font-family:ui-monospace,Menlo,Consolas,monospace;}
  #obroc .telefon{width:76px;height:130px;border:6px solid #fffeff;border-radius:10px;
    position:relative;animation:obrotFazy 2.4s ease-in-out infinite;}
  #obroc .telefon::after{content:"";position:absolute;left:50%;bottom:6px;transform:translateX(-50%);
    width:26px;height:4px;background:#fffeff;border-radius:2px;}
  #obroc h1{font-size:20px;margin:0;line-height:1.5;letter-spacing:1px;color:#f8d878;}
  #obroc p{font-size:13px;margin:0;line-height:1.6;color:#c0dfff;max-width:22em;}
  @keyframes obrotFazy{
    0%,30%{transform:rotate(0deg);} 55%,85%{transform:rotate(-90deg);} 100%{transform:rotate(0deg);}
  }
  @media (prefers-reduced-motion: reduce){ #obroc .telefon{animation:none;transform:rotate(-90deg);} }
  @media (orientation: portrait) and (pointer: coarse){
    #obroc{display:flex;}
    #wrap,#dotyk,#glosnik{display:none !important;}
  }
  /* zapas dla urządzeń, które raportują rysik jako „pointer: fine" */
  @media (orientation: portrait) and (hover: none){
    #obroc{display:flex;}
    #wrap,#dotyk,#glosnik{display:none !important;}
  }
  /* niskie ekrany (telefon poziomo) – mniejsze przyciski, żeby nie zasłaniały gry */
  @media (pointer: coarse) and (max-height: 460px){
    #dotyk{padding:8px 10px;}
    #dotyk button{width:58px;height:58px;font-size:24px;opacity:.75;}
    #glosnik{width:36px;height:36px;font-size:16px;top:6px;right:8px;}
  }
</style>

<body>
<div id="obroc">
  <div class="telefon"></div>
  <h1>OBRÓĆ TELEFON<br>POZIOMO</h1>
  <p>Gra działa na leżąco.<br>Dotknij ekranu, żeby włączyć pełny ekran.</p>
</div>
<div id="wrap"><canvas id="c" width="480" height="270" tabindex="0"></canvas></div>
<button id="glosnik" title="Dźwięk włącz/wyłącz">🔊</button>
<div id="dotyk">
  <div class="grupa"><button data-k="ArrowLeft">◀</button><button data-k="ArrowRight">▶</button></div>
  <div class="grupa"><button data-k="ArrowDown">▼</button><button data-k="ArrowUp">▲</button></div>
</div>
<script>
"use strict";

/* ======================================================================
   PORANEK FRANKA — 8-bitowa gra 2D dla 5–6 latków. Sterowanie: strzałki.
   Renderowanie: 480x270 pikseli, powiększane bez wygładzania.
   ====================================================================== */

/* --- USTAWIENIA, KTÓRE ŁATWO ZMIENIĆ ------------------------------- */
const CZAS_MYCIA_ZEBOW = 35;        // bazowe SEKUNDY szczotkowania; ruch skraca je
                                    // 2x (trzymanie strzałki) lub 3x (szorowanie
                                    // lewo-prawo na zmianę)
const DROGA_DO_PRZEDSZKOLA = 7000;  // długość trasy samochodem
const GLOSNOSC_MUZYKI = 0.30;
const GLOSNOSC_NARRATORA = 1.0;
const GLOSNOSC_EFEKTOW = 0.5;
/* ------------------------------------------------------------------- */

const W = 480, H = 270;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

/* ==================== WEJŚCIE ==================== */
const klaw = {};
const KLAWISZE = ['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'];
addEventListener('keydown', e => {
  if (KLAWISZE.includes(e.key)) { e.preventDefault(); if(!klaw[e.key]) klaw[e.key+'_nowy']=true; klaw[e.key]=true; }
  odblokujDzwiek();
});
addEventListener('keyup', e => { if (KLAWISZE.includes(e.key)) { e.preventDefault(); klaw[e.key]=false; } });
addEventListener('blur', () => KLAWISZE.forEach(k => klaw[k]=false));
function nowy(k){ if(klaw[k+'_nowy']){ klaw[k+'_nowy']=false; return true; } return false; }
function czyscNowe(){ KLAWISZE.forEach(k => klaw[k+'_nowy']=false); }

if ('ontouchstart' in window) {
  document.body.classList.add('dotyk');
  document.querySelectorAll('#dotyk button').forEach(b => {
    const k = b.dataset.k;
    const on = e => { e.preventDefault(); if(!klaw[k]) klaw[k+'_nowy']=true; klaw[k]=true; odblokujDzwiek(); };
    const off = e => { e.preventDefault(); klaw[k]=false; };
    b.addEventListener('touchstart', on, {passive:false}); b.addEventListener('touchend', off);
    b.addEventListener('touchcancel', off); b.addEventListener('mousedown', on);
    b.addEventListener('mouseup', off); b.addEventListener('mouseleave', off);
  });
}
function klikniecieWPlansze(){
  odblokujDzwiek(); cv.focus();
  if (G.ekran==='intro' || G.ekran==='karta' || G.ekran==='koniec') klaw['ArrowUp_nowy'] = true;
}

/* Telefon: pełny ekran + blokada w poziomie. Da się wywołać tylko z gestu
   użytkownika, więc siedzi na dotknięciu ekranu proszącego o obrót. */
function naPelnyEkran(){
  const el = document.documentElement;
  const zadaj = el.requestFullscreen || el.webkitRequestFullscreen;
  if(zadaj){
    const p = zadaj.call(el);
    if(p && p.then) p.then(zablokujPoziomo).catch(()=>{});
    else zablokujPoziomo();
  }
}
function zablokujPoziomo(){
  try{
    if(screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(()=>{});
  }catch(e){}
}
document.getElementById('obroc').addEventListener('click', () => { odblokujDzwiek(); naPelnyEkran(); });
['pointerdown','mousedown','touchstart'].forEach(z =>
  cv.addEventListener(z, klikniecieWPlansze, {passive:true}));

/* ==================== DŹWIĘK ==================== */
/* Pliki z ElevenLabs (audio/*.mp3). Gdy ich nie ma – awaryjne piszczenie
   z WebAudio, żeby gra nigdy nie była niema. */
let dzwiekWlaczony = true, dzwiekOdblokowany = false;
const KAT_AUDIO = 'audio/';
const PLIKI = (typeof AUDIO_WBUDOWANE !== 'undefined') ? AUDIO_WBUDOWANE : null;
const bufory = {};          // klucz -> HTMLAudioElement (wzorzec)
const gotowe = {};          // klucz -> czy da się odtworzyć

function zrodlo(klucz){ return PLIKI ? (PLIKI[klucz] || null) : (KAT_AUDIO + klucz + '.mp3'); }
function wczytajAudio(klucz, glosnosc, petla){
  const src = zrodlo(klucz);
  if(!src) return null;
  const a = new Audio();
  a.preload = 'auto';
  a.loop = !!petla;
  a.volume = glosnosc;
  a.addEventListener('canplaythrough', () => { gotowe[klucz] = true; });
  a.addEventListener('error', () => { gotowe[klucz] = false; });
  a.src = src;
  bufory[klucz] = a;
  return a;
}

let AC = null;
function odblokujDzwiek(){
  if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(AC && AC.state === 'suspended') AC.resume();
  dzwiekOdblokowany = true;
}
function ton(f, dl, typ='square', gl=0.06, op=0){
  if(!AC || !dzwiekWlaczony) return;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = typ; o.frequency.value = f;
  g.gain.setValueAtTime(0, AC.currentTime+op);
  g.gain.linearRampToValueAtTime(gl, AC.currentTime+op+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime+op+dl);
  o.connect(g); g.connect(AC.destination);
  o.start(AC.currentTime+op); o.stop(AC.currentTime+op+dl+0.02);
}
const ZAPAS = {                       // awaryjne chiptune'y
  sfx_skok(){ ton(420,0.10,'square',0.05); ton(660,0.09,'square',0.04,0.05); },
  sfx_zbierz(){ ton(880,0.07,'square',0.05); ton(1180,0.12,'square',0.05,0.07); },
  sfx_sukces(){ [523,659,784,1047].forEach((f,i)=>ton(f,0.2,'square',0.06,i*0.1)); },
  sfx_zle(){ ton(200,0.12,'sawtooth',0.05); ton(150,0.16,'sawtooth',0.05,0.1); },
  sfx_bum(){ ton(90,0.2,'sawtooth',0.07); },
  sfx_drzwi(){ [660,880,1047].forEach((f,i)=>ton(f,0.14,'square',0.05,i*0.08)); }
};
const KLUCZE_SFX = ['sfx_skok','sfx_zbierz','sfx_sukces','sfx_zle','sfx_bum','sfx_drzwi'];
function sfx(klucz){
  if(!dzwiekWlaczony) return;
  const wzor = bufory[klucz];
  if(wzor && gotowe[klucz]){
    const k = wzor.cloneNode();
    k.volume = GLOSNOSC_EFEKTOW;
    k.play().catch(()=>{});
    return;
  }
  if(ZAPAS[klucz]) ZAPAS[klucz]();
}

/* --- narrator (Franek nie umie czytać, więc wszystko jest mówione) --- */
let mowaTeraz = null, kolejkaMowy = [];
function mow(...klucze){
  if(!dzwiekWlaczony) return;
  kolejkaMowy = klucze.filter(Boolean);
  nastepnaMowa(true);
}
function dopowiedz(klucz){
  if(!dzwiekWlaczony || !klucz) return;
  kolejkaMowy.push(klucz);
  if(!mowaTeraz) nastepnaMowa(false);
}
function nastepnaMowa(przerwij){
  if(przerwij && mowaTeraz){ try{ mowaTeraz.pause(); mowaTeraz.currentTime = 0; }catch(e){} mowaTeraz = null; }
  if(mowaTeraz) return;
  const k = kolejkaMowy.shift();
  if(!k) return;
  const wzor = bufory[k];
  if(!wzor || !gotowe[k]){ nastepnaMowa(false); return; }
  const a = wzor.cloneNode();
  a.volume = GLOSNOSC_NARRATORA;
  a.addEventListener('ended', () => { mowaTeraz = null; nastepnaMowa(false); });
  a.addEventListener('error', () => { mowaTeraz = null; nastepnaMowa(false); });
  mowaTeraz = a;
  a.play().catch(() => { mowaTeraz = null; nastepnaMowa(false); });
}
function cisza(){
  kolejkaMowy = [];
  if(mowaTeraz){ try{ mowaTeraz.pause(); }catch(e){} mowaTeraz = null; }
}

/* --- muzyka --- */
let muzykaTeraz = null, muzykaKlucz = null;
function graj(klucz){
  if(muzykaKlucz === klucz){
    if(muzykaTeraz && muzykaTeraz.paused && dzwiekWlaczony) muzykaTeraz.play().catch(()=>{});
    return;
  }
  if(muzykaTeraz){ try{ muzykaTeraz.pause(); }catch(e){} }
  muzykaKlucz = klucz;
  const a = bufory[klucz];
  muzykaTeraz = a || null;
  if(a && dzwiekWlaczony){ a.currentTime = 0; a.volume = GLOSNOSC_MUZYKI; a.play().catch(()=>{}); }
}
const KLUCZE_MUZ = ['muz_menu','muz_gra','muz_jazda','muz_koniec'];
const KLUCZE_MOWA = ['start','koniec','zle','mycie','mycie_koniec','jazda','jedzenie','ups',
  'poziom1','poziom2','poziom3','poziom4','poziom5','poziom6',
  'zad_majtki','zad_spodnie','zad_skarpetki','zad_koszulka','zad_miska','zad_platki','zad_mleko',
  'zad_lyzka','zad_sniadanie','zad_pasta','zad_szczoteczka','zad_zeby','zad_czapka','zad_kurtka',
  'zad_buty','zad_drzwi','zad_samochod','brawo1','brawo2','brawo3','brawo4'];

KLUCZE_MUZ.forEach(k => wczytajAudio(k, GLOSNOSC_MUZYKI, true));
KLUCZE_SFX.forEach(k => wczytajAudio(k, GLOSNOSC_EFEKTOW, false));
KLUCZE_MOWA.forEach(k => wczytajAudio(k, GLOSNOSC_NARRATORA, false));

document.getElementById('glosnik').addEventListener('click', e => {
  e.stopPropagation();
  dzwiekWlaczony = !dzwiekWlaczony;
  e.currentTarget.textContent = dzwiekWlaczony ? '🔊' : '🔇';
  if(!dzwiekWlaczony){ cisza(); if(muzykaTeraz) try{ muzykaTeraz.pause(); }catch(err){} }
  else if(muzykaTeraz) muzykaTeraz.play().catch(()=>{});
});

/* ==================== ZDJĘCIA-GŁOWY ====================
   Głowy i portrety to prawdziwe zdjęcia przerobione na piksele. */
const OBRAZY = {}, obrazkiOK = {};
const NAZWY_OBRAZOW = ['glowa_franek','portret_franek','glowa_tata','portret_tata',

  img.src = wbudowane || (n + '.png');
  OBRAZY[n] = img;
});
function obraz(n){ return obrazkiOK[n] ? OBRAZY[n] : null; }

/* ==================== PALETA I SILNIK SPRITE'ÓW ==================== */
const PAL = {
  '.': null,
  k:'#000000', w:'#fffeff', s:'#bcbcbc', d:'#4f4f4f', a:'#adadad',
  r:'#d82800', R:'#a80020', p:'#fe8170', o:'#fc9838', j:'#ea9e22',
  y:'#f8d878', Y:'#bcbe00', e:'#e4e594',
  b:'#0058f8', B:'#0000bc', c:'#3cbcfc', z:'#64b0ff',
  g:'#00a800', G:'#007800', l:'#b8f818',
  n:'#503000', N:'#ac7c00', m:'#f7d8a5', t:'#fecCc5',
  v:'#7527fe', q:'#fe6ecc'
};
const pamiecSpr = new Map();
function spr(nazwa, wiersze){
  if(pamiecSpr.has(nazwa)) return pamiecSpr.get(nazwa);
  const r = wiersze;
  const sw = r[0].length, sh = r.length;
  const c = document.createElement('canvas');
  c.width = sw; c.height = sh;
  const x = c.getContext('2d');
  for(let j=0;j<sh;j++) for(let i=0;i<sw;i++){
    const kol = PAL[r[j][i]];
    if(kol){ x.fillStyle = kol; x.fillRect(i,j,1,1); }
  }
  pamiecSpr.set(nazwa, c);
  return c;
}
function rysujSpr(nazwa, wiersze, x, y, odbij){
  const c = spr(nazwa, wiersze);
  x = Math.round(x); y = Math.round(y);
  if(odbij){
    ctx.save(); ctx.translate(x + c.width, y); ctx.scale(-1,1);
    ctx.drawImage(c, 0, 0); ctx.restore();
  } else ctx.drawImage(c, x, y);
}
function pr(x,y,w,h,kol){ ctx.fillStyle = kol; ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h)); }
function slonce(x,y,r){                 // pikselowe koło – liczone wiersz po wierszu
  const pr2 = r/2, cx = x + pr2;
  for(let j=0;j<r;j++){
    const dy = j + 0.5 - pr2;
    const pol = Math.sqrt(Math.max(0, pr2*pr2 - dy*dy));
    if(pol < 0.5) continue;
    pr(cx-pol, y+j, pol*2, 1, '#f8d878');
  }
  const wr = pr2*0.55;
  for(let j=0;j<r;j++){
    const dy = j + 0.5 - pr2;
    const pol = Math.sqrt(Math.max(0, wr*wr - dy*dy));
    if(pol < 0.5) continue;
    pr(cx-pol, y+j, pol*2, 1, '#fffeff');
  }
}

/* ==================== POSTACIE ====================
   Głowa to przerobione na piksele zdjęcie, reszta rysowana pikselami.
   Ubranie dochodzi w miarę zbierania rzeczy – widać, że Franek się ubiera. */

const CHOD = [                     // 4-klatkowy cykl chodu
  {a:  4, b: -4, bob:0, dl:10},
  {a:  1, b: -1, bob:1, dl:9},
  {a: -4, b:  4, bob:0, dl:10},
  {a: -1, b:  1, bob:1, dl:9}
];
const SKORA = '#fecCc5', SKORA_C = '#e09a8a';

function rysujFranka(px, py, kier, faza, wPowietrzu, opada){
  const x = Math.round(px), y = Math.round(py);
  const b = bohater(), u = b.ubior, st = G.stroj;
  ctx.save();
  if(kier < 0){ ctx.translate(2*x + 22, 0); ctx.scale(-1, 1); }
  const kl = ((Math.floor(faza) % 4) + 4) % 4;
  const k = CHOD[kl];
  const bob = wPowietrzu ? 0 : k.bob;
  const gy = y + bob;                       // głowa 24x22
  const ty = gy + 21;                       // tułów 14, nogi 10, but 4  => razem 50

  ctx.globalAlpha = 0.25; pr(x+3, y+49, 16, 2, '#000000'); ctx.globalAlpha = 1;

  const barwaNogi  = st.spodnie ? u.spodnie  : u.pizama;
  const barwaNogiC = st.spodnie ? u.spodnieC : u.pizamaPas;
  const barwaStopy  = st.buty ? '#2b2b33' : (st.skarpetki ? '#fffeff' : SKORA);
  const barwaStopyC = st.buty ? '#000000' : (st.skarpetki ? '#bcbcbc' : SKORA_C);
  function noga(dx, dl, tyl){
    const kol = tyl ? barwaNogiC : barwaNogi;
    if(st.spodnie){
      pr(x+7+dx, ty+14, 5, 4, kol);
      pr(x+8+dx, ty+18, 3, dl-4, tyl ? SKORA_C : SKORA);
    } else {
      pr(x+7+dx, ty+14, 5, dl, kol);
    }
    pr(x+6+dx, ty+14+dl, 7, 4, tyl ? barwaStopyC : barwaStopy);
  }
  if(wPowietrzu){ noga(-5, 6, true); noga(4, 6, false); }
  else { noga(k.b, k.dl, true); noga(k.a, k.dl, false); }

  const rekaw = st.kurtka ? u.kurtkaJasna : (st.koszulka ? u.rekawGora : u.pizama);
  const hus = wPowietrzu ? 0 : -k.a;
  const dy = wPowietrzu ? -7 : Math.round(hus/2);
  pr(x+1,  ty+2+dy, 3, 8, rekaw);   pr(x+1,  ty+10+dy, 3, 3, SKORA);
  pr(x+18, ty+2-dy, 3, 8, rekaw);   pr(x+18, ty+10-dy, 3, 3, SKORA);

  if(st.kurtka){
    pr(x+4, ty, 14, 14, u.kurtka);
    pr(x+4, ty, 14, 1, u.kurtkaJasna);
    pr(x+10, ty, 2, 14, u.kurtkaZamek);
  } else if(st.koszulka){
    pr(x+4, ty, 14, 14, u.gora);
    pr(x+4, ty, 14, 1, u.goraJasna);
    for(const [ox,oy] of [[2,3],[8,2],[5,8],[10,9]]) pr(x+4+ox, ty+oy, 3, 3, u.wzor);
  } else {
    pr(x+4, ty, 14, 14, u.pizama);
    for(let j=1;j<14;j+=3) pr(x+4, ty+j, 14, 1, u.pizamaPas);
  }

  const gl = obraz(b.glowa);
  const gw = b.glowaW, gh = b.glowaH, gdy = b.glowaDy;
  if(gl) ctx.drawImage(gl, x + 11 - Math.round(gw/2), gy + gdy, gw, gh);
  else { pr(x, gy, 22, 22, SKORA); pr(x, gy, 22, 6, '#e4e594'); }
  if(st.czapka){
    const cy = gy + gdy;
    pr(x, cy-2, 22, 6, u.czapka);
    pr(x+14, cy-2, 8, 6, u.czapkaDodatek);
    pr(x-2, cy+3, 20, 3, u.czapka);
    pr(x+4, cy+1, 4, 3, '#fffeff');
  }
  ctx.restore();
}

function rysujTate(px, py, kier, faza){
  const x = Math.round(px), y = Math.round(py);
  const b = bohater(), u = b.opiekunUbior;
  ctx.save();
  if(kier < 0){ ctx.translate(2*x + 24, 0); ctx.scale(-1, 1); }
  const kl = ((Math.floor(faza) % 4) + 4) % 4;
  const k = CHOD[kl];
  const gy = y + k.bob, ty = gy + 23;      // głowa 24, tułów 18, nogi 13, but 4 => 58

  ctx.globalAlpha = 0.25; pr(x+4, y+57, 18, 2, '#000000'); ctx.globalAlpha = 1;

  pr(x+9+k.b, ty+18, 6, 13, u.nogiC); pr(x+8+k.b, ty+31, 8, 4, u.butC);
  pr(x+9+k.a, ty+18, 6, 13, u.nogi);  pr(x+8+k.a, ty+31, 8, 4, u.but);

  const hus = -k.a;
  pr(x+1,  ty+4+Math.round(hus/2), 3, 12, u.gora); pr(x+1,  ty+16+Math.round(hus/2), 3, 3, SKORA);
  pr(x+20, ty+4-Math.round(hus/2), 3, 12, u.gora); pr(x+20, ty+16-Math.round(hus/2), 3, 3, SKORA);

  pr(x+4, ty, 16, 18, u.gora);
  pr(x+4, ty, 16, 1, u.goraJasna);
  pr(x+4, ty+16, 16, 2, u.goraCien);

  const gl = obraz(b.glowaOp);
  if(gl) ctx.drawImage(gl, x+2, gy, 20, 24);
  else { pr(x+2, gy, 20, 24, SKORA); pr(x+2, gy+14, 20, 10, '#4f4f4f'); }
  ctx.restore();
}

function blok(x,y,w,h,gora,srodek,dol){
  pr(x,y,w,h,srodek);
  pr(x,y,w,1,gora);
  pr(x,y+h-1,w,1,dol);
  pr(x,y,1,h,gora); pr(x+w-1,y,1,h,dol);
}
function obrys(x,y,w,h){ ctx.strokeStyle='#000000'; ctx.lineWidth=1;
  ctx.strokeRect(Math.round(x)+0.5, Math.round(y)+0.5, Math.round(w)-1, Math.round(h)-1); }

function rysujPlatforme(p){
  const x = Math.round(p.x), y = Math.round(p.y), w = Math.round(p.w), h = Math.round(p.h);
  switch(p.styl){
    case 'podloga':
      pr(x,y,w,h,'#ac7c00'); pr(x,y,w,2,'#e45c10');
      for(let i=0;i<w;i+=16){ pr(x+i,y,1,h,'#503000'); pr(x+i+8,y+3,1,h-3,'#8a5a20'); }
      for(let j=y+8;j<y+h;j+=8) pr(x,j,w,1,'#8a5a20');
      break;
    case 'kafle':
      pr(x,y,w,h,'#c0dfff'); pr(x,y,w,2,'#fffeff');
      for(let i=0;i<w;i+=12) pr(x+i,y+2,1,h-2,'#9290ff');
      for(let j=y+12;j<y+h;j+=12) pr(x,j,w,1,'#9290ff');
      break;
    case 'ziemia':
      pr(x,y,w,h,'#883800'); pr(x,y,w,4,'#00a800'); pr(x,y+4,w,1,'#007800');
      for(let i=0;i<w;i+=8) pr(x+i+3,y+7,2,2,'#503000');
      for(let i=0;i<w;i+=6) pr(x+i,y-2,2,2,'#58d854');
      break;
    case 'lozko':
      blok(x,y,w,h,'#fe6ecc','#b71e7b','#6e0040'); obrys(x,y,w,h);
      pr(x+2,y+2,w-4,5,'#fec4ea');                    // kołdra
      pr(x+3,y-6,14,8,'#fffeff'); obrys(x+3,y-6,14,8); // poduszka
      pr(x-3,y-14,4,h+14,'#ac7c00'); obrys(x-3,y-14,4,h+14);
      pr(x+w-1,y-8,4,h+8,'#ac7c00'); obrys(x+w-1,y-8,4,h+8);
      break;
    case 'pufa':
      blok(x,y,w,h,'#45e082','#00a800','#007800'); obrys(x,y,w,h);
      pr(x+2,y+2,w-4,2,'#b8f818');
      break;
    case 'szafka': case 'komoda': case 'szafkaN': case 'stopien': case 'podest':
      blok(x,y,w,h,'#e45c10','#ac7c00','#503000'); obrys(x,y,w,h);
      if(p.styl==='stopien' || p.styl==='podest'){
        pr(x+1,y+1,w-2,1,'#f7d8a5');
        pr(x, y+h, w, 30, '#883800');            // podstopnica pod schodkiem
        pr(x, y+h, 1, 30, '#503000'); pr(x+w-1, y+h, 1, 30, '#503000');
      }
      else {
        for(let j=1;j<3;j++) pr(x+2, y+Math.round(h*j/3), w-4, 1, '#503000');
        for(let j=0;j<3;j++) pr(x+Math.round(w/2)-1, y+Math.round(h*(j+0.5)/3), 2, 2, '#000000');
      }
      break;
    case 'polka':
      pr(x,y,w,h,'#ac7c00'); pr(x,y,w,1,'#e45c10'); obrys(x,y,w,h);
      pr(x+3,y+h,2,5,'#503000'); pr(x+w-5,y+h,2,5,'#503000');
      break;
    case 'szafa':
      blok(x,y,w,h,'#e45c10','#ac7c00','#503000'); obrys(x,y,w,h);
      pr(x+Math.round(w/2)-1,y+2,2,h-4,'#503000');
      obrys(x+3,y+3,Math.round(w/2)-5,h-6); obrys(x+Math.round(w/2)+2,y+3,Math.round(w/2)-5,h-6);
      pr(x+Math.round(w/2)-4,y+Math.round(h/2),2,2,'#000000');
      pr(x+Math.round(w/2)+3,y+Math.round(h/2),2,2,'#000000');
      break;
    case 'krzeslo':
      pr(x+2,y+6,3,h-6,'#ac7c00'); pr(x+w-5,y+6,3,h-6,'#ac7c00');
      blok(x,y,w,6,'#e45c10','#ac7c00','#503000'); obrys(x,y,w,6);
      pr(x,y-22,4,24,'#ac7c00'); obrys(x,y-22,4,24);
      pr(x,y-22,w-4,4,'#e45c10'); obrys(x,y-22,w-4,4);
      break;
    case 'stol':
      pr(x,y,w,h,'#e45c10'); pr(x,y,w,1,'#f7d8a5'); obrys(x,y,w,h);
      pr(x+6,y+h,4,235-y-h,'#ac7c00'); pr(x+w-10,y+h,4,235-y-h,'#ac7c00');
      break;
    case 'blat':
      pr(x,y,w,h,'#bcbcbc'); pr(x,y,w,1,'#fffeff'); obrys(x,y,w,h);
      blok(x+2,y+h,w-4,235-y-h,'#e45c10','#ac7c00','#503000');
      break;
    case 'lodowka':
      blok(x,y,w,h,'#fffeff','#e4e594','#bcbcbc');
      pr(x,y,w,h,'#f2f6fa'); pr(x,y,w,2,'#fffeff'); pr(x,y+h-2,w,2,'#bcbcbc');
      obrys(x,y,w,h);
      pr(x,y+Math.round(h*0.34),w,1,'#000000');
      pr(x+w-5,y+5,2,Math.round(h*0.28),'#4f4f4f');
      pr(x+w-5,y+Math.round(h*0.4),2,Math.round(h*0.4),'#4f4f4f');
      pr(x+4,y+5,8,6,'#f8d878'); obrys(x+4,y+5,8,6);
      break;
    case 'wanna':
      pr(x,y,w,h,'#fffeff'); obrys(x,y,w,h);
      pr(x+3,y+3,w-6,h-8,'#64b0ff');
      for(let i=0;i<w-10;i+=10) pr(x+6+i,y+5,4,2,'#fffeff');
      break;
    case 'umywalka':
      pr(x,y,w,Math.round(h*0.45),'#fffeff'); obrys(x,y,w,Math.round(h*0.45));
      pr(x+3,y+3,w-6,Math.round(h*0.45)-6,'#c0dfff');
      pr(x+Math.round(w/2)-6,y+Math.round(h*0.45),12,Math.round(h*0.55),'#e4e594');
      obrys(x+Math.round(w/2)-6,y+Math.round(h*0.45),12,Math.round(h*0.55));
      pr(x+Math.round(w/2)-3,y-8,2,8,'#bcbcbc'); pr(x+Math.round(w/2)-3,y-10,8,2,'#bcbcbc');
      break;
    case 'lawka':
      pr(x,y,w,4,'#ac7c00'); pr(x,y,w,1,'#e45c10'); obrys(x,y,w,4);
      pr(x,y+7,w,3,'#ac7c00'); obrys(x,y+7,w,3);
      pr(x+2,y,3,h,'#503000'); pr(x+w-5,y,3,h,'#503000');
      break;
    case 'polkaButy':
      pr(x,y,w,3,'#ac7c00'); obrys(x,y,w,3);
      pr(x,y+9,w,3,'#ac7c00'); obrys(x,y+9,w,3);
      pr(x+1,y,3,h,'#503000'); pr(x+w-4,y,3,h,'#503000');
      break;
    case 'akwarium':
      blok(x, y+h-14, w, 14, '#e45c10', '#ac7c00', '#503000'); obrys(x, y+h-14, w, 14);
      pr(x+4, y-26, w-8, h-12, '#000000');
      pr(x+6, y-24, w-12, h-16, '#3cbcfc');
      pr(x+6, y-24, w-12, 3, '#c0dfff');
      for(let i=0;i<w-16;i+=14) pr(x+10+i, y-6, 4, 6, '#00a800');
      for(const [dx,dy] of [[18,-18],[46,-12],[70,-20]]) pr(x+dx, y+dy, 3, 3, '#fffeff');
      break;
    case 'schodki':
      blok(x,y,w,h,'#fffeff','#bcbcbc','#4f4f4f'); obrys(x,y,w,h);
      pr(x+4,y+5,w-8,h-5,'#adadad');
      break;
    case 'skrzynka':
      blok(x,y,w,h,'#e45c10','#ac7c00','#503000'); obrys(x,y,w,h);
      obrys(x+2,y+2,w-4,h-4);
      break;
    default:
      blok(x,y,w,h,'#e45c10','#ac7c00','#503000'); obrys(x,y,w,h);
  }
}

function glif(zn){
  if(CZC[zn]) return {rzedy: CZC[zn], gora:null, dol:null};   // np. 'v' = strzałka w dół
  const duza = zn.toUpperCase();
  if(CZC[duza]) return {rzedy: CZC[duza], gora:null, dol:null};
  const z = ZDOBIONE[duza];
  if(z) return {rzedy: CZC[z[0]], gora:z[1], dol:z[2]};
  return {rzedy: CZC['?'], gora:null, dol:null};
}
const pamiecTekstu = new Map();
function tekstNaKanwie(t, kol){
  const klucz = t + '␀' + kol;
  if(pamiecTekstu.has(klucz)) return pamiecTekstu.get(klucz);
  const znaki = [...t];
  const c = document.createElement('canvas');
  c.width = Math.max(1, znaki.length * 6); c.height = 9;
  const x = c.getContext('2d');
  x.fillStyle = kol;
  znaki.forEach((zn, i) => {
    const g = glif(zn), ox = i*6;
    if(g.gora) for(let k=0;k<5;k++) if(g.gora[k]==='#') x.fillRect(ox+k, 0, 1, 1);
    for(let j=0;j<7;j++) for(let k=0;k<5;k++)
      if(g.rzedy[j][k]==='#') x.fillRect(ox+k, 1+j, 1, 1);
    if(g.dol) for(let k=0;k<5;k++) if(g.dol[k]==='#') x.fillRect(ox+k, 8, 1, 1);
  });
  if(pamiecTekstu.size > 400) pamiecTekstu.clear();
  pamiecTekstu.set(klucz, c);
  return c;
}

  const c = tekstNaKanwie(t, kol);
  const w = c.width*skala, h = c.height*skala;
  let px = Math.round(x), py = Math.round(y - h/2);
  if(wyr === 'center') px = Math.round(x - w/2);
  ctx.imageSmoothingEnabled = false;
  if(cien) ctx.drawImage(tekstNaKanwie(t, cien), px+skala, py+skala, w, h);
  ctx.drawImage(c, px, py, w, h);
}

/* ==================== PLATFORMÓWKA ==================== */
const GRAW = 0.31, SKOK = 6.9, PREDKOSC = 1.95;
function zachodzi(a,b){ return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y; }

function aktualizujGre(){
  const p = POZ()[G.poziom], g = G.gracz;
  if(G.overlay){ G.overlay.t--; if(G.overlay.t<=0) G.overlay=null; }
  const blok = !!G.overlay;
  const lewo = !blok && klaw.ArrowLeft, prawo = !blok && klaw.ArrowRight;

  if(lewo && !prawo){ g.vx = -PREDKOSC; g.kier = -1; }
  else if(prawo && !lewo){ g.vx = PREDKOSC; g.kier = 1; }
  else g.vx = 0;

  if(!blok && nowy('ArrowUp')) g.bufor = 10;
  if(g.bufor>0) g.bufor--;
  if(g.coyote>0) g.coyote--;
  if(g.bufor>0 && g.coyote>0){ g.vy = -SKOK; g.bufor=0; g.coyote=0; sfx('sfx_skok'); }

  g.vy += GRAW;
  if(g.vy > 8.5) g.vy = 8.5;

  g.x += g.vx;
  for(const pl of p.platformy) if(!pl.przenikalna && zachodzi(g,pl)){
    if(g.vx>0) g.x = pl.x - g.w; else if(g.vx<0) g.x = pl.x + pl.w;
  }
  if(g.x < 0) g.x = 0;
  if(g.x + g.w > p.szer) g.x = p.szer - g.w;

  g.ziemia = false;
  const staryDol = g.y + g.h;
  g.y += g.vy;
  for(const pl of p.platformy){
    if(!zachodzi(g,pl)) continue;
    if(pl.przenikalna){
      if(g.vy > 0 && staryDol <= pl.y + 1){ g.y = pl.y - g.h; g.vy = 0; g.ziemia = true; }
    } else if(g.vy>0){ g.y = pl.y - g.h; g.vy=0; g.ziemia=true; }
    else if(g.vy<0){ g.y = pl.y + pl.h; g.vy=0; }
  }
  if(g.ziemia){ g.coyote = 8; g.bezpiecz = {x:g.x, y:g.y-2}; }
  if(g.y > H + 100){ g.x = g.bezpiecz.x; g.y = g.bezpiecz.y - 20; g.vy = 0; }
  if(Math.abs(g.vx)>0.1 && g.ziemia) g.chodT += 0.16;

  const cel = Math.max(0, Math.min(p.szer - W, g.x + g.w/2 - W/2));
  G.kamera += (cel - G.kamera) * 0.12;

  if(p.tata){
    const t = G.tata;
    t.x += ((g.x - 38) - t.x) * 0.045;
    t.y += ((g.y + g.h - 58) - t.y) * 0.12;
  }

  if(!blok){
    for(let i=0;i<p.zadania.length;i++){
      const z = p.zadania[i];
      if(z.wziete) continue;
      const box = {x:z.x-13, y:z.y-14, w:26, h:28};
      if(!zachodzi(g,box)) continue;
      if(i !== G.zrobione){
        if(G.infoT<=0){ sfx('sfx_zle'); pokazInfo('Najpierw ' + tekstZadania(p, G.zrobione).toLowerCase()); mow('zle'); }
        continue;
      }
      if(z.typ === 'zeby'){ startMycia(); return; }
      z.wziete = true; G.zrobione++;
      G.ekwipunek.push(z.typ);
      const slot = z.stroj || z.typ;                 // legginsy -> spodnie, bluza -> koszulka
      if(z.zdejmij) G.stroj[z.zdejmij] = false;      // w szatni rzeczy się zdejmuje
      else if(slot in G.stroj) G.stroj[slot] = true;
      sfx('sfx_zbierz');
      iskry(z.x, z.y, ['#f8d878','#fffeff','#58d854','#3cbcfc']);
      const brawo = 'brawo' + (1 + ((Math.random()*4)|0));
      if(z.typ === 'sniadanie'){ G.overlay = {typ:'jedzenie', t:150}; mow('jedzenie'); }
      else mow(brawo, glosZadania(p, G.zrobione));
      G.ostatnieZadanie = G.zrobione;
    }
  }

  if(G.zrobione >= p.zadania.length && !blok){
    ogloszZadanie(false);
    const d = p.drzwi;
    if(zachodzi(g,{x:d.x,y:d.y,w:d.w,h:d.h})){
      sfx('sfx_sukces'); cisza();
      iskry(d.x+d.w/2, d.y+d.h/2, ['#f8d878','#fffeff','#58d854'], 26);
      if(G.poziom+1 < POZ().length) kartaPoziomu(G.poziom+1);
      else { G.ekran = 'koniec'; graj('muz_koniec'); mow(bohater().glosKoniec); }
    }
  }
  aktualizujEfekty();
  czyscNowe();
}
function tekstZadania(p, idx){
  if(idx >= p.zadania.length) return 'Idź do ' + (p.drzwi.auto ? 'samochodu' : 'drzwi') + '!';
  const z = p.zadania[idx];
  return z.zadanie || ('Znajdź ' + NAZWY[z.typ] + '!');
}

/* ==================== MINIGRA: MYCIE ZĘBÓW ==================== */
function startMycia(){
  G.mycie = { poz:0.5, ostatnia:0.5, seg:new Array(10).fill(0),
    czas:CZAS_MYCIA_ZEBOW*60, max:CZAS_MYCIA_ZEBOW*60, koniecT:0, dzwiekT:0,
    kier:0, bonus:0 };
  G.ekran = 'mycie';
  cisza(); mow('mycie');
}
function aktualizujMycie(){
  const m = G.mycie;
  if(m.koniecT > 0){
    m.koniecT--;
    if(m.koniecT === 0){
      const p = POZ()[G.poziom];
      p.zadania[G.zrobione].wziete = true;
      G.zrobione++; G.ostatnieZadanie = -1;
      G.ekran = 'gra'; graj('muz_gra'); ogloszZadanie(false);
    }
    aktualizujEfekty(); return;
  }
  m.ostatnia = m.poz;
  let ruch = 0;
  if(klaw.ArrowLeft) ruch -= 1;
  if(klaw.ArrowRight) ruch += 1;
  m.poz = Math.max(0, Math.min(1, m.poz + ruch*0.022));
  // zmiana kierunku = prawdziwe szorowanie, dokłada premię do tempa
  if(ruch !== 0 && ruch !== m.kier){ m.kier = ruch; m.bonus = 45; }
  if(m.bonus > 0) m.bonus--;
  if(Math.abs(m.poz - m.ostatnia) > 0.004){
    const tempo = m.bonus > 0 ? 3 : 2;      // ruch przyspiesza zegar co najmniej 2x
    m.czas -= tempo;
    const i = Math.min(9, Math.max(0, Math.floor(m.poz*10)));
    m.seg[i] = Math.min(1, m.seg[i] + 0.0072*tempo);
    if(m.dzwiekT-- <= 0){ ton(300+Math.random()*300, 0.04, 'sawtooth', 0.02); m.dzwiekT = 5; }
    if(Math.random()<0.3) G.czastki.push({x:60+m.poz*350, y:135+(Math.random()-0.5)*40,
      vx:(Math.random()-0.5)*1.2, vy:-0.6-Math.random(), zyc:25+Math.random()*15, kol:'#fffeff', r:1+Math.random()*2});
  }
  if(m.czas <= 0 && m.koniecT === 0){
    m.koniecT = 140; sfx('sfx_sukces'); mow('mycie_koniec');
    iskry(W/2, 130, ['#fffeff','#3cbcfc','#f8d878'], 30);
  }
  aktualizujEfekty(); czyscNowe();
}
function rysujMycie(){
  const m = G.mycie;
  pr(0,0,W,H,'#c0dfff');
  for(let j=0;j<14;j++) for(let i=0;i<24;i++){
    pr(i*20,j*20,19,19,'#d3d2ff'); pr(i*20,j*20,19,1,'#fffeff'); pr(i*20,j*20+18,19,1,'#9290ff');
  }
  const czyste = m.seg.reduce((a,b)=>a+b,0)/10;
  // usta
  pr(50,95,380,110,'#000000'); pr(52,97,376,106,'#fe6ecc'); pr(60,105,360,90,'#a80020');
  // zęby: górny i dolny rząd
  for(const gy of [108, 158]){
    for(let i=0;i<10;i++){
      const x = 66 + i*35, cz = m.seg[i];
      pr(x, gy, 31, 36, '#000000');
      pr(x+1, gy+1, 29, 34, '#fffeff');
      if(cz < 1){
        const wys = Math.round(34*(1-cz));
        pr(x+1, gy+1, 29, wys, '#bcbe00');
        if(wys > 6){ pr(x+6, gy+4, 5, 5, '#ac7c00'); pr(x+18, gy+6, 6, 4, '#ac7c00'); }
      }
    }
  }
  pr(64,148,352,10,'#6e0040');           // język / szpara
  // szczoteczka
  const bx = Math.round(60 + m.poz*350);
  ctx.save(); ctx.translate(bx, 120); ctx.scale(2.5,2.5);
  ctx.drawImage(spr('ik_szczoteczka', IKONY.szczoteczka), -8, -8);
  ctx.restore();
  rysujEfekty();
  // zegar
  const sek = Math.max(0, Math.ceil(120 * m.czas / m.max));
  ramka(W/2-42, 8, 84, 26, '#0000bc');
  napis(Math.floor(sek/60)+':'+String(sek%60).padStart(2,'0'), W/2, 21, '#3cbcfc', '#000000', 2);
  // pasek czystości
  pr(88,225,304,16,'#000000'); pr(90,227,300,12,'#4f4f4f');
  pr(90,227,Math.round(300*czyste),12,'#58d854');
  napis('CZYSTE ZĄBKI '+Math.round(czyste*100)+'%', W/2, 233, '#fffeff', '#000000', 1);
  napis('NACISKAJ  <  I  >', W/2, 62, '#fffeff', '#000000', 2);
  if(m.koniecT > 0){
    ctx.globalAlpha = 0.8; pr(0,0,W,H,'#fffeff'); ctx.globalAlpha = 1;
    napis('ZĄBKI CZYŚCIUTKIE!', W/2, 120, '#0058f8', '#000000', 2);
    napis('* * *', W/2, 160, '#f8d878', '#000000', 2.4);
  }
}

/* ==================== MINIGRA: JAZDA ==================== */
const PASY = [143, 178, 213];
function startJazdy(){
  G.jazda = { pas:1, y:PASY[1], predkosc:2.5, dystans:0, przeszkody:[], nastepna:200,
    stlucz:0, trzes:0, ups:0, koniecT:0 };
  G.czastki = []; G.ekran = 'jazda';
  graj('muz_jazda'); mow('jazda');
}
const TYPY_PRZESZKOD = ['kaluza','stozek','dziura','auto'];
function aktualizujJazde(){
  const j = G.jazda;
  if(j.koniecT>0){ j.koniecT--; if(j.koniecT===0){ kartaPoziomu(G.poziom+1); }
    aktualizujEfekty(); return; }
  if(nowy('ArrowUp') && j.pas>0){ j.pas--; ton(700,0.06,'square',0.03); }
  if(nowy('ArrowDown') && j.pas<2){ j.pas++; ton(500,0.06,'square',0.03); }
  j.y += (PASY[j.pas] - j.y) * 0.18;

  let docelowa = 2.5;
  if(klaw.ArrowRight) docelowa = 4.5;
  if(klaw.ArrowLeft) docelowa = 1.1;
  if(j.stlucz>0){ docelowa = 0.8; j.stlucz--; }
  j.predkosc += (docelowa - j.predkosc) * 0.06;
  j.dystans += j.predkosc;
  if(j.trzes>0) j.trzes--;
  if(j.ups>0) j.ups--;

  j.nastepna -= j.predkosc;
  if(j.nastepna <= 0 && j.dystans < DROGA_DO_PRZEDSZKOLA - 700){
    const pas = (Math.random()*3)|0;
    j.przeszkody.push({x:W+40, pas, y:PASY[pas], typ:TYPY_PRZESZKOD[(Math.random()*TYPY_PRZESZKOD.length)|0], trafiona:false});
    j.nastepna = 110 + Math.random()*110;
  }
  for(let i=j.przeszkody.length-1;i>=0;i--){
    const o = j.przeszkody[i];
    o.x -= j.predkosc * (o.typ==='auto' ? 0.7 : 1);
    if(o.x < -70){ j.przeszkody.splice(i,1); continue; }
    if(!o.trafiona && Math.abs(o.x - 100) < 32 && Math.abs(o.y - j.y) < 21){
      o.trafiona = true; j.stlucz = 60; j.trzes = 22; j.ups = 90;
      sfx('sfx_bum'); mow('ups');
      iskry(100, j.y, ['#f8d878','#fc9838','#fffeff'], 16);
    }
  }
  if(j.dystans >= DROGA_DO_PRZEDSZKOLA && j.koniecT === 0){
    j.koniecT = 180; sfx('sfx_sukces');
    for(let i=0;i<50;i++) G.czastki.push({x:Math.random()*W, y:-10-Math.random()*100,
      vx:(Math.random()-0.5)*1, vy:0.6+Math.random()*1.6, zyc:200,
      kol:['#d82800','#f8d878','#58d854','#3cbcfc','#fe6ecc'][(Math.random()*5)|0], r:2+Math.random()*2});
  }
  aktualizujEfekty(); czyscNowe();
}

/* ==================== MINIGRA: WYŚCIG DO FURTKI ====================
   Naciskanie ◀ i ▶ na zmianę rozpędza bohatera. Opiekun biegnie tuż obok,
   ale zawsze przegrywa o włos – dziecko ma wygrać. */
const META_WYSCIGU = 1400;
function startWyscigu(){
  G.wyscig = {
    x:0, v:0, opiekun:-30, ostatni:0, odliczanie:180,
    faza:0, koniecT:0, machanie:0
  };
  G.czastki = []; G.ekran = 'wyscig';
  graj('muz_jazda'); mow('wyscig_start', 'wyscig');
}
function aktualizujWyscig(){
  const w = G.wyscig;
  if(w.odliczanie > 0){ w.odliczanie--; aktualizujEfekty(); czyscNowe(); return; }
  if(w.koniecT > 0){
    w.koniecT--;
    if(w.koniecT === 0) kartaPoziomu(G.poziom + 1);
    aktualizujEfekty(); czyscNowe(); return;
  }
  // naprzemienne stukanie w strzałki dodaje prędkości
  if(nowy('ArrowLeft')  && w.ostatni !== -1){ w.v += 0.55; w.ostatni = -1; sfx('sfx_skok'); }
  if(nowy('ArrowRight') && w.ostatni !==  1){ w.v += 0.55; w.ostatni =  1; sfx('sfx_skok'); }
  if(klaw.ArrowRight || klaw.ArrowLeft) w.v += 0.012;      // samo trzymanie też działa
  w.v = Math.max(0, Math.min(3.4, w.v - 0.028));
  w.x += w.v;
  w.faza += w.v * 0.22;

  // opiekun goni, ale nie wyprzedza – trzyma się tuż za bohaterem
  const celOp = Math.min(w.x - 12, META_WYSCIGU - 90);
  w.opiekun += (celOp - w.opiekun) * 0.05;

  if(w.x >= META_WYSCIGU && w.koniecT === 0){
    w.koniecT = 190; sfx('sfx_sukces'); mow('wygrana');
    for(let i=0;i<60;i++) G.czastki.push({x:Math.random()*W, y:-8-Math.random()*80,
      vx:(Math.random()-0.5)*1, vy:0.6+Math.random()*1.6, zyc:200,
      kol:['#d82800','#f8d878','#58d854','#3cbcfc','#fe6ecc'][(Math.random()*5)|0], r:2+Math.random()*2});
  }
  aktualizujEfekty(); czyscNowe();
}
function rysujWyscig(){
  const w = G.wyscig;
  const kam = Math.max(0, Math.min(META_WYSCIGU - W + 140, w.x - 120));
  pr(0,0,W,150,'#5c94fc');
  slonce(392,16,32);
  const c1 = -Math.round(kam*0.15)%620;
  for(let k=0;k<2;k++) for(const [x,y] of [[70,26],[300,44],[500,20]])
    rysujSpr('ch',CHMURA, x+c1+k*620, y, false);
  // płot i domki
  const c2 = -Math.round(kam*0.55)%420;
  for(let k=-1;k<4;k++){ const px=c2+k*420;
    for(let i=0;i<2;i++){
      const x = px+i*210, kol = ['#f7d8a5','#b3f3cc','#fec4ea','#d3d2ff'][((k+4)*2+i)%4];
      pr(x,74,96,76,kol); obrys(x,74,96,76);
      ctx.fillStyle='#a80020';
      ctx.beginPath(); ctx.moveTo(x-9,76); ctx.lineTo(x+48,44); ctx.lineTo(x+105,76); ctx.closePath(); ctx.fill();
      pr(x+14,92,24,20,'#64b0ff'); obrys(x+14,92,24,20);
      pr(x+58,92,24,20,'#64b0ff'); obrys(x+58,92,24,20);
    }
  }
  const c3 = -Math.round(kam*0.8)%150;
  for(let k=-1;k<5;k++){ const x=c3+k*150+20;
    pr(x,118,8,32,'#503000'); pr(x,118,3,32,'#883800');
    pr(x-10,80,28,8,'#00a800'); pr(x-16,88,40,14,'#00a800'); pr(x-10,102,28,8,'#00a800');
    pr(x-10,80,28,2,'#58d854'); pr(x+4,94,10,4,'#007800'); }

  // trawnik, chodnik, jezdnia
  pr(0,150,W,12,'#58d854'); pr(0,158,W,4,'#00a800');
  pr(0,162,W,54,'#bcbcbc'); pr(0,162,W,3,'#fffeff');
  for(let i=-(Math.round(kam)%40); i<W; i+=40) pr(i,165,2,51,'#9290ff');
  pr(0,216,W,H-216,'#4f4f4f'); pr(0,216,W,2,'#adadad');
  for(let i=-(Math.round(kam*1.1)%56); i<W; i+=56) pr(i,242,30,3,'#f8d878');

  // meta – furtka przedszkola
  const fx = Math.round(META_WYSCIGU - kam) + 40;
  if(fx < W + 80){
    pr(fx-6,104,8,112,'#503000'); pr(fx+58,104,8,112,'#503000');
    pr(fx-10,96,80,10,'#d82800'); obrys(fx-10,96,80,10);
    for(let i=0;i<5;i++) pr(fx+2+i*12,114,6,102,'#f8d878');
    pr(fx-2,136,68,5,'#f8d878'); pr(fx-2,178,68,5,'#f8d878');
    napis('PRZEDSZKOLE', fx+30, 86, '#fffeff', '#000000', 1.3);
  }

  const bx = Math.round(w.x - kam) + 60;
  const ox = Math.round(w.opiekun - kam) + 60;
  rysujTate(ox, 158, 1, w.faza);
  rysujFranka(bx, 166, 1, w.faza, false, false);
  rysujEfekty();

  // pasek postępu
  pr(0,0,W,20,'#000000'); pr(0,20,W,1,'#4f4f4f');
  napisL('WYŚCIG DO FURTKI', 4, 10, '#fffeff', null, 1);
  const post = Math.min(1, w.x/META_WYSCIGU);
  pr(W/2-80,26,160,12,'#000000'); pr(W/2-78,28,156,8,'#4f4f4f');
  pr(W/2-78,28,Math.round(156*post),8,'#58d854');

  if(w.odliczanie > 0){
    const sek = Math.ceil(w.odliczanie/60);
    napis(sek > 0 ? String(sek) : 'START!', W/2, 100, '#f8d878', '#000000', 6);
  } else if(w.koniecT > 0){
    ctx.globalAlpha=0.6; pr(0,0,W,H,'#000000'); ctx.globalAlpha=1;
    napis(bohater().imie + ' WYGRYWA!', W/2, 110, '#f8d878', '#000000', 3);
    napis('BRAWO!', W/2, 145, '#fffeff', '#000000', 2);
  } else {
    napis('NACISKAJ  <  >  NA ZMIANĘ', W/2, 258, '#fffeff', '#000000', 1.6);
  }
}

  const im = obraz(nazwa);
  if(!im || !im.naturalWidth) return false;
  let s = 3;
  while(s > 1 && (im.naturalWidth*s > maxW || im.naturalHeight*s > maxH)) s--;
  const w = im.naturalWidth*s, h = im.naturalHeight*s;
  ctx.drawImage(im, Math.round(cx - w/2), Math.round(dolY - h), w, h);
  return true;
}

/* ==================== PĘTLA GŁÓWNA ==================== */
let ostatni = 0, akum = 0;
function petla(ts){
  requestAnimationFrame(petla);
  if(!ostatni) ostatni = ts;
  let dt = (ts - ostatni)/1000; ostatni = ts;
  if(dt > 0.25) dt = 0.25;
  akum += dt;
  let kroki = 0;
  while(akum >= 1/60 && kroki < 5){ akum -= 1/60; krok(); kroki++; }
  rysuj();
}
function krok(){
  G.t++;
  switch(G.ekran){
    case 'wybor':
      if(nowy('ArrowLeft') && G.kto !== 'franek'){ G.kto='franek'; sfx('sfx_zbierz'); }
      if(nowy('ArrowRight') && G.kto !== 'pola'){ G.kto='pola'; sfx('sfx_zbierz'); }
      if(nowy('ArrowUp')){ sfx('sfx_sukces'); G.ekran='intro'; mow(bohater().glosStart); }
      czyscNowe(); break;
    case 'intro':
      if(nowy('ArrowUp')){ sfx('sfx_sukces'); nowaGra(); kartaPoziomu(0); }
      czyscNowe(); break;
    case 'karta':
      G.kartaT++;
      if(G.kartaT > 60 && (nowy('ArrowUp')||nowy('ArrowRight')||nowy('ArrowLeft'))) startPoziomu(G.poziom);
      else if(G.kartaT > 260) startPoziomu(G.poziom);
      czyscNowe(); break;
    case 'gra': aktualizujGre(); break;
    case 'mycie': aktualizujMycie(); break;
    case 'jazda': aktualizujJazde(); break;
    case 'wyscig': aktualizujWyscig(); break;
    case 'koniec':
      if(G.t % 5 === 0 && G.czastki.length < 120)
        G.czastki.push({x:Math.random()*W, y:-6, vx:(Math.random()-0.5)*1, vy:0.6+Math.random()*1.4,
          zyc:240, kol:['#d82800','#f8d878','#58d854','#3cbcfc','#fe6ecc'][(Math.random()*5)|0], r:2+Math.random()*2});
      aktualizujEfekty();
      if(nowy('ArrowUp')){ G.czastki=[]; G.ekran='wybor'; graj('muz_menu'); mow('wybor'); }
      czyscNowe(); break;
  }
}
function rysuj(){
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0,0,W,H);
  switch(G.ekran){
    case 'wybor': rysujWybor(); break;
    case 'intro': rysujIntro(); break;
    case 'karta': rysujKarte(); break;
    case 'gra': rysujGre(); break;
    case 'mycie': rysujMycie(); break;
    case 'jazda': rysujJazde(); break;
    case 'wyscig': rysujWyscig(); break;
    case 'koniec': rysujKoniec(); break;
  }
}
// muzyka menu + powitanie startują po pierwszym geście gracza
let powitano = false;
function powitaj(){ if(powitano) return; powitano = true; graj('muz_menu'); mow('wybor'); }
['keydown','pointerdown','touchstart'].forEach(z => addEventListener(z, powitaj, {once:false}));
requestAnimationFrame(petla);
