/* ==================== MINIGRA: KĄPIEL ====================
   Myjemy się cały, część po części, w tej samej kolejności co naprawdę:
   szyja, głowa, ręce, nogi, pupa, stopy – a na koniec wycieramy ręcznikiem.
   Szoruje się tak samo jak ząbki: ◀ ▶ na zmianę, bo liczy się zmiana kierunku. */
const CZESCI_CIALA = [
  {id:'szyja', nazwa:'SZYJA',  glos:'kapiel_szyja', x:226, y:92,  w:28, h:16},
  {id:'glowa', nazwa:'GŁOWA',  glos:'kapiel_glowa', x:212, y:48,  w:56, h:48},
  {id:'rece',  nazwa:'RĘCE',   glos:'kapiel_rece',  x:192, y:106, w:96, h:52},
  {id:'nogi',  nazwa:'NOGI',   glos:'kapiel_nogi',  x:212, y:170, w:56, h:44},
  {id:'pupa',  nazwa:'PUPA',   glos:'kapiel_pupa',  x:210, y:148, w:60, h:26},
  {id:'stopy', nazwa:'STOPY',  glos:'kapiel_stopy', x:206, y:208, w:68, h:18}
];
function startKapieli(){
  const brud = CZESCI_CIALA.map((c, i) => {
    const plamy = [];
    for(let p=0;p<6;p++)
      plamy.push({ x: 4 + ((i*17 + p*29) % Math.max(1, c.w-12)),
                   y: 3 + ((i*11 + p*13) % Math.max(1, c.h-8)),
                   r: 2 + (p % 3) });
    return { ile:1, plamy };
  });
  G.kapiel = { etap:'mycie', i:0, poz:0.5, ostatnia:0.5, kier:0, bonus:0,
               brud, mokro:1, czas:90*60, koniecT:0, dzwiekT:0, blysk:0 };
  G.czastki = []; G.ekran = 'kapiel';
  graj('muz_gra');
  cisza(); mow(najlepszyGlos('kapiel_jak'), najlepszyGlos(CZESCI_CIALA[0].glos));
}
function strefaKapieli(k){ return CZESCI_CIALA[k.i]; }
function zmienCzesc(k, nowa){
  if(nowa < 0 || nowa >= CZESCI_CIALA.length || nowa === k.i) return;
  k.i = nowa; k.blysk = 30; k.poz = 0.5;
  dopowiedz(CZESCI_CIALA[nowa].glos);
}
/* ▲ ▼ przeskakują tylko na te części, które są jeszcze brudne – dzięki temu
   nie da się utknąć na wyszorowanej już nóżce */
function nastepnaBrudna(k, kierunek){
  for(let d=1; d<=CZESCI_CIALA.length; d++){
    const i = k.i + kierunek*d;
    if(i < 0 || i >= CZESCI_CIALA.length) continue;
    if(k.brud[i].ile > 0) return i;
  }
  return k.i;
}
function aktualizujKapiel(){
  const k = G.kapiel;
  if(k.koniecT > 0){
    k.koniecT--;
    if(k.koniecT === 0){ G.brud = 0; owinWRecznik(); dalejPoPoziomie(); }
    aktualizujEfekty(); czyscNowe(); return;
  }
  if(k.blysk > 0) k.blysk--;
  k.czas--;

  if(k.etap === 'mycie'){
    if(nowy('ArrowUp'))   zmienCzesc(k, nastepnaBrudna(k, -1));
    if(nowy('ArrowDown')) zmienCzesc(k, nastepnaBrudna(k, +1));
  }

  k.ostatnia = k.poz;
  let ruch = 0;
  if(klaw.ArrowLeft) ruch -= 1;
  if(klaw.ArrowRight) ruch += 1;
  k.poz = Math.max(0, Math.min(1, k.poz + ruch*0.03));
  if(ruch !== 0 && ruch !== k.kier){          // zmiana kierunku = jedno pociągnięcie
    k.kier = ruch; k.bonus = 40; sfx('sfx_skok');
  }
  if(k.bonus > 0) k.bonus--;

  const przesuniecie = Math.abs(k.poz - k.ostatnia);
  const szoruje = przesuniecie > 0.004 && k.bonus > 0;
  const c = strefaKapieli(k);

  if(przesuniecie > 0.004){
    if(k.dzwiekT-- <= 0){ ton(200 + Math.random()*180, 0.05, 'sawtooth', 0.02); k.dzwiekT = 6; }
    const gx = c.x + k.poz*(c.w-16) + 8, gy = c.y + c.h/2;
    if(k.etap === 'mycie'){
      const z = k.brud[k.i], przed = z.ile;
      z.ile = Math.max(0, z.ile - (szoruje ? 0.007 : 0.0012));
      if(Math.random() < (szoruje ? 0.7 : 0.2))
        G.czastki.push({x:gx + (Math.random()-0.5)*14, y:gy + (Math.random()-0.5)*14,
                        vx:(Math.random()-0.5)*1.2, vy:-0.6-Math.random(),
                        zyc:24+Math.random()*16, kol:'#fffeff', r:1+Math.random()*2});
      if(przed > 0 && z.ile === 0){
        sfx('sfx_zbierz');
        const nastepna = k.brud.findIndex(b => b.ile > 0);
        if(nastepna >= 0){ dopowiedz('kapiel_czysta'); zmienCzesc(k, nastepna); }
      }
    } else {
      k.mokro = Math.max(0, k.mokro - (szoruje ? 0.005 : 0.0009));
    }
  }
  // gdyby dziecko utknęło – po dwóch minutach kąpiel kończy się sama
  if(k.czas <= 0){
    if(k.etap === 'mycie') k.brud.forEach(b => b.ile = 0);
    else k.mokro = 0;
  }

  if(k.etap === 'mycie' && k.brud.every(b => b.ile <= 0)){
    k.etap = 'recznik'; k.poz = 0.5; k.kier = 0; k.bonus = 0; k.czas = 60*60;
    sfx('sfx_sukces'); cisza(); mow(najlepszyGlos('kapiel_recznik'));
    iskry(240, 140, ['#fffeff','#3cbcfc','#f8d878'], 30);
  } else if(k.etap === 'recznik' && k.mokro <= 0){
    k.etap = 'gotowe'; k.koniecT = 180;
    sfx('sfx_sukces'); cisza(); mow(najlepszyGlos('kapiel_koniec'));
    iskry(240, 140, ['#fffeff','#f8d878','#fe6ecc'], 34);
  }
  aktualizujEfekty(); czyscNowe();
}
/* Franek stoi pod prysznicem – rysowany z przodu, żeby było widać każdą część. */
function rysujCialoDoMycia(){
  const u = bohater().ubior;
  pr(196,110,18,48,SKORA); obrys(196,110,18,48);        // lewa ręka

function rysujPortret(nazwa, cx, dolY, maxW, maxH){
  const im = obraz(nazwa);
  if(!im || !im.naturalWidth) return false;
  let s = 3;
  while(s > 1 && (im.naturalWidth*s > maxW || im.naturalHeight*s > maxH)) s--;
  const w = im.naturalWidth*s, h = im.naturalHeight*s;
  ctx.drawImage(im, Math.round(cx - w/2), Math.round(dolY - h), w, h);
  return true;
}

   wszystko: pytanie, liczba pod kursorem, liczenie jabłuszek po kolei
   i wynik. ◀ ▶ przesuwają wybór, ▲ zatwierdza, ▼ liczy razem z tobą. */
const ZADANIA_LICZENIA = [[1,1],[2,1],[2,2],[3,1],[2,3],[3,2],[4,1],[1,4],[3,3],[4,2]];
let RUND_LICZENIA = 5;

function startLiczenia(){
  G.liczenie = { runda:0, i:(Math.random()*ZADANIA_LICZENIA.length)|0, pierwsza:true,
                 a:1, b:1, suma:2, opcje:[], kursor:0, wynik:null, t:0, liczy:null, koniecT:0 };
  G.czastki = []; G.ekran = 'liczenie';
  graj('muz_gra');
  nowaSuma(true);
}
function nowaSuma(pierwsza){
  const l = G.liczenie;
  const [a,b] = ZADANIA_LICZENIA[l.i % ZADANIA_LICZENIA.length];
  l.i++;
  l.a = a; l.b = b; l.suma = a + b;
  const opcje = [l.suma];
  while(opcje.length < 3){                       // dwie liczby obok prawdziwej
    const k = l.suma + (Math.random() < 0.5 ? -1 : 1) * (1 + ((Math.random()*2)|0));
    if(k >= 1 && k <= 10 && !opcje.includes(k)) opcje.push(k);
  }
  for(let i=opcje.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; const x=opcje[i]; opcje[i]=opcje[j]; opcje[j]=x; }
  l.opcje = opcje; l.kursor = 0; l.wynik = null; l.t = 0; l.liczy = null;
  przeczytajSume(pierwsza);
}

function aktualizujLiczenie(){
  const l = G.liczenie;

    l.koniecT--;
    if(l.koniecT === 0) dalejPoPoziomie();

  }
  if(l.liczy){                                   // liczenie jabłuszek po kolei
    l.liczy.t++;
    if(l.liczy.t >= 45){
      l.liczy.t = 0; l.liczy.n++;
      if(l.liczy.n > l.suma){ l.liczy = null; przeczytajSume(false); }
      else { sfx('sfx_zbierz'); mow('licz_' + l.liczy.n); }
    }
    aktualizujEfekty(); czyscNowe(); return;
  }
  if(l.wynik === 'dobrze'){                      // chwila na brawa i następne zadanie
    if(l.t > 110){

  if(nowy('ArrowRight') && l.kursor < l.opcje.length-1){ l.kursor++; sfx('sfx_zbierz'); mow('licz_' + l.opcje[l.kursor]); }
  if(nowy('ArrowDown')) policzZeMna();

/* ==================== MINIGRA: TORY DLA POCIĄGU (rail maze) ====================
   Prosty rail maze dla przedszkolaka: tory leżą poprzekręcane, trzeba je
   poobracać tak, żeby droga z dworca do dworca była cała. ◀ ▶ wybierają tor,
   ▲ obraca. Jak wszystko pasuje, pociąg sam rusza. */
const KOL_POLA = 46, KOL_X = 100, KOL_Y = 62;            // siatka 6 x 4
/* trasa po kolei: [kolumna, wiersz]; pierwszy i ostatni to dworce */
const KOL_TRASA = [[0,1],[1,1],[2,1],[2,2],[3,2],[4,2],[4,1],[5,1]];
const KOL_KSZTALTY = { prosty:[1,3], luk:[1,2] };         // przy obrocie 0
function kolKierunki(t){
  return KOL_KSZTALTY[t.ksztalt].map(d => (d + t.obrot) % 4);
}
function kolPasuje(t){
  const ma = kolKierunki(t).slice().sort().join(',');
  return ma === t.cel.slice().sort().join(',');
}
function startKolejki(){
  const tory = [];
  for(let i=0;i<KOL_TRASA.length;i++){
    const [kx,ky] = KOL_TRASA[i];
    const poprz = KOL_TRASA[i-1], nast = KOL_TRASA[i+1];
    const cel = [];
    if(poprz) cel.push(kolStrona(kx, ky, poprz));
    if(nast)  cel.push(kolStrona(kx, ky, nast));
    const dworzec = i === 0 || i === KOL_TRASA.length-1;
    const ksztalt = cel.length === 2 && (cel[0] + 2) % 4 === cel[1] ? 'prosty' : 'luk';
    const t = {kx, ky, cel, dworzec, ksztalt, obrot:0};
    // na start każdy tor leży krzywo – dziecko ma go poobracać
    if(!dworzec) do { t.obrot = (Math.random()*4)|0; } while(kolPasuje(t));
    tory.push(t);
  }
  G.kolejka = { tory, ruchome: tory.filter(t => !t.dworzec), kursor:0,
                gotowe:false, pociag:0, koniecT:0, t:0 };
  G.czastki = []; G.ekran = 'kolejka';
  graj('muz_gra'); mow('rail_jak');
}
function kolStrona(kx, ky, cel){                 // w którą stronę leży sąsiad
  if(cel[0] > kx) return 1;
  if(cel[0] < kx) return 3;
  return cel[1] > ky ? 2 : 0;
}
function aktualizujKolejke(){
  const k = G.kolejka;
  k.t++;
  if(k.koniecT > 0){
    k.koniecT--;
    if(k.koniecT === 0) dalejPoPoziomie();
    aktualizujEfekty(); czyscNowe(); return;
  }
  if(k.gotowe){                                   // pociąg jedzie sam
    k.pociag += 0.022;
    if(k.pociag >= KOL_TRASA.length - 1){
      k.pociag = KOL_TRASA.length - 1;
      k.koniecT = 210; sfx('sfx_sukces'); cisza(); mow('rail_koniec');
    }
    aktualizujEfekty(); czyscNowe(); return;
  }
  if(nowy('ArrowLeft')  && k.kursor > 0){ k.kursor--; sfx('sfx_zbierz'); }
  if(nowy('ArrowRight') && k.kursor < k.ruchome.length-1){ k.kursor++; sfx('sfx_zbierz'); }
  if(nowy('ArrowUp')){
    const t = k.ruchome[k.kursor];
    t.obrot = (t.obrot + 1) % 4;
    sfx('sfx_skok');
    if(kolPasuje(t)){
      sfx('sfx_zbierz');
      iskry(KOL_X + t.kx*KOL_POLA + KOL_POLA/2, KOL_Y + t.ky*KOL_POLA + KOL_POLA/2,
            ['#f8d878','#fffeff','#58d854'], 10);
      if(k.ruchome.every(kolPasuje)){
        k.gotowe = true; k.pociag = 0; cisza(); mow('rail_jedzie');
      } else {
        mow('rail_pasuje');
        if(k.kursor < k.ruchome.length-1) k.kursor++;    // sam skacze do następnego
      }
    }
  }
  aktualizujEfekty(); czyscNowe();
}
function kolSrodek(i){
  const [kx,ky] = KOL_TRASA[i];
  return {x: KOL_X + kx*KOL_POLA + KOL_POLA/2, y: KOL_Y + ky*KOL_POLA + KOL_POLA/2};
}
/* kawałek toru: od krawędzi kratki aż za środek, żeby łuki się schodziły */
function rysujTorOdcinek(cx, cy, dir){
  const d = KOL_POLA/2, dl = d + 9;
  const poziom = dir === 1 || dir === 3;
  const x = dir === 3 ? cx-d : cx-9, y = dir === 0 ? cy-d : cy-9;
  const w = poziom ? dl : 18, h = poziom ? 18 : dl;
  pr(x, y, w, h, '#ac7c00');
  if(poziom){
    for(let i=0;i<4;i++) pr(x + 2 + i*8, y+1, 3, 16, '#503000');
    pr(x, y+3, w, 2, '#bcbcbc'); pr(x, y+13, w, 2, '#bcbcbc');
  } else {
    for(let i=0;i<4;i++) pr(x+1, y + 2 + i*8, 16, 3, '#503000');
    pr(x+3, y, 2, h, '#bcbcbc'); pr(x+13, y, 2, h, '#bcbcbc');
  }
}
function rysujKolejke(){
  const k = G.kolejka;
  pr(0,0,W,H,'#0058f8');
  pr(0,0,W,H,'#3cbcfc'); pr(0,240,W,30,'#00a800'); pr(0,240,W,3,'#58d854');
  for(let x=0;x<W;x+=24) for(let y=20;y<240;y+=24) pr(x, y, 2, 2, '#64b0ff');  // dywan

  for(const t of k.tory){
    const cx = KOL_X + t.kx*KOL_POLA + KOL_POLA/2, cy = KOL_Y + t.ky*KOL_POLA + KOL_POLA/2;
    const dobry = !t.dworzec && kolPasuje(t);
    pr(cx-KOL_POLA/2+1, cy-KOL_POLA/2+1, KOL_POLA-2, KOL_POLA-2, dobry ? '#2f8f4f' : '#1e6ec8');
    if(t.dworzec){
      pr(cx-16, cy-16, 32, 32, '#d82800'); obrys(cx-16, cy-16, 32, 32);
      pr(cx-10, cy-6, 20, 14, '#f8d878');
      for(const d of t.cel) rysujTorOdcinek(cx, cy, d);
    } else {
      for(const d of kolKierunki(t)) rysujTorOdcinek(cx, cy, d);
    }
  }
  if(!k.gotowe){                                  // ramka na wybranym torze
    const t = k.ruchome[k.kursor];
    const cx = KOL_X + t.kx*KOL_POLA, cy = KOL_Y + t.ky*KOL_POLA;
    if(Math.floor(G.t/8)%2===0){
      ctx.strokeStyle = '#f8d878'; ctx.lineWidth = 2;
      ctx.strokeRect(cx+1.5, cy+1.5, KOL_POLA-3, KOL_POLA-3);
    }
    strzalka(cx + KOL_POLA/2, cy - 12, G.t);
  } else {
    const i = Math.floor(k.pociag), f = k.pociag - i;
    const a = kolSrodek(Math.min(i, KOL_TRASA.length-1));
    const b = kolSrodek(Math.min(i+1, KOL_TRASA.length-1));
    const x = a.x + (b.x-a.x)*f, y = a.y + (b.y-a.y)*f;
    pr(x-13, y-11, 26, 18, '#d82800'); obrys(x-13, y-11, 26, 18);
    pr(x-9, y-7, 10, 8, '#64b0ff');
    pr(x+4, y-18, 6, 8, '#503000');
    kolo(x-7, y+8, 3, '#000000'); kolo(x+7, y+8, 3, '#000000');
    if(G.t % 10 === 0) iskry(x+7, y-20, ['#fffeff','#bcbcbc'], 3);
  }
  rysujEfekty();

  pr(0,0,W,20,'#000000'); pr(0,20,W,1,'#4f4f4f');
  napisL('TORY DLA POCIĄGU', 4, 10, '#fffeff', null, 1);
  const ile = k.ruchome.filter(kolPasuje).length;
  napisL('TORY: ' + ile + '/' + k.ruchome.length, W-86, 10, '#f8d878', null, 1);
  napis(k.gotowe ? 'CIUCH CIUCH!' : '<  >  WYBIERZ TOR   ^  OBRÓĆ', W/2, 257, '#fffeff', '#000000', 2);
  if(k.koniecT > 0){
    ctx.globalAlpha = 0.65; pr(0,0,W,H,'#000000'); ctx.globalAlpha = 1;
    napis('POCIĄG DOJECHAŁ!', W/2, 118, '#f8d878', '#000000', 3);
    napis('BRAWO FRANEK!', W/2, 152, '#fffeff', '#000000', 2);
  }
  rysujDebug();
}


/* ==================== MINIGRA: RAZ, DWA, TRZY – BABA JAGA PATRZY ====================
   Baba Jaga stoi tyłem i śpiewa – wtedy się biegnie (◀ ▶ na zmianę). Jak się
   odwróci, trzeba stać jak posąg, bo odsyła kawałek do tyłu. */
let BABA_META = 362;
const BABA_ZIEMIA = 228;
function startBabyJagi(){
  G.baba = { x:8, v:0, ostatni:0, faza:0, stan:'spiew', t:0, dl:150, runda:0,

    b.koniecT--;
    if(b.koniecT === 0) dalejPoPoziomie();
    aktualizujEfekty(); czyscNowe(); return;
  }
  if(b.kara > 0){                                  // złapany – chwila postoju
    b.kara--; b.v = 0;
    if(b.kara === 0){ b.stan = 'spiew'; b.t = 0; mow('baba_raz'); }
    aktualizujEfekty(); czyscNowe(); return;
  }
  rozpedzBieg(b);
  if(b.stan === 'spiew'){
    for(const d of b.dzieci){                      // dzieciaki biegną razem z Frankiem
      d.v = Math.min(2.6, d.v + 0.05 + Math.random()*0.06);

    for(let i=0;i<50;i++) G.czastki.push({x:Math.random()*W, y:-8-Math.random()*60,
      vx:(Math.random()-0.5)*1, vy:0.6+Math.random()*1.6, zyc:200,
      kol:['#d82800','#f8d878','#58d854','#3cbcfc','#fe6ecc'][(Math.random()*5)|0], r:2+Math.random()*2});
  }
  aktualizujEfekty(); czyscNowe();

/* ==================== MINIGRA: PODŁOGA TO LAWA ====================
   Salon wieczorem: podłoga to lawa, więc skacze się po meblach aż na kanapę.
   ◀ ▶ chodzą, ▲ skacze. Dotknięcie lawy cofa na ostatni mebel. */
const LAWA_POZIOM = 236;
const LAWA_MEBLE = [
  {x:0,   y:212, w:76, h:26, co:'dywan'},
  {x:104, y:190, w:58, h:12, co:'pufa'},
  {x:192, y:158, w:62, h:11, co:'stolik'},
  {x:278, y:196, w:50, h:12, co:'taboret'},
  {x:340, y:150, w:58, h:10, co:'polka'},
  {x:414, y:186, w:66, h:50, co:'kanapa'}
];
function startLawy(){
  const m = LAWA_MEBLE[0];
  G.lawa = { x:14, y:m.y-50, vx:0, vy:0, kier:1, faza:0, ziemia:true,
             bezpiecz:{x:14, y:m.y-50}, polowa:false, koniecT:0, ups:0, t:0 };
  G.czastki = []; G.ekran = 'lawa';
  graj('muz_gra'); mow('lawa_jak');
}
function aktualizujLawe(){
  const l = G.lawa;
  l.t++;
  if(l.koniecT > 0){
    l.koniecT--;
    if(l.koniecT === 0) dalejPoPoziomie();
    aktualizujEfekty(); czyscNowe(); return;
  }
  if(l.ups > 0){ l.ups--; aktualizujEfekty(); czyscNowe(); return; }
  l.vx = ((klaw['ArrowRight']?1:0) - (klaw['ArrowLeft']?1:0)) * 2.2;
  if(l.vx) l.kier = l.vx > 0 ? 1 : -1;
  if(nowy('ArrowUp') && l.ziemia){ l.vy = -6.1; l.ziemia = false; sfx('sfx_skok'); }
  l.vy += 0.28; if(l.vy > 7.5) l.vy = 7.5;
  l.x += l.vx;
  if(l.x < 0) l.x = 0;
  if(l.x > W - 22) l.x = W - 22;
  const staryDol = l.y + 50;
  l.y += l.vy;
  l.ziemia = false;
  for(const m of LAWA_MEBLE){
    if(l.x + 22 > m.x && l.x < m.x + m.w && l.vy >= 0 &&
       staryDol <= m.y + 2 && l.y + 50 >= m.y){
      l.y = m.y - 50; l.vy = 0; l.ziemia = true;
      l.bezpiecz = {x: Math.max(m.x, Math.min(m.x + m.w - 22, l.x)), y: m.y - 50};
      if(!l.polowa && m.x > 180){ l.polowa = true; mow('lawa_polowa'); }
      if(m.co === 'kanapa' && l.koniecT === 0){
        l.koniecT = 215; sfx('sfx_sukces'); cisza(); mow('lawa_koniec');
        for(let i=0;i<40;i++) G.czastki.push({x:Math.random()*W, y:-8-Math.random()*60,
          vx:(Math.random()-0.5)*1, vy:0.6+Math.random()*1.5, zyc:190,
          kol:['#d82800','#f8d878','#58d854','#3cbcfc','#fe6ecc'][(Math.random()*5)|0], r:2+Math.random()*2});
      }
    }
  }
  if(l.y + 50 > LAWA_POZIOM && !l.ziemia){          // wpadł w lawę
    sfx('sfx_zle'); mow('lawa_ups');
    iskry(l.x + 11, LAWA_POZIOM, ['#fc9838','#d82800','#f8d878'], 18);
    l.x = l.bezpiecz.x; l.y = l.bezpiecz.y; l.vx = 0; l.vy = 0; l.ziemia = true; l.ups = 40;
  }
  if(Math.abs(l.vx) > 0.1 && l.ziemia) l.faza += 0.16;
  aktualizujEfekty(); czyscNowe();
}
function rysujMebelLawy(m, t){
  const {x, y, w, h, co} = m;
  if(co === 'dywan'){
    pr(x, y, w, h, '#3cbcfc'); pr(x, y, w, 3, '#64b0ff'); obrys(x, y, w, h);
    for(let i=0;i<4;i++) pr(x+6+i*18, y+8, 8, 8, '#fffeff');
  } else if(co === 'kanapa'){
    pr(x, y, w, h, '#a80020'); pr(x, y, w, 4, '#d82800'); obrys(x, y, w, h);
    pr(x+4, y-14, w-8, 16, '#d82800'); obrys(x+4, y-14, w-8, 16);
    rysujIkone('mis', x + w/2, y - 24, false);
  } else if(co === 'pufa'){
    pr(x, y, w, h, '#fe6ecc'); pr(x, y, w, 3, '#fec4ea'); obrys(x, y, w, h);
    pr(x+6, y+h, w-12, 6, '#a80020');
  } else if(co === 'polka'){
    pr(x, y, w, h, '#ac7c00'); pr(x, y, w, 2, '#e4e594'); obrys(x, y, w, h);
    pr(x+6, y-14, 8, 14, '#00a800'); pr(x+18, y-18, 8, 18, '#0058f8');   // książki
    pr(x+30, y-12, 8, 12, '#d82800');
  } else {
    pr(x, y, w, h, '#ac7c00'); pr(x, y, w, 2, '#e4e594'); obrys(x, y, w, h);
    pr(x+4, y+h, 6, LAWA_POZIOM-y-h, '#883800');
    pr(x+w-10, y+h, 6, LAWA_POZIOM-y-h, '#883800');
  }
}
function rysujLawe(){
  const l = G.lawa;
  pr(0,0,W,H,'#f7d8a5');                                   // ściana salonu
  for(let x=0;x<W;x+=60) pr(x, 20, 2, LAWA_POZIOM-20, '#e4c08a');
  pr(40, 60, 90, 60, '#64b0ff'); obrys(40, 60, 90, 60);    // okno
  pr(84, 60, 3, 60, '#fffeff'); pr(40, 88, 90, 3, '#fffeff');

  for(const m of LAWA_MEBLE) rysujMebelLawy(m, G.t);
  if(l.ups === 0 || Math.floor(G.t/4)%2===0)
    rysujFranka(l.x, l.y, l.kier, l.faza, !l.ziemia, l.vy > 0);

  // lawa: bąble i falująca powierzchnia
  pr(0, LAWA_POZIOM, W, H-LAWA_POZIOM, '#d82800');
  for(let x=0;x<W;x+=8){
    const f = Math.round(Math.sin((x + G.t*1.6)*0.08)*2);
    pr(x, LAWA_POZIOM-2+f, 8, 6, '#fc9838');
  }
  for(let i=0;i<6;i++){
    const bx = (i*83 + Math.floor(G.t*0.6)) % W;
    const by = LAWA_POZIOM + 8 + Math.round(Math.sin((G.t+i*40)*0.07)*4);
    kolo(bx, by, 3, '#f8d878');
  }
  rysujEfekty();

  pr(0,0,W,20,'#000000'); pr(0,20,W,1,'#4f4f4f');
  napisL('PODŁOGA TO LAWA', 4, 10, '#fffeff', null, 1);
  const tw = szerTekstu('NIE DOTYKAJ PODŁOGI!', 2);
  pr(W/2-tw/2-6, 24, tw+12, 22, '#a80020');
  napis('NIE DOTYKAJ PODŁOGI!', W/2, 35, '#f8d878', '#000000', 2);
  if(l.ups > 0) napis('AAA, LAWA!', W/2, 120, '#fc9838', '#000000', 3);
  const pw = szerTekstu('<  >  CHODŹ     ^  SKOK', 2);
  pr(W/2-pw/2-6, 248, pw+12, 20, '#000000');
  napis('<  >  CHODŹ     ^  SKOK', W/2, 258, '#fffeff', '#000000', 2);
  if(l.koniecT > 0){
    ctx.globalAlpha = 0.6; pr(0,0,W,H,'#000000'); ctx.globalAlpha = 1;
    napis('JESTEŚ NA KANAPIE!', W/2, 118, '#f8d878', '#000000', 3);
    napis('LAWA CIĘ NIE DOSTAŁA!', W/2, 152, '#fffeff', '#000000', 2);
  }
  rysujDebug();
}


/* ==================== MINIGRA: UBIERANIE NA POGODĘ ====================
   Za oknem raz deszcz, raz śnieg, raz słońce. Trzy zestawy na wieszaku,
   ◀ ▶ wybierają, ▲ zakłada. W kaloszach na śnieg zmarzniesz! */
const POGODY = [
  {co:'deszcz', glos:'pog_deszcz', dobre:0},
  {co:'snieg',  glos:'pog_snieg',  dobre:1},
  {co:'slonce', glos:'pog_slonce', dobre:2}
];
const ZESTAWY = [
  {napis:'KALOSZE I PARASOL',   glos:'pog_kalosze'},
  {napis:'CZAPKA I SZALIK',     glos:'pog_czapka'},
  {napis:'KASZKIET I OKULARY',  glos:'pog_okulary'}
];
function startPogody(){
  const kolejnosc = [0,1,2];
  for(let i=2;i>0;i--){ const j=(Math.random()*(i+1))|0; const x=kolejnosc[i]; kolejnosc[i]=kolejnosc[j]; kolejnosc[j]=x; }
  G.pogoda = { kolejnosc, runda:0, kursor:0, wynik:null, t:0, koniecT:0, krople:[] };
  for(let i=0;i<40;i++) G.pogoda.krople.push({x:Math.random()*120, y:Math.random()*90, v:1+Math.random()*2});
  G.czastki = []; G.ekran = 'pogoda';
  graj('muz_gra'); mow('pog_jak', POGODY[kolejnosc[0]].glos);
}
function aktualizujPogode(){
  const p = G.pogoda;
  p.t++;
  for(const k of p.krople){ k.y += k.v; if(k.y > 90){ k.y = 0; k.x = Math.random()*120; } }
  if(p.koniecT > 0){
    p.koniecT--;
    if(p.koniecT === 0) dalejPoPoziomie();
    aktualizujEfekty(); czyscNowe(); return;
  }
  if(p.wynik === 'dobrze'){
    if(p.t > 120){
      p.runda++;
      if(p.runda >= POGODY.length){ p.koniecT = 210; sfx('sfx_sukces'); cisza(); mow('pog_koniec'); }
      else { p.wynik = null; p.t = 0; p.kursor = 0; mow(POGODY[p.kolejnosc[p.runda]].glos); }
    }
    aktualizujEfekty(); czyscNowe(); return;
  }
  if(nowy('ArrowLeft')  && p.kursor > 0){ p.kursor--; sfx('sfx_zbierz'); mow(ZESTAWY[p.kursor].glos); }
  if(nowy('ArrowRight') && p.kursor < 2){ p.kursor++; sfx('sfx_zbierz'); mow(ZESTAWY[p.kursor].glos); }
  if(nowy('ArrowUp')){
    const dobra = POGODY[p.kolejnosc[p.runda]].dobre;
    if(p.kursor === dobra){
      p.wynik = 'dobrze'; p.t = 0;
      sfx('sfx_sukces'); iskry(90 + p.kursor*150, 150, ['#f8d878','#fffeff','#58d854'], 20);
      mow('pog_dobrze');
    } else {
      sfx('sfx_zle'); mow('pog_zle', POGODY[p.kolejnosc[p.runda]].glos);
    }
  }
  aktualizujEfekty(); czyscNowe();
}
function rysujZestaw(i, x, y){

    pr(x-22, y+14, 14, 18, '#f8d878'); obrys(x-22, y+14, 14, 18);

  }
}

    ctx.globalAlpha = 0.65; pr(0,0,W,H,'#000000'); ctx.globalAlpha = 1;

/* ==================== MINIGRA: ZAWIĄZUJEMY BUTY ====================
   Sznurówka idzie przez cztery pary dziurek – ◀ ▶ na zmianę przeciągają.
   Na koniec kokardka: naciskaj ▲. */
let SZN_DZIUREK = 4;
function startSznurowek(){
  G.sznurowki = { pasek:0, dziurka:0, ostatni:0, faza:'przewlekanie', kokardka:0, koniecT:0, t:0 };
  G.czastki = []; G.ekran = 'sznurowki';
  graj('muz_gra'); mow('szn_jak');
}
function aktualizujSznurowki(){
  const s = G.sznurowki;
  s.t++;
  if(s.koniecT > 0){
    s.koniecT--;
    if(s.koniecT === 0) dalejPoPoziomie();
    aktualizujEfekty(); czyscNowe(); return;
  }
  if(s.faza === 'przewlekanie'){
    if(nowy('ArrowLeft')  && s.ostatni !== -1){ s.pasek += 0.075; s.ostatni = -1; sfx('sfx_skok'); }
    if(nowy('ArrowRight') && s.ostatni !==  1){ s.pasek += 0.075; s.ostatni =  1; sfx('sfx_skok'); }
    const ile = Math.min(SZN_DZIUREK, Math.floor(s.pasek * SZN_DZIUREK));
    if(ile > s.dziurka){
      s.dziurka = ile; sfx('sfx_zbierz');
      iskry(150 + ile*46, 150, ['#f8d878','#fffeff'], 8);
      if(ile >= SZN_DZIUREK){ s.faza = 'kokardka'; cisza(); mow('szn_kokardka'); }
      else mow('licz_' + ile);
    }
  } else {
    if(nowy('ArrowUp')){
      s.kokardka++; sfx('sfx_zbierz');
      iskry(300, 140, ['#f8d878','#fe6ecc','#fffeff'], 10);
      if(s.kokardka >= 5){
        s.koniecT = 210; sfx('sfx_sukces'); cisza(); mow('szn_koniec');
      }
    }
  }
  aktualizujEfekty(); czyscNowe();
}

  pr(0,200,W,70,'#ac7c00'); pr(0,200,W,4,'#e4c08a');

  pr(90, 150, 300, 56, '#d82800'); obrys(90, 150, 300, 56);

  for(let i=0;i<SZN_DZIUREK;i++){                                  // dziurki

    kolo(x, 128, 5, '#2b2b33'); kolo(x, 154, 5, '#2b2b33');

    ctx.beginPath(); ctx.arc(310+r/2, 112, r/2, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(310, 112); ctx.lineTo(298, 142); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(310, 112); ctx.lineTo(322, 142); ctx.stroke();
  }
  ctx.lineWidth = 1; ctx.lineCap = 'butt';
  rysujEfekty();

  pr(0,0,W,20,'#000000'); pr(0,20,W,1,'#4f4f4f');
  napisL('ZAWIĄZUJEMY BUTY', 4, 10, '#fffeff', null, 1);
  napisL('DZIURKI: ' + s.dziurka + '/' + SZN_DZIUREK, W-104, 10, '#f8d878', null, 1);
  const t = s.faza === 'kokardka' ? 'TERAZ KOKARDKA!' : 'PRZEWLEKAJ SZNURÓWKĘ!';
  const tw = szerTekstu(t, 2);

  napis(s.faza === 'kokardka' ? '^  ^  ^  ZACIĄGAJ!' : '<  >  NA ZMIANĘ', W/2, 240, '#fffeff', '#000000', 2);
  if(s.koniecT > 0){

   ◀ ▶ wybierają miejsce, ▲ kładzie. Narrator liczy nakrycia. */
const STOL_MIEJSCA = [
  {x:110, glowa:'glowa_franek'},
  {x:240, glowa:'glowa_magda'},
  {x:370, glowa:'glowa_tata'}
];
const STOL_FAZY = [
  {co:'talerz',  glos:'stol_talerze'},
  {co:'kubek',   glos:'stol_kubki'},
  {co:'widelec', glos:'stol_widelce'}
];
function startStolu(){
  G.stol = { polozone:[{},{},{}], faza:0, kursor:0, koniecT:0, t:0 };
  G.czastki = []; G.ekran = 'stol';
  graj('muz_gra'); mow('stol_jak', STOL_FAZY[0].glos);
}
function aktualizujStol(){
  const s = G.stol;
  s.t++;
  if(s.koniecT > 0){
    s.koniecT--;
    if(s.koniecT === 0) dalejPoPoziomie();
    aktualizujEfekty(); czyscNowe(); return;
  }
  if(nowy('ArrowLeft')  && s.kursor > 0){ s.kursor--; sfx('sfx_zbierz'); }
  if(nowy('ArrowRight') && s.kursor < STOL_MIEJSCA.length-1){ s.kursor++; sfx('sfx_zbierz'); }
  if(nowy('ArrowUp')){
    const co = STOL_FAZY[s.faza].co;
    if(s.polozone[s.kursor][co]){ sfx('sfx_zle'); mow('stol_juz_jest'); }
    else {

      sfx('sfx_zbierz');
      iskry(STOL_MIEJSCA[s.kursor].x, 176, ['#f8d878','#fffeff'], 8);
      const ile = s.polozone.filter(m => m[co]).length;
      if(ile >= STOL_MIEJSCA.length){
        s.faza++;
        if(s.faza >= STOL_FAZY.length){
          s.koniecT = 215; sfx('sfx_sukces'); cisza(); mow('stol_koniec');
        } else { s.kursor = 0; mow('licz_' + ile, STOL_FAZY[s.faza].glos); }
      } else mow('licz_' + ile);
    }
  }
  aktualizujEfekty(); czyscNowe();
}
function rysujNakrycie(x, y, m, kursor, t){
  if(m.talerz){ kolo(x, y, 16, '#fffeff'); kolo(x, y, 11, '#e4e594'); obrysKola(x, y, 16); }
  if(m.kubek){

}

                 rzeczy:PORZ_RZECZY.slice(0, ile(4, PORZ_RZECZY.length)).map(r => ({...r, gdzie:'podloga'})),

/* ==================== MINIGRA: KOLORY I KSZTAŁTY ====================
   Raz pytamy o kolor, raz o kształt. Trzy figury, ◀ ▶ wybierają (narrator
   mówi, na co patrzysz), ▲ zatwierdza. Pięć zadań. */
const KSZ_KOLORY = [
  {kol:'#d82800', glos:'ksz_czerwony', napis:'CZERWONY'},
  {kol:'#0058f8', glos:'ksz_niebieski', napis:'NIEBIESKI'},
  {kol:'#00a800', glos:'ksz_zielony', napis:'ZIELONY'},
  {kol:'#f8d878', glos:'ksz_zolty', napis:'ŻÓŁTY'}
];
const KSZ_FIGURY = [
  {co:'kolo',     glos:'ksz_kolko',   napis:'KÓŁKO'},
  {co:'kwadrat',  glos:'ksz_kwadrat', napis:'KWADRAT'},
  {co:'trojkat',  glos:'ksz_trojkat', napis:'TRÓJKĄT'}
];
let KSZ_RUND = 5;
function startKsztaltow(){
  G.ksztalty = { runda:0, pytanie:null, figury:[], kursor:0, wynik:null, t:0, koniecT:0 };
  G.czastki = []; G.ekran = 'ksztalty';
  graj('muz_gra');
  noweKsztalty(true);
}
function noweKsztalty(pierwsza){
  const k = G.ksztalty;
  const oKolor = k.runda % 2 === 0;
  const figury = [];
  const uzyteK = [], uzyteF = [];
  for(let i=0;i<3;i++){
    let kol, fig;
    do { kol = (Math.random()*KSZ_KOLORY.length)|0; } while(oKolor && uzyteK.includes(kol));
    do { fig = (Math.random()*KSZ_FIGURY.length)|0; } while(!oKolor && uzyteF.includes(fig));
    uzyteK.push(kol); uzyteF.push(fig);
    figury.push({kol, fig});
  }
  const dobra = (Math.random()*3)|0;
  k.oKolor = oKolor;
  k.pytanie = oKolor ? KSZ_KOLORY[figury[dobra].kol] : KSZ_FIGURY[figury[dobra].fig];
  k.dobra = dobra; k.figury = figury; k.kursor = 0; k.wynik = null; k.t = 0;
  pytajOKsztalt(pierwsza);
}
function pytajOKsztalt(zInstrukcja){
  const k = G.ksztalty;
  const klucze = [k.oKolor ? 'ksz_ktory_kolor' : 'ksz_gdzie', k.pytanie.glos];
  if(zInstrukcja) klucze.unshift('ksz_jak');
  mow(...klucze);
}
function aktualizujKsztalty(){
  const k = G.ksztalty;
  k.t++;
  if(k.koniecT > 0){
    k.koniecT--;
    if(k.koniecT === 0) dalejPoPoziomie();
    aktualizujEfekty(); czyscNowe(); return;
  }
  if(k.wynik === 'dobrze'){
    if(k.t > 110){
      k.runda++;
      if(k.runda >= KSZ_RUND){ k.koniecT = 215; sfx('sfx_sukces'); cisza(); mow('ksz_koniec'); }
      else noweKsztalty(false);
    }
    aktualizujEfekty(); czyscNowe(); return;
  }
  const opisPod = () => {
    const f = k.figury[k.kursor];
    return k.oKolor ? KSZ_KOLORY[f.kol].glos : KSZ_FIGURY[f.fig].glos;
  };
  if(nowy('ArrowLeft')  && k.kursor > 0){ k.kursor--; sfx('sfx_zbierz'); mow(opisPod()); }
  if(nowy('ArrowRight') && k.kursor < 2){ k.kursor++; sfx('sfx_zbierz'); mow(opisPod()); }
  if(nowy('ArrowUp')){
    if(k.kursor === k.dobra){
      k.wynik = 'dobrze'; k.t = 0;
      sfx('sfx_sukces'); iskry(110 + k.kursor*130, 140, ['#f8d878','#fffeff','#58d854'], 20);
      mow('ksz_brawo', k.pytanie.glos);
    } else { sfx('sfx_zle'); mow('ksz_nie'); pytajOKsztalt(false); }
  }
  aktualizujEfekty(); czyscNowe();
}
function rysujFigure(co, x, y, r, kol){
  if(co === 'kolo'){
    kolo(x, y, r, kol);
    ctx.strokeStyle = '#000000'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x+0.5, y+0.5, r, 0, Math.PI*2); ctx.stroke();
  } else if(co === 'kwadrat'){
    pr(x-r, y-r, r*2, r*2, kol); obrys(x-r, y-r, r*2, r*2);

    ctx.fillStyle = kol;
    ctx.beginPath(); ctx.moveTo(x, y-r-2); ctx.lineTo(x+r+2, y+r); ctx.lineTo(x-r-2, y+r);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#000000'; ctx.lineWidth = 1; ctx.stroke();
  }
}
function rysujKsztalty(){

    rysujFigure(KSZ_FIGURY[f.fig].co, x, 132, 34, KSZ_KOLORY[f.kol].kol);

  pr(0,0,W,20,'#000000'); pr(0,20,W,1,'#4f4f4f');

  napisL('ZADANIE ' + Math.min(KSZ_RUND, k.runda+1) + '/' + KSZ_RUND, W-104, 10, '#f8d878', null, 1);

  const tw = szerTekstu(t, 2);
  pr(W/2-tw/2-6, 24, tw+12, 22, '#a80020');
  napis(t, W/2, 35, '#f8d878', '#000000', 2);
  napis(k.wynik === 'dobrze' ? 'BRAWO!' : '<  >  WYBIERAJ     ^  TO TEN!', W/2, 232, '#fffeff', '#000000', 2);
  if(k.koniecT > 0){
    ctx.globalAlpha = 0.65; pr(0,0,W,H,'#000000'); ctx.globalAlpha = 1;
    napis('WSZYSTKO ZGADŁEŚ!', W/2, 118, '#f8d878', '#000000', 3);
    napis('KOLORY I KSZTAŁTY BEZ BŁĘDU!', W/2, 152, '#fffeff', '#000000', 1);
  }
  rysujDebug();
}

    aktualizujEfekty(); czyscNowe(); return;
  }
  if(r.faza === 'pokaz'){
    if(r.t === 0) mow('rytm_sluchaj');
    const krok = 40;
    const nr = Math.floor(r.t / krok);
    if(r.t >= 0 && r.t % krok === 0 && nr < r.sekw.length){
      r.blysk = nr; sfx(RYTM_SFX[r.sekw[nr]]);
      iskry(W/2 - (r.sekw.length-1)*26 + nr*52, 150, ['#f8d878','#fffeff'], 8);
    }
    if(r.t > krok * r.sekw.length + 20){
      r.faza = 'powtorz'; r.i = 0; r.t = 0; r.blysk = -1; mow('rytm_powtorz');
    }
  } else if(r.faza === 'powtorz'){
    for(let z=0;z<3;z++){
      if(!nowy(RYTM_KLAWISZE[z])) continue;
      sfx(RYTM_SFX[z]); r.blysk = r.i;
      if(r.sekw[r.i] === z){
        r.i++;
        iskry(W/2 - (r.sekw.length-1)*26 + (r.i-1)*52, 150, ['#58d854','#fffeff'], 8);
        if(r.i >= r.sekw.length){
          r.faza = 'brawo'; r.t = 0; sfx('sfx_sukces'); mow('rytm_dobrze');
        }
      } else {
        r.faza = 'pomylka'; r.t = 0; r.zle++; sfx('sfx_zle'); mow('rytm_zle');
      }
      break;
    }
  } else if(r.faza === 'pomylka'){
    if(r.t > 70){ r.faza = 'pokaz'; r.t = -30; r.i = 0; r.blysk = -1; }
  } else if(r.faza === 'brawo'){
    if(r.t > 90){
      r.runda++;
      if(r.runda >= RYTM_RUND){ r.koniecT = 215; sfx('sfx_sukces'); cisza(); mow('rytm_koniec'); }
      else nowyRytm();
    }
  }
  aktualizujEfekty(); czyscNowe();
}

  napis(t, W/2, 35, '#f8d878', null, 2);

/* ==================== MINIGRA: ZUPA NA OBIAD ====================
   Najpierw za gorąca – trzymaj ▲ i dmuchaj, aż para przestanie lecieć.
   Potem łyżka po łyżce: ◀ ▶ na zmianę, aż talerz pusty. */
let ZUPA_LYZEK = 6;
function startZupy(){
  G.zupa = { goraco:1, faza:'dmuchanie', lyzki:0, pasek:0, ostatni:0, dmucha:0,
             koniecT:0, t:0, para:[] };
  for(let i=0;i<10;i++) G.zupa.para.push({x:(Math.random()-0.5)*40, y:Math.random()*50, v:0.4+Math.random()*0.5});
  G.czastki = []; G.ekran = 'zupa';
  graj('muz_gra'); mow('zupa_jak');
}
function aktualizujZupe(){
  const z = G.zupa;
  z.t++;
  for(const p of z.para){ p.y -= p.v; if(p.y < 0){ p.y = 50; p.x = (Math.random()-0.5)*40; } }
  if(z.koniecT > 0){
    z.koniecT--;
    if(z.koniecT === 0) dalejPoPoziomie();
    aktualizujEfekty(); czyscNowe(); return;
  }
  if(z.faza === 'dmuchanie'){
    if(klaw['ArrowUp']){
      z.dmucha = Math.min(1, z.dmucha + 0.06);
      z.goraco = Math.max(0, z.goraco - 0.006);
      if(z.t % 14 === 0) iskry(W/2, 150, ['#fffeff','#bcbcbc'], 4);
    } else z.dmucha = Math.max(0, z.dmucha - 0.08);
    if(z.goraco <= 0){
      z.faza = 'jedzenie'; sfx('sfx_sukces'); cisza(); mow('zupa_ostygla');
    }
  } else {
    if(nowy('ArrowLeft')  && z.ostatni !== -1){ z.pasek += 0.34; z.ostatni = -1; sfx('sfx_skok'); }
    if(nowy('ArrowRight') && z.ostatni !==  1){ z.pasek += 0.34; z.ostatni =  1; sfx('sfx_skok'); }
    const ile = Math.min(ZUPA_LYZEK, Math.floor(z.pasek));
    if(ile > z.lyzki){
      z.lyzki = ile; sfx('sfx_zbierz');
      iskry(W/2, 160, ['#fc9838','#f8d878'], 8);
      if(ile >= ZUPA_LYZEK){ z.koniecT = 215; sfx('sfx_sukces'); cisza(); mow('zupa_koniec'); }
      else mow('licz_' + ile);
    }
  }
  aktualizujEfekty(); czyscNowe();
}
function rysujZupe(){
  const z = G.zupa;
  pr(0,0,W,H,'#b3f3cc');
  pr(0,186,W,84,'#ac7c00'); pr(0,186,W,4,'#e4c08a');       // stół
  pr(0,150,W,36,'#96e0b8');

  const poziom = 1 - z.lyzki/ZUPA_LYZEK;
  if(z.faza === 'dmuchanie'){
    for(const p of z.para){                                 // para nad talerzem
      ctx.globalAlpha = 0.2 + (p.y/50)*0.45;
      kolo(W/2 + p.x, 62 + p.y*0.7, 5, '#fffeff');
      ctx.globalAlpha = 1;
    }
  }
  kolo(W/2, 166, 62, '#fffeff');                            // talerz
  obrysKola(W/2, 166, 62);
  kolo(W/2, 166, 48, '#e4e594');
  if(poziom > 0){
    kolo(W/2, 166, Math.max(6, 43*poziom), '#fc9838');
    for(let i=0;i<4;i++){                                   // marchewki w zupie
      const a = G.t*0.01 + i*1.6;
      const rr = 43*poziom*0.55;
      pr(W/2 + Math.cos(a)*rr - 3, 166 + Math.sin(a)*rr*0.6 - 3, 6, 6, '#d82800');
    }
  }
  const b = z.dmucha > 0.1 ? 6 : 0;                          // Franek dmucha
  rysujFranka(46, 136 + b, 1, 0, false, false);
  if(z.dmucha > 0.1) for(let i=0;i<3;i++) kolo(90 + i*14, 154 + i*4 + b, 3 + i, '#fffeff');

  if(z.faza === 'dmuchanie'){                               // pasek gorąca
    pr(W/2-80, 232, 160, 14, '#000000');
    pr(W/2-77, 235, 154, 8, '#4f4f4f');
    pr(W/2-77, 235, Math.round(154*z.goraco), 8, '#d82800');
    pr(W/2-52, 250, 104, 18, '#000000');
    napis('GORĄCE!', W/2, 259, '#fc9838', null, 2);
  } else {
    pr(W/2-72, 250, 144, 18, '#000000');
    napis('ŁYŻKI: ' + z.lyzki + '/' + ZUPA_LYZEK, W/2, 259, '#fffeff', null, 2);
  }
  rysujEfekty();

  pr(0,0,W,20,'#000000'); pr(0,20,W,1,'#4f4f4f');
  napisL('ZUPKA NA OBIAD', 4, 10, '#fffeff', null, 1);
  const t = z.faza === 'dmuchanie' ? 'DMUCHAJ! TRZYMAJ ^' : 'JEDZ! <  >  NA ZMIANĘ';
  const tw = szerTekstu(t, 2);
  pr(W/2-tw/2-6, 24, tw+12, 22, '#000000');
  napis(t, W/2, 35, '#f8d878', null, 2);
  if(z.koniecT > 0){
    ctx.globalAlpha = 0.65; pr(0,0,W,H,'#000000'); ctx.globalAlpha = 1;
    napis('PUSTY TALERZ!', W/2, 118, '#f8d878', '#000000', 3);
    napis('CAŁA ZUPKA ZJEDZONA!', W/2, 152, '#fffeff', '#000000', 2);
  }
  rysujDebug();
}

/* ==================== MINIGRA: SZUKAMY KURTKI W SZATNI ====================
   Na wieszakach wiszą kurtki, jedna jest Franka. ◀ ▶ przesuwają rączkę,
   ▲ zdejmuje. Trzy rundy, za każdym razem inne ułożenie. */
const SZUK_KURTKI = [
  {kol:'#00a800', jasny:'#58d854', wzor:'paski'},
  {kol:'#d82800', jasny:'#f87858', wzor:'kropki'},
  {kol:'#0058f8', jasny:'#3cbcfc', wzor:'gladka'},
  {kol:'#f8d878', jasny:'#e4e594', wzor:'kropki'},
  {kol:'#fe6ecc', jasny:'#fec4ea', wzor:'paski'},
  {kol:'#7527fe', jasny:'#a45cff', wzor:'gladka'},
  {kol:'#fc9838', jasny:'#f7d8a5', wzor:'paski'},
  {kol:'#4f4f4f', jasny:'#bcbcbc', wzor:'kropki'}
];
const SZUK_ILE = 6;
let SZUK_RUND = 3;
function startSzukania(){
  G.szukanie = { runda:0, kurtki:[], moja:0, kursor:0, wynik:null, t:0, koniecT:0, pokaz:150 };
  G.czastki = []; G.ekran = 'szukanie';
  graj('muz_gra');
  noweSzukanie(true);
}
function noweSzukanie(pierwsza){
  const s = G.szukanie;
  const pula = SZUK_KURTKI.map((k,i) => i);
  for(let i=pula.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; const x=pula[i]; pula[i]=pula[j]; pula[j]=x; }
  s.kurtki = pula.slice(0, SZUK_ILE);
  s.moja = (Math.random()*SZUK_ILE)|0;
  s.kursor = 0; s.wynik = null; s.t = 0; s.pokaz = 170;
  mow(pierwsza ? 'szuk_jak' : 'szuk_patrz');
}
function aktualizujSzukanie(){
  const s = G.szukanie;
  s.t++;
  if(s.koniecT > 0){
    s.koniecT--;
    if(s.koniecT === 0) dalejPoPoziomie();
    aktualizujEfekty(); czyscNowe(); return;
  }
  if(s.pokaz > 0){                                   // najpierw pokazujemy, która jest nasza
    s.pokaz--;
    if(s.pokaz === 0) mow('szuk_szukaj');
    aktualizujEfekty(); czyscNowe(); return;
  }
  if(s.wynik === 'dobrze'){
    if(s.t > 110){
      s.runda++;
      if(s.runda >= SZUK_RUND){ s.koniecT = 215; sfx('sfx_sukces'); cisza(); mow('szuk_koniec'); }
      else noweSzukanie(false);
    }
    aktualizujEfekty(); czyscNowe(); return;
  }
  if(nowy('ArrowLeft')  && s.kursor > 0){ s.kursor--; sfx('sfx_zbierz'); }
  if(nowy('ArrowRight') && s.kursor < SZUK_ILE-1){ s.kursor++; sfx('sfx_zbierz'); }
  if(nowy('ArrowUp')){
    if(s.kursor === s.moja){
      s.wynik = 'dobrze'; s.t = 0;
      sfx('sfx_sukces'); iskry(46 + s.kursor*76, 130, ['#f8d878','#fffeff','#58d854'], 20);
      mow('szuk_ok');
    } else { sfx('sfx_zle'); mow('szuk_zle'); }
  }
  aktualizujEfekty(); czyscNowe();
}
function rysujKurtke(k, x, y, skala){
  const w = Math.round(46*skala), h = Math.round(60*skala);
  pr(x-w/2, y, w, h, k.kol); obrys(x-w/2, y, w, h);
  pr(x-w/2, y, w, Math.round(6*skala), k.jasny);
  pr(x-w/2-Math.round(8*skala), y+Math.round(4*skala), Math.round(8*skala), Math.round(34*skala), k.kol);
  pr(x+w/2, y+Math.round(4*skala), Math.round(8*skala), Math.round(34*skala), k.kol);
  pr(x-1, y, 2, h, k.jasny);                                   // zamek
  if(k.wzor === 'paski') for(let i=0;i<3;i++) pr(x-w/2, y+Math.round((16+i*12)*skala), w, Math.round(4*skala), k.jasny);
  if(k.wzor === 'kropki') for(let i=0;i<6;i++)
    pr(x-w/2+Math.round((6+(i%3)*14)*skala), y+Math.round((14+Math.floor(i/3)*20)*skala), Math.round(6*skala), Math.round(6*skala), k.jasny);
}
function rysujSzukanie(){
  const s = G.szukanie;
  pr(0,0,W,H,'#f7d8a5');
  pr(0,214,W,56,'#ac7c00'); pr(0,214,W,4,'#e4c08a');
  pr(0,84,W,6,'#883800'); obrys(0,84,W,6);                     // drążek z wieszakami

  for(let i=0;i<SZUK_ILE;i++){
    const x = 46 + i*76;
    pr(x-2, 74, 4, 12, '#bcbcbc');

      ctx.strokeStyle = '#58d854'; ctx.lineWidth = 3; ctx.strokeRect(x-32, 84, 64, 68);
    }
    if(s.pokaz === 0 && i === s.kursor){
      if(Math.floor(G.t/8)%2===0){ ctx.strokeStyle = '#f8d878'; ctx.lineWidth = 3; ctx.strokeRect(x-32, 84, 64, 68); }
      strzalka(x, 166, G.t);

  pr(0,0,W,20,'#000000'); pr(0,20,W,1,'#4f4f4f');
  napisL('SZUKAMY KURTKI', 4, 10, '#fffeff', null, 1);
  napisL('RUNDA ' + Math.min(SZUK_RUND, s.runda+1) + '/' + SZUK_RUND, W-92, 10, '#f8d878', null, 1);
  const t = s.pokaz > 0 ? 'TO TWOJA KURTKA - ZAPAMIĘTAJ!' : (s.wynik === 'dobrze' ? 'TO TA! BRAWO!' : 'KTÓRA JEST TWOJA?');
  const tw = szerTekstu(t, s.pokaz > 0 ? 1 : 2);
  pr(W/2-tw/2-6, 24, tw+12, s.pokaz > 0 ? 14 : 22, s.pokaz > 0 ? '#007800' : '#000000');
  napis(t, W/2, s.pokaz > 0 ? 31 : 35, '#f8d878', null, s.pokaz > 0 ? 1 : 2);
  napis('<  >  SZUKAJ     ^  ZDEJMIJ', W/2, 244, '#fffeff', '#000000', 2);
  if(s.koniecT > 0){
    ctx.globalAlpha = 0.65; pr(0,0,W,H,'#000000'); ctx.globalAlpha = 1;
    napis('ZNALAZŁEŚ SWOJĄ KURTKĘ!', W/2, 118, '#f8d878', '#000000', 2);
    napis('IDZIEMY DO DOMU!', W/2, 152, '#fffeff', '#000000', 2);
  }
  rysujDebug();
}

/* ==================== MINIGRA: BAŃKI W KĄPIELI ====================
   Z wanny lecą bańki mydlane. ◀ ▶ przesuwają rączkę, a bańka pęka od
   samego dotknięcia – nie trzeba nic naciskać. */
let BANIEK = 12;
function startBaniek(){
  G.banki = { reka:W/2, zbite:0, banki:[], koniecT:0, t:0 };
  G.czastki = []; G.ekran = 'banki';
  graj('muz_gra'); mow('banki_jak');
}
function nowaBanka(){
  return { x:60 + Math.random()*(W-120), y:250 + Math.random()*30,
           r:8 + Math.random()*9, v:0.5 + Math.random()*0.7, kiw:Math.random()*6 };
}
function aktualizujBanki(){
  const b = G.banki;
  b.t++;
  if(b.koniecT > 0){
    b.koniecT--;
    if(b.koniecT === 0) dalejPoPoziomie();
    aktualizujEfekty(); czyscNowe(); return;
  }
  if(b.banki.length < 5 && b.t % 26 === 0 && b.zbite + b.banki.length < BANIEK) b.banki.push(nowaBanka());
  b.reka += ((klaw['ArrowRight']?1:0) - (klaw['ArrowLeft']?1:0)) * 3.2;
  b.reka = Math.max(24, Math.min(W-24, b.reka));
  for(let i=b.banki.length-1;i>=0;i--){
    const ba = b.banki[i];
    ba.y -= ba.v; ba.x += Math.sin((b.t + ba.kiw*20)*0.04)*0.6;
    const dx = ba.x - b.reka, dy = ba.y - 140;
    if(Math.sqrt(dx*dx + dy*dy) < ba.r + 14){                 // pyk!
      b.banki.splice(i,1); b.zbite++;
      sfx('sfx_zbierz');
      iskry(ba.x, ba.y, ['#fffeff','#3cbcfc','#64b0ff'], 10);
      if(b.zbite % 4 === 0 && b.zbite < BANIEK) mow('licz_' + b.zbite);
      if(b.zbite >= BANIEK){ b.koniecT = 210; sfx('sfx_sukces'); cisza(); mow('banki_koniec'); }
      continue;
    }
    if(ba.y < -20) b.banki.splice(i,1);
  }
  aktualizujEfekty(); czyscNowe();
}
function rysujBanki(){

  if(gl) ctx.drawImage(gl, 44, 176, 24, 22); else pr(44, 176, 24, 22, SKORA);

  napisL('BAŃKI: ' + b.zbite + '/' + BANIEK, W-104, 10, '#f8d878', null, 1);
  const tw = szerTekstu('ŁAP BAŃKI RĄCZKĄ!', 2);
  pr(W/2-tw/2-6, 24, tw+12, 22, '#000000');
  napis('ŁAP BAŃKI RĄCZKĄ!', W/2, 35, '#f8d878', null, 2);
  const bw = szerTekstu('<  >  RUSZAJ RĄCZKĄ', 2);
  pr(W/2-bw/2-6, 248, bw+12, 20, '#000000');
  napis('<  >  RUSZAJ RĄCZKĄ', W/2, 258, '#fffeff', '#000000', 2);

    napis('WSZYSTKIE BAŃKI PYK!', W/2, 118, '#f8d878', '#000000', 2);
    napis('BRAWO FRANEK!', W/2, 152, '#fffeff', '#000000', 2);

  o.t++;

    o.koniecT--;

    if(o.koniecT === 0) dalejPoPoziomie();
    aktualizujEfekty(); czyscNowe(); return;

  const w = o.owca;
  if(w.stan === 'idzie'){
    w.x += 1.5;

      o.powieki = Math.min(0.72, o.policzone/OWIEC * 0.72);

    w.skok += 0.055;
    w.x = 190 + w.skok*150;
    w.y = -Math.sin(w.skok*Math.PI)*70;

  aktualizujEfekty(); czyscNowe();

  if(i.rzut){                                        // śnieżka leci do kotka

const ALFABET_PL = [
  {ik:'kot',      lit:'K', glos:'alf_kot'},

  {ik:'mleko',     lit:'M', glos:'alf_mleko'},
  {ik:'krolik',    lit:'R', glos:'alf_krolik'},
  {ik:'marchewka', lit:'C', glos:'alf_marchewka'}
];
const LITERY_PULA = 'ABCDEFGHIJKLMNOPRSTUWYZ'.split('');
function startAlfabetu(){
  const slowa = (JEZYK === 'en' ? ALFABET_EN : ALFABET_PL).slice();
  for(let i=slowa.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; const x=slowa[i]; slowa[i]=slowa[j]; slowa[j]=x; }
  G.alfabet = { slowa, runda:0, rund:ile(3,5), litery:[], kursor:0, wynik:null, t:0, koniecT:0 };
  G.czastki = []; G.ekran = 'alfabet';
  graj('muz_gra');
  noweSlowo(true);
}
function noweSlowo(pierwsze){
  const a = G.alfabet;
  const s = a.slowa[a.runda % a.slowa.length];
  const litery = [s.lit];
  while(litery.length < 3){
    const l = LITERY_PULA[(Math.random()*LITERY_PULA.length)|0];
    if(!litery.includes(l)) litery.push(l);
  }
  for(let i=litery.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; const x=litery[i]; litery[i]=litery[j]; litery[j]=x; }
  a.slowo = s; a.litery = litery; a.dobra = litery.indexOf(s.lit);

  pytajOLitere(pierwsze);

function pytajOLitere(zInstrukcja){

function literaGlos(l){ return 'lit_' + l.toLowerCase(); }
function aktualizujAlfabet(){

/* ==================== MINIGRA: MEMORY ====================
   Karty leżą obrazkiem do dołu, trzeba znaleźć pary. ◀ ▶ przesuwają
   rączkę, ▲ odwraca kartę. Klasyka na pamięć dla przedszkolaka. */
const MEM_OBRAZKI = ['kot','rybka','mis','marchewka','czapka'];
function startMemory(){
  const par = ile(3, 4);
  const karty = [];
  for(let i=0;i<par;i++){ karty.push({ik:MEM_OBRAZKI[i]}, {ik:MEM_OBRAZKI[i]}); }
  for(let i=karty.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; const x=karty[i]; karty[i]=karty[j]; karty[j]=x; }
  karty.forEach(k => { k.odkryta = false; k.zdjeta = false; });
  G.memory = { karty, par, znalezione:0, kursor:0, pierwsza:null, czekanie:0, koniecT:0, t:0 };
  G.czastki = []; G.ekran = 'memory';
  graj('muz_gra'); mow('mem_jak');
}
function aktualizujMemory(){
  const m = G.memory;
  m.t++;
  if(m.koniecT > 0){
    m.koniecT--;
    if(m.koniecT === 0) dalejPoPoziomie();
    aktualizujEfekty(); czyscNowe(); return;
  }
  if(m.czekanie > 0){                                   // dwie odkryte – chwila na popatrzenie
    m.czekanie--;
    if(m.czekanie === 0){
      const [a,b] = m.odkryte;
      if(m.karty[a].ik === m.karty[b].ik){
        m.karty[a].zdjeta = m.karty[b].zdjeta = true;
        m.znalezione++;
        sfx('sfx_sukces');
        iskry(240, 130, ['#f8d878','#58d854','#fffeff'], 16);
        if(m.znalezione >= m.par){ m.koniecT = 215; cisza(); mow('mem_koniec'); }
        else mow('mem_para');
      } else {
        m.karty[a].odkryta = m.karty[b].odkryta = false;
        sfx('sfx_zle'); mow('mem_nie');
      }
      m.pierwsza = null; m.odkryte = null;
    }
    aktualizujEfekty(); czyscNowe(); return;
  }
  const ostatnia = m.karty.length - 1;
  if(nowy('ArrowLeft')  && m.kursor > 0){ m.kursor--; sfx('sfx_zbierz'); }
  if(nowy('ArrowRight') && m.kursor < ostatnia){ m.kursor++; sfx('sfx_zbierz'); }
  if(nowy('ArrowUp')){
    const k = m.karty[m.kursor];
    if(k.zdjeta || k.odkryta){ sfx('sfx_zle'); }
    else {
      k.odkryta = true; sfx('sfx_skok');
      if(m.pierwsza === null) m.pierwsza = m.kursor;
      else { m.odkryte = [m.pierwsza, m.kursor]; m.czekanie = 55; }
    }
  }
  aktualizujEfekty(); czyscNowe();
}

    ctx.globalAlpha = 0.25;

  G.pisanie = { slowa, runda:0, rund:ile(3,4), ulozone:'', klocki:[], kursor:0,

function noweSlowoDoPisania(pierwsze){
  const p = G.pisanie;
  const s = p.slowa[p.runda % p.slowa.length];
  const litery = [...s.slowo];
  const pula = LITERY_PULA.filter(l => !litery.includes(l) && gotoweLitery(l));
  while(litery.length < Math.min(7, s.slowo.length + 2)){          // dwie litery na zmyłkę
    const l = pula[(Math.random()*pula.length)|0];
    if(!litery.includes(l)) litery.push(l);
  }
  for(let i=litery.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; const x=litery[i]; litery[i]=litery[j]; litery[j]=x; }
  p.slowo = s; p.klocki = litery.map(l => ({litera:l, uzyta:false}));
  p.ulozone = ''; p.kursor = 0; p.wynik = null; p.t = 0; p.trzesie = 0;
  mow(...(pierwsze ? ['pisz_jak'] : []), 'pisz_slowo', s.glos);
}
function aktualizujPisanie(){
  const p = G.pisanie;
  p.t++;

    p.koniecT--;

    aktualizujEfekty(); czyscNowe(); return;
  }
  if(p.wynik === 'dobrze'){
    if(p.t > 130){
      p.runda++;
      if(p.runda >= p.rund){ p.koniecT = 215; sfx('sfx_sukces'); cisza(); mow('pisz_koniec'); }
      else noweSlowoDoPisania(false);
    }
    aktualizujEfekty(); czyscNowe(); return;
  }
  if(nowy('ArrowLeft')  && p.kursor > 0){ p.kursor--; sfx('sfx_zbierz'); }
  if(nowy('ArrowRight') && p.kursor < p.klocki.length-1){ p.kursor++; sfx('sfx_zbierz'); }
  if(nowy('ArrowDown')) mow('pisz_slowo', p.slowo.glos);          // powtórz słowo
  if(nowy('ArrowUp')){
    const k = p.klocki[p.kursor];

    if(k.uzyta){ sfx('sfx_zle'); }

      iskry(W/2 - (p.slowo.slowo.length-1)*17 + (p.ulozone.length-1)*34, 112, ['#f8d878','#fffeff'], 8);

  aktualizujEfekty(); czyscNowe();
}

function petla(ts){
  requestAnimationFrame(petla);
  if(!ostatni) ostatni = ts;
  let dt = (ts - ostatni)/1000; ostatni = ts;
  if(dt > 0.25) dt = 0.25;
  akum += dt;
  let kroki = 0;
  while(akum >= 1/60 && kroki < 5){ akum -= 1/60; krok(); kroki++; }
  rysuj();
}

    '(albo <b>Dodaj do ekranu głównego</b>)<br>' +
    '• <b>Komputer, Chrome / Edge:</b> ikonka instalacji po prawej stronie paska adresu<br><br>' +
    'Gdyby tego nie było, odśwież stronę – gra musi się raz wczytać do końca.';
}
przyciskInstaluj.addEventListener('click', async e => {
  e.stopPropagation();
  if(zachetaInstalacji){
    try{
      zachetaInstalacji.prompt();
      const wybor = await zachetaInstalacji.userChoice.catch(() => null);
      zachetaInstalacji = null;
      if(wybor && wybor.outcome === 'accepted') document.body.classList.remove('mozna');
      return;
    }catch(err){
      zachetaInstalacji = null;      // okienko się nie otworzyło – zostaje instrukcja
    }
  }
  document.getElementById('jakTresc').innerHTML = tekstJakZainstalowac();
  okienkoJak.classList.add('widac');
});
document.getElementById('zamknijJak').addEventListener('click', e => {
  e.stopPropagation(); okienkoJak.classList.remove('widac');
});
addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  zachetaInstalacji = e;
  pokazPrzyciskInstaluj(JEZYK === 'en' ? '📲 INSTALL THE GAME' : '📲 ZAINSTALUJ GRĘ');
});
addEventListener('appinstalled', () => {
  zachetaInstalacji = null;
  document.body.classList.remove('mozna');
});
// iPhone nigdy nie da zachęty; na innych czekamy chwilę i też podpowiadamy ręcznie
if(naIPhonie) pokazPrzyciskInstaluj(JEZYK === 'en' ? '📲 HOW TO INSTALL?' : '📲 JAK ZAINSTALOWAĆ?');
else setTimeout(() => { if(!zachetaInstalacji) pokazPrzyciskInstaluj('📲 JAK ZAINSTALOWAĆ?'); }, 4000);

/* ==================== PWA: zawsze świeża wersja ====================
   Service worker trzyma grę offline, ale index.html bierze najpierw z sieci,
   więc po każdym wejściu gra jest w najnowszej wersji. Gdy w tle pojawi się
   nowa wersja, strona przeładowuje się sama (ale nigdy w środku zabawy). */
if('serviceWorker' in navigator){
  const bylJuzWorker = !!navigator.serviceWorker.controller;
  let przeladowano = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if(!bylJuzWorker || przeladowano) return;   // pierwsza instalacja nie przeładowuje
    przeladowano = true;
    location.reload();
  });
  addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js', {scope:'./', updateViaCache:'none'}).then(rej => {
      const sprawdz = () => { if(document.visibilityState === 'visible') rej.update().catch(()=>{}); };
      addEventListener('visibilitychange', sprawdz);
      setInterval(sprawdz, 15 * 60 * 1000);      // gra bywa włączona godzinami
    }).catch(()=>{});
  });
}
</script>
