<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>Poranek Franka</title>
<meta name="description" content="Ośmiobitowa gra 2D dla 5–6 latków: poranek Franka i Poli, od wstawania do przedszkola.">
<!-- PWA: da się zainstalować na pulpicie i chodzi na pełnym ekranie -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0000bc">
<link rel="icon" href="ikona-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Poranek Franka">
<style>
  html,body{margin:0;padding:0;height:100%;background:#0b0c14;overflow:hidden;
    font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-user-select:none;user-select:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  canvas{width:min(100vw, calc(100vh * 16 / 9));height:auto;aspect-ratio:16/9;
    image-rendering:pixelated;image-rendering:crisp-edges;
    box-shadow:0 0 0 4px #1a1c2c, 0 0 60px rgba(0,0,0,.8);touch-action:none;display:block;}
  canvas:focus{outline:3px solid #f8d878;outline-offset:6px;}
  /* Przyciski dotykowe leżą na sztywnych pozycjach, bo w niektórych etapach
     ◀ i ▶ rozjeżdżają się do obu krawędzi – wtedy gra się dwoma kciukami. */
  #dotyk{position:fixed;inset:0;display:none;pointer-events:none;
    --bw:78px; --pad:18px; --luz:12px;}
  #dotyk button{position:absolute;bottom:calc(var(--pad) - 4px);pointer-events:auto;
    width:var(--bw);height:var(--bw);border-radius:10px;border:3px solid #fffeff;
    font-size:32px;color:#fffeff;background:rgba(0,0,0,.45);font-family:monospace;}
  #dotyk button:active{background:rgba(248,216,120,.6);}
  body.dotyk #dotyk{display:block;}
  /* domyślnie: chodzenie po lewej pod jednym kciukiem, skok po prawej */
  #dotyk button[data-k="ArrowLeft"] {left:var(--pad);}
  #dotyk button[data-k="ArrowRight"]{left:calc(var(--pad) + var(--bw) + var(--luz));}
  #dotyk button[data-k="ArrowUp"]   {right:var(--pad);}
  #dotyk button[data-k="ArrowDown"] {right:calc(var(--pad) + var(--bw) + var(--luz));}
  /* ▼ zmienia pas tylko w samochodzie, a strefę tylko przy myciu ząbków */
  #dotyk button[data-k="ArrowDown"]{display:none;}
  body.wAucie #dotyk button[data-k="ArrowDown"],
  body.strefy #dotyk button[data-k="ArrowDown"]{display:block;}
  /* etapy „na dwa kciuki" (wyścigi, szorowanie, sikanie, wstawanie, światło):
     ◀ przy lewej krawędzi, ▶ przy prawej, a ▲ ▼ na środku pod spodem */
  body.dwaKciuki #dotyk button[data-k="ArrowRight"]{left:auto;right:var(--pad);}
  body.dwaKciuki #dotyk button[data-k="ArrowUp"]{right:auto;left:50%;
    margin-left:calc(var(--luz) / 2);}
  body.dwaKciuki #dotyk button[data-k="ArrowDown"]{right:auto;left:50%;
    margin-left:calc(-1 * var(--bw) - var(--luz) / 2);}
  body.dwaKciuki:not(.strefy) #dotyk button[data-k="ArrowUp"]{margin-left:calc(var(--bw) / -2);}
  #glosnik{position:fixed;top:10px;right:12px;width:44px;height:44px;border:3px solid #fffeff;
    border-radius:8px;background:rgba(0,0,0,.5);color:#fffeff;font-size:20px;cursor:pointer;}

  /* --- telefon trzymany pionowo: poproś o obrót --- */
  #obroc{position:fixed;inset:0;z-index:99;display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:26px;padding:24px;box-sizing:border-box;
    background:#0000bc;color:#fffeff;text-align:center;
    font-family:ui-monospace,Menlo,Consolas,monospace;}
  #obroc .telefon{width:76px;height:130px;border:6px solid #fffeff;border-radius:10px;
    position:relative;animation:obrotFazy 2.4s ease-in-out infinite;}
  #obroc .telefon::after{content:"";position:absolute;left:50%;bottom:6px;transform:translateX(-50%);
    width:26px;height:4px;background:#fffeff;border-radius:2px;}
  #obroc h1{font-size:20px;margin:0;line-height:1.5;letter-spacing:1px;color:#f8d878;}
  #obroc p{font-size:13px;margin:0;line-height:1.6;color:#c0dfff;max-width:22em;}
  @keyframes obrotFazy{
    0%,30%{transform:rotate(0deg);} 55%,85%{transform:rotate(-90deg);} 100%{transform:rotate(0deg);}
  }
  @media (prefers-reduced-motion: reduce){ #obroc .telefon{animation:none;transform:rotate(-90deg);} }
  @media (orientation: portrait) and (pointer: coarse){
    #obroc{display:flex;}
    #wrap,#dotyk,#glosnik{display:none !important;}
  }
  /* zapas dla urządzeń, które raportują rysik jako „pointer: fine" */
  @media (orientation: portrait) and (hover: none){
    #obroc{display:flex;}
    #wrap,#dotyk,#glosnik{display:none !important;}
  }
  /* --- instalacja na pulpicie --- */
  #instaluj{position:fixed;top:10px;left:12px;z-index:100;display:none;
    padding:9px 13px;border:3px solid #fffeff;border-radius:8px;background:#0000bc;color:#f8d878;
    font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;letter-spacing:1px;cursor:pointer;}
  #instaluj:active{background:#a80020;}
  body.mozna.wMenu #instaluj{display:block;}
  #jakInstalowac{position:fixed;inset:0;z-index:101;display:none;align-items:center;justify-content:center;
    padding:20px;box-sizing:border-box;background:rgba(0,0,0,.8);
    font-family:ui-monospace,Menlo,Consolas,monospace;}
  #jakInstalowac.widac{display:flex;}
  #jakInstalowac .pudlo{background:#0000bc;border:4px solid #fffeff;border-radius:10px;
    padding:22px;max-width:30em;color:#c0dfff;text-align:center;}
  #jakInstalowac h2{margin:0 0 14px;font-size:16px;color:#f8d878;letter-spacing:1px;}
  #jakInstalowac p{margin:0 0 16px;font-size:13px;line-height:1.7;}
  #jakInstalowac b{color:#fffeff;}
  #jakInstalowac button{padding:9px 20px;border:3px solid #fffeff;border-radius:8px;
    background:#a80020;color:#fffeff;font-family:inherit;font-size:13px;letter-spacing:1px;cursor:pointer;}
  /* telefon pionowo: gra jest schowana, więc przycisk instalacji na środku pod spodem */
  @media (orientation: portrait) and (pointer: coarse){
    body.mozna #instaluj{display:block;top:auto;bottom:22px;left:50%;transform:translateX(-50%);}
  }
  @media (orientation: portrait) and (hover: none){
    body.mozna #instaluj{display:block;top:auto;bottom:22px;left:50%;transform:translateX(-50%);}
  }
  /* niskie ekrany (telefon poziomo) – mniejsze przyciski, żeby nie zasłaniały gry */
  @media (pointer: coarse) and (max-height: 460px){
    #dotyk{--bw:58px; --pad:12px; --luz:10px;}
    #dotyk button{font-size:24px;opacity:.75;}
    #glosnik{width:36px;height:36px;font-size:16px;top:6px;right:8px;}
  }
</style>
</head>
<body>
<div id="obroc">
  <div class="telefon"></div>
  <h1>OBRÓĆ TELEFON<br>POZIOMO</h1>
  <p>Gra działa na leżąco.<br>Dotknij ekranu, żeby włączyć pełny ekran.</p>
</div>
<div id="wrap"><canvas id="c" width="480" height="270" tabindex="0"></canvas></div>
<button id="glosnik" title="Dźwięk włącz/wyłącz">🔊</button>
<button id="instaluj">📲 ZAINSTALUJ GRĘ</button>
<div id="jakInstalowac">
  <div class="pudlo">
    <h2>GRA NA PULPICIE</h2>
    <p id="jakTresc"></p>
    <button id="zamknijJak">DOBRA, ROZUMIEM</button>
  </div>
</div>
<div id="dotyk">
  <button data-k="ArrowLeft">◀</button><button data-k="ArrowRight">▶</button>
  <button data-k="ArrowDown">▼</button><button data-k="ArrowUp">▲</button>
</div>
<script>
"use strict";

/* ======================================================================
   PORANEK FRANKA — 8-bitowa gra 2D dla 5–6 latków. Sterowanie: strzałki.
   Renderowanie: 480x270 pikseli, powiększane bez wygładzania.
   ====================================================================== */

/* --- USTAWIENIA, KTÓRE ŁATWO ZMIENIĆ ------------------------------- */
const CZAS_MYCIA_ZEBOW = 35;        // bazowe SEKUNDY szczotkowania; ruch skraca je
                                    // 2x (trzymanie strzałki) lub 3x (szorowanie
                                    // lewo-prawo na zmianę)
const DROGA_DO_PRZEDSZKOLA = 7000;  // długość trasy samochodem
const GLOSNOSC_MUZYKI = 0.30;
const GLOSNOSC_NARRATORA = 1.0;
const GLOSNOSC_EFEKTOW = 0.5;
/* ------------------------------------------------------------------- */

const W = 480, H = 270;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

/* ==================== WEJŚCIE ==================== */
const klaw = {};
const KLAWISZE = ['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'];
addEventListener('keydown', e => {
  if (KLAWISZE.includes(e.key)) { e.preventDefault(); if(!klaw[e.key]) klaw[e.key+'_nowy']=true; klaw[e.key]=true; }
  odblokujDzwiek();
  if (e.key === 'ArrowUp') pelnyEkranPrzyWyborze();
  // DEBUG: P – następny etap, O – poprzedni (do podglądania, jak co wygląda)
  if (e.key === 'p' || e.key === 'P') debugEtap(1);
  if (e.key === 'o' || e.key === 'O') debugEtap(-1);
});
addEventListener('keyup', e => { if (KLAWISZE.includes(e.key)) { e.preventDefault(); klaw[e.key]=false; } });
addEventListener('blur', () => KLAWISZE.forEach(k => klaw[k]=false));
function nowy(k){ if(klaw[k+'_nowy']){ klaw[k+'_nowy']=false; return true; } return false; }
function czyscNowe(){ KLAWISZE.forEach(k => klaw[k+'_nowy']=false); }

if ('ontouchstart' in window) {
  document.body.classList.add('dotyk');
  document.querySelectorAll('#dotyk button').forEach(b => {
    const k = b.dataset.k;
    const on = e => { e.preventDefault(); if(!klaw[k]) klaw[k+'_nowy']=true; klaw[k]=true; odblokujDzwiek();
                      if(k === 'ArrowUp') pelnyEkranPrzyWyborze(); };
    const off = e => { e.preventDefault(); klaw[k]=false; };
    b.addEventListener('touchstart', on, {passive:false}); b.addEventListener('touchend', off);
    b.addEventListener('touchcancel', off); b.addEventListener('mousedown', on);
    b.addEventListener('mouseup', off); b.addEventListener('mouseleave', off);
  });
}
function klikniecieWPlansze(e){
  odblokujDzwiek(); cv.focus();
  if (G.ekran === 'wybor'){
    // dotknięcie portretu od razu wybiera postać i zaczyna grę
    const r = cv.getBoundingClientRect();
    const punkt = (e && e.touches && e.touches[0]) ? e.touches[0] : e;
    if (punkt && typeof punkt.clientX === 'number' && r.width)
      G.kto = ((punkt.clientX - r.left) / r.width < 0.5) ? 'franek' : 'pola';
    pelnyEkranPrzyWyborze();
    klaw['ArrowUp_nowy'] = true;
    return;
  }
  const wybieramyRodzica = G.ekran === 'opiekun' ||
    (G.ekran === 'ksiazka' && G.ksiazka && G.ksiazka.etap === 'ktoCzyta');
  if (wybieramyRodzica){
    const r = cv.getBoundingClientRect();
    const punkt = (e && e.touches && e.touches[0]) ? e.touches[0] : e;
    if (punkt && typeof punkt.clientX === 'number' && r.width){
      const lewa = (punkt.clientX - r.left) / r.width < 0.5;
      if(G.ekran === 'opiekun') G.opiekun = lewa ? 'mama' : 'tata';
      else G.ksiazka.czyta = lewa ? 'mama' : 'tata';
    }
    klaw['ArrowUp_nowy'] = true;
    return;
  }
  if (G.ekran==='intro' || G.ekran==='karta' || G.ekran==='koniec') klaw['ArrowUp_nowy'] = true;
}

/* Telefon: pełny ekran + blokada w poziomie. Da się wywołać tylko z gestu
   użytkownika, więc siedzi na dotknięciu ekranu proszącego o obrót. */
/* Wywoływane wprost z obsługi klawisza/dotknięcia – przeglądarka pozwala
   wejść w pełny ekran tylko w trakcie gestu użytkownika, więc nie da się
   tego zrobić z pętli gry. */
function pelnyEkranPrzyWyborze(){
  if(typeof G === 'undefined' || G.ekran !== 'wybor') return;
  if(document.fullscreenElement || document.webkitFullscreenElement) return;
  naPelnyEkran();
}
function naPelnyEkran(){
  const el = document.documentElement;
  const zadaj = el.requestFullscreen || el.webkitRequestFullscreen;
  if(zadaj){
    const p = zadaj.call(el);
    if(p && p.then) p.then(zablokujPoziomo).catch(()=>{});
    else zablokujPoziomo();
  }
}
function zablokujPoziomo(){
  try{
    if(screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(()=>{});
  }catch(e){}
}
document.getElementById('obroc').addEventListener('click', () => { odblokujDzwiek(); naPelnyEkran(); });
['pointerdown','mousedown','touchstart'].forEach(z =>
  cv.addEventListener(z, klikniecieWPlansze, {passive:true}));

/* ==================== DŹWIĘK ==================== */
/* Pliki z ElevenLabs (audio/*.mp3). Gdy ich nie ma – awaryjne piszczenie
   z WebAudio, żeby gra nigdy nie była niema. */
let dzwiekWlaczony = true, dzwiekOdblokowany = false;
const KAT_AUDIO = 'audio/';
const PLIKI = (typeof AUDIO_WBUDOWANE !== 'undefined') ? AUDIO_WBUDOWANE : null;
const bufory = {};          // klucz -> HTMLAudioElement (wzorzec)
const gotowe = {};          // klucz -> czy da się odtworzyć

function zrodlo(klucz){ return PLIKI ? (PLIKI[klucz] || null) : (KAT_AUDIO + klucz + '.mp3'); }
function wczytajAudio(klucz, glosnosc, petla){
  const src = zrodlo(klucz);
  if(!src) return null;
  const a = new Audio();
  a.preload = 'auto';
  a.loop = !!petla;
  a.volume = glosnosc;
  a.addEventListener('canplaythrough', () => { gotowe[klucz] = true; });
  a.addEventListener('error', () => { gotowe[klucz] = false; });
  a.src = src;
  bufory[klucz] = a;
  return a;
}

let AC = null;
function odblokujDzwiek(){
  if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(AC && AC.state === 'suspended') AC.resume();
  dzwiekOdblokowany = true;
}
function ton(f, dl, typ='square', gl=0.06, op=0){
  if(!AC || !dzwiekWlaczony) return;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = typ; o.frequency.value = f;
  g.gain.setValueAtTime(0, AC.currentTime+op);
  g.gain.linearRampToValueAtTime(gl, AC.currentTime+op+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime+op+dl);
  o.connect(g); g.connect(AC.destination);
  o.start(AC.currentTime+op); o.stop(AC.currentTime+op+dl+0.02);
}
const ZAPAS = {                       // awaryjne chiptune'y
  sfx_skok(){ ton(420,0.10,'square',0.05); ton(660,0.09,'square',0.04,0.05); },
  sfx_zbierz(){ ton(880,0.07,'square',0.05); ton(1180,0.12,'square',0.05,0.07); },
  sfx_sukces(){ [523,659,784,1047].forEach((f,i)=>ton(f,0.2,'square',0.06,i*0.1)); },
  sfx_zle(){ ton(200,0.12,'sawtooth',0.05); ton(150,0.16,'sawtooth',0.05,0.1); },
  sfx_bum(){ ton(90,0.2,'sawtooth',0.07); },
  sfx_drzwi(){ [660,880,1047].forEach((f,i)=>ton(f,0.14,'square',0.05,i*0.08)); }
};
const KLUCZE_SFX = ['sfx_skok','sfx_zbierz','sfx_sukces','sfx_zle','sfx_bum','sfx_drzwi'];
function sfx(klucz){
  if(!dzwiekWlaczony) return;
  const wzor = bufory[klucz];
  const zapas = () => { if(ZAPAS[klucz]) ZAPAS[klucz](); };
  if(!wzor || gotowe[klucz] === false){ zapas(); return; }
  const k = wzor.cloneNode();
  k.volume = GLOSNOSC_EFEKTOW;
  const p = k.play();
  if(p && p.catch) p.catch(zapas);       // plik jeszcze się ładuje -> piszczyk z WebAudio
}

/* --- narrator (Franek nie umie czytać, więc wszystko jest mówione) --- */
let mowaTeraz = null, kolejkaMowy = [];
function mow(...klucze){
  if(!dzwiekWlaczony) return;
  kolejkaMowy = klucze.filter(Boolean);
  nastepnaMowa(true);
}
function dopowiedz(klucz){
  if(!dzwiekWlaczony || !klucz) return;
  kolejkaMowy.push(klucz);
  if(!mowaTeraz) nastepnaMowa(false);
}
function nastepnaMowa(przerwij){
  if(przerwij && mowaTeraz){ try{ mowaTeraz.pause(); mowaTeraz.currentTime = 0; }catch(e){} mowaTeraz = null; }
  if(mowaTeraz) return;
  const k = kolejkaMowy.shift();
  if(!k) return;
  const wzor = bufory[k];
  if(!wzor || gotowe[k] === false){ nastepnaMowa(false); return; }
  const a = wzor.cloneNode();
  a.volume = GLOSNOSC_NARRATORA;
  a.addEventListener('ended', () => { mowaTeraz = null; nastepnaMowa(false); });
  a.addEventListener('error', () => { mowaTeraz = null; nastepnaMowa(false); });
  mowaTeraz = a;
  a.play().catch(() => { mowaTeraz = null; nastepnaMowa(false); });
}
function cisza(){
  kolejkaMowy = [];
  if(mowaTeraz){ try{ mowaTeraz.pause(); }catch(e){} mowaTeraz = null; }
}

/* --- muzyka --- */
let muzykaTeraz = null, muzykaKlucz = null;
function graj(klucz){
  if(muzykaKlucz === klucz){
    if(muzykaTeraz && muzykaTeraz.paused && dzwiekWlaczony) muzykaTeraz.play().catch(()=>{});
    return;
  }
  if(muzykaTeraz){ try{ muzykaTeraz.pause(); }catch(e){} }
  muzykaKlucz = klucz;
  const a = bufory[klucz];
  muzykaTeraz = a || null;
  if(a && dzwiekWlaczony){
    a.volume = GLOSNOSC_MUZYKI;
    try{ a.currentTime = 0; }catch(e){}
    const p = a.play();
    // gdy plik nie zdążył się wczytać, spróbuj ponownie, kiedy będzie gotowy
    if(p && p.catch) p.catch(() => {
      a.addEventListener('canplay', () => {
        if(dzwiekWlaczony && muzykaKlucz === klucz) a.play().catch(()=>{});
      }, {once:true});
    });
  }
}
const KLUCZE_MUZ = ['muz_menu','muz_gra','muz_jazda','muz_koniec'];
const KLUCZE_MOWA = [
  // Franek wybiera opiekuna (z mamą taksówka i autobus) oraz kto go kładzie spać
  'f_wybor_opiekuna','ksiazka_kto','ksiazka_czyta_mama','ksiazka_czyta_tata',
  'ksiazka_przytulas_mama','ksiazka_przytulas_tata','bilet_jak','bilet_ok','bilet_zle',
  'fm_poziom8','fm_poziom9','fm_poziom10','fm_poziom11','fm_poziom12','fm_poziom15',
  'fm_poziom16','fm_poziom17','fm_poziom19','fm_zad_przytulas','fm_przytulas','fm_pomachaj',
  'fm_szybciej','fm_szybciej2','fm_lapanie_jak','fm_lapanie_uciekl','fm_dom_czysty',
  'fm_jazda_dom','fm_zad_samochod',
  // wieczór Franka w domu: zabawa, Igor, kolacja, kąpiel, książka i sen
  'f_poziom20','f_poziom21','f_poziom22','f_poziom23','f_poziom24','f_poziom25',
  'f_poziom26','f_poziom27','f_koniec3',
  'zad_tory','zad_lego','zad_rebusy','zad_plot','zad_ryba','zad_frytki','zad_kolacja',
  'zad_pizama','kolacja_mniam',
  'igor_pilka','igor_autka','igor_chowany','igor_koniec',
  'kapiel_jak','kapiel_szyja','kapiel_glowa','kapiel_rece','kapiel_nogi','kapiel_pupa',
  'kapiel_stopy','kapiel_czysta','kapiel_recznik','kapiel_koniec',
  'ksiazka_wybor','ksiazka_muminki','ksiazka_kocia','ksiazka_pirat','ksiazka_autka',
  'ksiazka_przytulas','ksiazka_dobranoc','sen_jak','sen_koniec',
  // Pola idzie do przedszkola z mamą albo z tatą Adamem
  'p_wybor_opiekuna','pt_przytulas','pt_zad_przytulas','pt_pomachaj','pt_szybciej','pt_szybciej2',
  'pt2_poziom8','pt2_poziom10','pt2_poziom11','pt2_poziom12',
  // dalszy ciąg dnia Franka: przedszkole, powrót do domu i wieczór
  'f_poziom13','f_poziom14','f_poziom15','f_poziom16','f_poziom17','f_poziom18','f_poziom19',
  'kolko_jak','kolko_ok','dzien_klocki','dzien_farby','dzien_obiad','dzien_lezak','dzien_plac',

/* ==================== PALETA I SILNIK SPRITE'ÓW ==================== */
const PAL = {
  '.': null,
  k:'#000000', w:'#fffeff', s:'#bcbcbc', d:'#4f4f4f', a:'#adadad',
  r:'#d82800', R:'#a80020', p:'#fe8170', o:'#fc9838', j:'#ea9e22',
  y:'#f8d878', Y:'#bcbe00', e:'#e4e594',
  b:'#0058f8', B:'#0000bc', c:'#3cbcfc', z:'#64b0ff',
  g:'#00a800', G:'#007800', l:'#b8f818',
  n:'#503000', N:'#ac7c00', m:'#f7d8a5', t:'#fecCc5',
  v:'#7527fe', q:'#fe6ecc'
};
const pamiecSpr = new Map();
function spr(nazwa, wiersze){
  if(pamiecSpr.has(nazwa)) return pamiecSpr.get(nazwa);
  const r = wiersze;
  const sw = r[0].length, sh = r.length;
  const c = document.createElement('canvas');
  c.width = sw; c.height = sh;
  const x = c.getContext('2d');
  for(let j=0;j<sh;j++) for(let i=0;i<sw;i++){
    const kol = PAL[r[j][i]];
    if(kol){ x.fillStyle = kol; x.fillRect(i,j,1,1); }
  }
  pamiecSpr.set(nazwa, c);
  return c;
}
function rysujSpr(nazwa, wiersze, x, y, odbij){
  const c = spr(nazwa, wiersze);
  x = Math.round(x); y = Math.round(y);
  if(odbij){
    ctx.save(); ctx.translate(x + c.width, y); ctx.scale(-1,1);
    ctx.drawImage(c, 0, 0); ctx.restore();
  } else ctx.drawImage(c, x, y);
}
function pr(x,y,w,h,kol){ ctx.fillStyle = kol; ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h)); }
function slonce(x,y,r){                 // pikselowe koło – liczone wiersz po wierszu
  const pr2 = r/2, cx = x + pr2;
  for(let j=0;j<r;j++){
    const dy = j + 0.5 - pr2;
    const pol = Math.sqrt(Math.max(0, pr2*pr2 - dy*dy));
    if(pol < 0.5) continue;
    pr(cx-pol, y+j, pol*2, 1, '#f8d878');
  }
  const wr = pr2*0.55;
  for(let j=0;j<r;j++){
    const dy = j + 0.5 - pr2;
    const pol = Math.sqrt(Math.max(0, wr*wr - dy*dy));
    if(pol < 0.5) continue;
    pr(cx-pol, y+j, pol*2, 1, '#fffeff');
  }
}

function kolo(cx, cy, r, kol){            // pikselowe koło (środek, promień)
  for(let j=-r;j<=r;j++){
    const pol = Math.sqrt(Math.max(0, r*r - j*j));
    if(pol < 0.5) continue;
    pr(cx-pol, cy+j, pol*2, 1, kol);
  }
}

const CHOD = [                     // 4-klatkowy cykl chodu
  {a:  4, b: -4, bob:0, dl:10},
  {a:  1, b: -1, bob:1, dl:9},
  {a: -4, b:  4, bob:0, dl:10},
  {a: -1, b:  1, bob:1, dl:9}

const SKORA = '#fecCc5', SKORA_C = '#e09a8a';
/* plamy brudu na ubranku – dochodzą po kolei, w miarę jak mija dzień */
const PLAMY_BRUDU = [[5,4,4],[12,8,3],[7,11,5],[15,3,3],[2,9,3],[10,1,4],[6,16,4],[14,13,3]];

function rysujFranka(px, py, kier, faza, wPowietrzu, opada){
  const x = Math.round(px), y = Math.round(py);
  const b = bohater(), u = b.ubior, st = G.stroj;
  ctx.save();
  if(kier < 0){ ctx.translate(2*x + 22, 0); ctx.scale(-1, 1); }
  const kl = ((Math.floor(faza) % 4) + 4) % 4;
  const k = CHOD[kl];
  const bob = wPowietrzu ? 0 : k.bob;
  const gy = y + bob;                       // głowa 24x22
  const ty = gy + 21;                       // tułów 14, nogi 10, but 4  => razem 50

  ctx.globalAlpha = 0.25; pr(x+3, y+49, 16, 2, '#000000'); ctx.globalAlpha = 1;

  const barwaNogi  = st.spodnie ? u.spodnie  : (st.recznik ? SKORA   : u.pizama);
  const barwaNogiC = st.spodnie ? u.spodnieC : (st.recznik ? SKORA_C : u.pizamaPas);
  const barwaStopy  = st.buty ? '#2b2b33' : (st.skarpetki ? '#fffeff' : SKORA);
  const barwaStopyC = st.buty ? '#000000' : (st.skarpetki ? '#bcbcbc' : SKORA_C);
  function noga(dx, dl, tyl){
    const kol = tyl ? barwaNogiC : barwaNogi;
    if(st.spodnie){
      pr(x+7+dx, ty+14, 5, 4, kol);
      pr(x+8+dx, ty+18, 3, dl-4, tyl ? SKORA_C : SKORA);
    } else {
      pr(x+7+dx, ty+14, 5, dl, kol);
    }
    pr(x+6+dx, ty+14+dl, 7, 4, tyl ? barwaStopyC : barwaStopy);
  }
  if(wPowietrzu){ noga(-5, 6, true); noga(4, 6, false); }
  else { noga(k.b, k.dl, true); noga(k.a, k.dl, false); }

  const rekaw = st.kurtka ? u.kurtkaJasna
              : (st.koszulka ? u.rekawGora : (st.recznik ? SKORA : u.pizama));
  const hus = wPowietrzu ? 0 : -k.a;
  const dy = wPowietrzu ? -7 : Math.round(hus/2);
  pr(x+1,  ty+2+dy, 3, 8, rekaw);   pr(x+1,  ty+10+dy, 3, 3, SKORA);
  pr(x+18, ty+2-dy, 3, 8, rekaw);   pr(x+18, ty+10-dy, 3, 3, SKORA);

  if(st.kurtka){
    pr(x+4, ty, 14, 14, u.kurtka);
    pr(x+4, ty, 14, 1, u.kurtkaJasna);
    pr(x+10, ty, 2, 14, u.kurtkaZamek);
  } else if(st.koszulka){
    pr(x+4, ty, 14, 14, u.gora);
    pr(x+4, ty, 14, 1, u.goraJasna);
    for(const [ox,oy] of [[2,3],[8,2],[5,8],[10,9]]) pr(x+4+ox, ty+oy, 3, 3, u.wzor);
  } else if(st.recznik){
    pr(x+4, ty, 14, 14, '#fffeff');                 // ręcznik owinięty po kąpieli
    pr(x+4, ty+3, 14, 2, '#fe6ecc');
    pr(x+4, ty+9, 14, 2, '#3cbcfc');
    pr(x+9, ty, 4, 14, '#e4e594');
    pr(x+4, ty+14, 14, 3, '#fffeff');
  } else {
    pr(x+4, ty, 14, 14, u.pizama);
    for(let j=1;j<14;j+=3) pr(x+4, ty+j, 14, 1, u.pizamaPas);
  }

  const gl = obraz(b.glowa);
  const gw = b.glowaW, gh = b.glowaH, gdy = b.glowaDy;
  if(gl) ctx.drawImage(gl, x + 11 - Math.round(gw/2), gy + gdy, gw, gh);
  else { pr(x, gy, 22, 22, SKORA); pr(x, gy, 22, 6, '#e4e594'); }
  // po dniu w przedszkolu Franek jest coraz bardziej brudny
  if(G.brud > 0){
    const ile = Math.round(G.brud * PLAMY_BRUDU.length);
    for(let i=0;i<ile;i++){
      const [ox,oy,ow] = PLAMY_BRUDU[i];
      pr(x+3+ox, ty+oy, ow, 2, i%2 ? '#883800' : '#503000');
    }
    if(G.brud > 0.35) pr(x+4, gy+gdy+13, 4, 2, '#883800');   // smuga na policzku
    if(G.brud > 0.7)  pr(x+14, gy+gdy+9, 3, 2, '#883800');
  }
  if(st.czapka){
    const cy = gy + gdy;
    pr(x, cy-2, 22, 6, u.czapka);
    pr(x+14, cy-2, 8, 6, u.czapkaDodatek);
    pr(x-2, cy+3, 20, 3, u.czapka);
    pr(x+4, cy+1, 4, 3, '#fffeff');
  }
  ctx.restore();
}

/* Wszyscy dorośli mają to samo ciało – różni ich głowa ze zdjęcia, ubranie
   i (u mam) długie włosy wystające spod głowy. */
function rysujRodzica(px, py, kier, faza, r){
  const x = Math.round(px), y = Math.round(py);
  const u = r.ubior;
  ctx.save();
  if(kier < 0){ ctx.translate(2*x + 24, 0); ctx.scale(-1, 1); }
  const kl = ((Math.floor(faza) % 4) + 4) % 4;
  const k = CHOD[kl];
  const gy = y + k.bob, ty = gy + 23;      // głowa 24, tułów 18, nogi 13, but 4 => 58

  ctx.globalAlpha = 0.25; pr(x+4, y+57, 18, 2, '#000000'); ctx.globalAlpha = 1;

  pr(x+9+k.b, ty+18, 6, 13, u.nogiC); pr(x+8+k.b, ty+31, 8, 4, u.butC);
  pr(x+9+k.a, ty+18, 6, 13, u.nogi);  pr(x+8+k.a, ty+31, 8, 4, u.but);

  const hus = -k.a;
  pr(x+1,  ty+4+Math.round(hus/2), 3, 12, u.gora); pr(x+1,  ty+16+Math.round(hus/2), 3, 3, SKORA);
  pr(x+20, ty+4-Math.round(hus/2), 3, 12, u.gora); pr(x+20, ty+16-Math.round(hus/2), 3, 3, SKORA);

  pr(x+4, ty, 16, 18, u.gora);
  pr(x+4, ty, 16, 1, u.goraJasna);
  pr(x+4, ty+16, 16, 2, u.goraCien);

  if(r.wlosy){ pr(x+1, gy+16, 4, 14, r.wlosy); pr(x+19, gy+16, 4, 14, r.wlosy); }
  const gl = obraz(r.glowa);
  if(gl) ctx.drawImage(gl, x+2, gy, 20, 24);
  else { pr(x+2, gy, 20, 24, SKORA); pr(x+2, gy+14, 20, 10, r.wlosy || '#4f4f4f'); }
  ctx.restore();
}

function glowaDziecka(x, gy, p, macha){
  pr(x-9, gy+4, 18, 16, SKORA);
  pr(x-10, gy, 20, 7, p.wlosy);
  pr(x-10, gy, 20, 2, p.wlosyJ);
  pr(x-10, gy+6, 3, 9, p.wlosy); pr(x+7, gy+6, 3, 9, p.wlosy);
  if(p.kucyk){ pr(x-14, gy+7, 4, 9, p.wlosy); pr(x+10, gy+7, 4, 9, p.wlosy); }
  pr(x-6, gy+10, 2, 3, '#000000'); pr(x+4, gy+10, 2, 3, '#000000');
  pr(x-3, gy+16, 6, 2, '#a80020');
  if(macha) pr(x-2, gy+15, 2, 2, '#fffeff');

function rysujDzieckoSiedzi(px, py, p, macha, t){
  const x = Math.round(px), y = Math.round(py);
  ctx.globalAlpha = 0.25; pr(x-10, y+1, 21, 2, '#000000'); ctx.globalAlpha = 1;
  pr(x-11, y-7, 22, 7, p.spodnie); pr(x-11, y-7, 22, 1, p.spodnieC);   // skrzyżowane nogi
  obrys(x-11, y-7, 22, 7);
  pr(x-7, y-21, 14, 14, p.gora);  pr(x-7, y-21, 14, 1, p.goraJasna);   // tułów
  obrys(x-7, y-21, 14, 14);
  pr(x-10, y-19, 3, 8, p.gora);   pr(x-10, y-11, 3, 3, SKORA);
  if(macha){
    const o = Math.floor(Math.sin(t*0.3)*3);
    pr(x+7, y-30+o, 3, 11, p.gora); pr(x+6, y-35+o, 5, 5, SKORA);
  } else {
    pr(x+7, y-19, 3, 8, p.gora);  pr(x+7, y-11, 3, 3, SKORA);
  }
  glowaDziecka(x, y-40, p, macha);
}
function rysujDziecko(px, py, kier, faza, p){
  const x = Math.round(px), y = Math.round(py);
  ctx.save();
  if(kier < 0){ ctx.translate(2*x + 22, 0); ctx.scale(-1, 1); }
  const k = CHOD[((Math.floor(faza) % 4) + 4) % 4];
  const gy = y + k.bob, ty = gy + 21;
  ctx.globalAlpha = 0.25; pr(x+3, y+49, 16, 2, '#000000'); ctx.globalAlpha = 1;
  pr(x+7+k.b, ty+14, 5, k.dl, p.spodnieC); pr(x+6+k.b, ty+14+k.dl, 7, 4, '#2b2b33');
  pr(x+7+k.a, ty+14, 5, k.dl, p.spodnie);  pr(x+6+k.a, ty+14+k.dl, 7, 4, '#4f4f4f');
  const dy = Math.round(-k.a/2);
  pr(x+1,  ty+2+dy, 3, 8, p.gora); pr(x+1,  ty+10+dy, 3, 3, SKORA);
  pr(x+18, ty+2-dy, 3, 8, p.gora); pr(x+18, ty+10-dy, 3, 3, SKORA);
  pr(x+4, ty, 14, 14, p.gora); pr(x+4, ty, 14, 1, p.goraJasna);
  glowaDziecka(x+11, gy, p, false);
  ctx.restore();
}

/* ==================== MEBLE / PLATFORMY ==================== */
function blok(x,y,w,h,gora,srodek,dol){
  pr(x,y,w,h,srodek);
  pr(x,y,w,1,gora);
  pr(x,y+h-1,w,1,dol);
  pr(x,y,1,h,gora); pr(x+w-1,y,1,h,dol);
}
function obrys(x,y,w,h){ ctx.strokeStyle='#000000'; ctx.lineWidth=1;
  ctx.strokeRect(Math.round(x)+0.5, Math.round(y)+0.5, Math.round(w)-1, Math.round(h)-1); }

function rysujPlatforme(p){
  const x = Math.round(p.x), y = Math.round(p.y), w = Math.round(p.w), h = Math.round(p.h);
  switch(p.styl){
    case 'podloga':
      pr(x,y,w,h,'#ac7c00'); pr(x,y,w,2,'#e45c10');
      for(let i=0;i<w;i+=16){ pr(x+i,y,1,h,'#503000'); pr(x+i+8,y+3,1,h-3,'#8a5a20'); }
      for(let j=y+8;j<y+h;j+=8) pr(x,j,w,1,'#8a5a20');
      break;
    case 'kafle':
      pr(x,y,w,h,'#c0dfff'); pr(x,y,w,2,'#fffeff');
      for(let i=0;i<w;i+=12) pr(x+i,y+2,1,h-2,'#9290ff');
      for(let j=y+12;j<y+h;j+=12) pr(x,j,w,1,'#9290ff');
      break;
    case 'ziemia':
      pr(x,y,w,h,'#883800'); pr(x,y,w,4,'#00a800'); pr(x,y+4,w,1,'#007800');
      for(let i=0;i<w;i+=8) pr(x+i+3,y+7,2,2,'#503000');
      for(let i=0;i<w;i+=6) pr(x+i,y-2,2,2,'#58d854');
      break;
    case 'lozko':
      blok(x,y,w,h,'#fe6ecc','#b71e7b','#6e0040'); obrys(x,y,w,h);
      pr(x+2,y+2,w-4,5,'#fec4ea');                    // kołdra
      pr(x+3,y-6,14,8,'#fffeff'); obrys(x+3,y-6,14,8); // poduszka
      pr(x-3,y-14,4,h+14,'#ac7c00'); obrys(x-3,y-14,4,h+14);
      pr(x+w-1,y-8,4,h+8,'#ac7c00'); obrys(x+w-1,y-8,4,h+8);
      break;
    case 'pufa':
      blok(x,y,w,h,'#45e082','#00a800','#007800'); obrys(x,y,w,h);
      pr(x+2,y+2,w-4,2,'#b8f818');
      break;
    case 'szafka': case 'komoda': case 'szafkaN': case 'stopien': case 'podest':
      blok(x,y,w,h,'#e45c10','#ac7c00','#503000'); obrys(x,y,w,h);
      if(p.styl==='stopien' || p.styl==='podest'){
        pr(x+1,y+1,w-2,1,'#f7d8a5');
        pr(x, y+h, w, 30, '#883800');            // podstopnica pod schodkiem
        pr(x, y+h, 1, 30, '#503000'); pr(x+w-1, y+h, 1, 30, '#503000');
      }
      else {
        for(let j=1;j<3;j++) pr(x+2, y+Math.round(h*j/3), w-4, 1, '#503000');
        for(let j=0;j<3;j++) pr(x+Math.round(w/2)-1, y+Math.round(h*(j+0.5)/3), 2, 2, '#000000');
      }
      break;
    case 'polka':
      pr(x,y,w,h,'#ac7c00'); pr(x,y,w,1,'#e45c10'); obrys(x,y,w,h);
      pr(x+3,y+h,2,5,'#503000'); pr(x+w-5,y+h,2,5,'#503000');
      break;
    case 'szafa':
      blok(x,y,w,h,'#e45c10','#ac7c00','#503000'); obrys(x,y,w,h);
      pr(x+Math.round(w/2)-1,y+2,2,h-4,'#503000');
      obrys(x+3,y+3,Math.round(w/2)-5,h-6); obrys(x+Math.round(w/2)+2,y+3,Math.round(w/2)-5,h-6);
      pr(x+Math.round(w/2)-4,y+Math.round(h/2),2,2,'#000000');
      pr(x+Math.round(w/2)+3,y+Math.round(h/2),2,2,'#000000');
      break;
    case 'krzeslo':
      pr(x+2,y+6,3,h-6,'#ac7c00'); pr(x+w-5,y+6,3,h-6,'#ac7c00');
      blok(x,y,w,6,'#e45c10','#ac7c00','#503000'); obrys(x,y,w,6);
      pr(x,y-22,4,24,'#ac7c00'); obrys(x,y-22,4,24);
      pr(x,y-22,w-4,4,'#e45c10'); obrys(x,y-22,w-4,4);
      break;
    case 'stol':
      pr(x,y,w,h,'#e45c10'); pr(x,y,w,1,'#f7d8a5'); obrys(x,y,w,h);
      pr(x+6,y+h,4,235-y-h,'#ac7c00'); pr(x+w-10,y+h,4,235-y-h,'#ac7c00');
      break;
    case 'blat':
      pr(x,y,w,h,'#bcbcbc'); pr(x,y,w,1,'#fffeff'); obrys(x,y,w,h);
      blok(x+2,y+h,w-4,235-y-h,'#e45c10','#ac7c00','#503000');
      break;
    case 'lodowka':
      blok(x,y,w,h,'#fffeff','#e4e594','#bcbcbc');
      pr(x,y,w,h,'#f2f6fa'); pr(x,y,w,2,'#fffeff'); pr(x,y+h-2,w,2,'#bcbcbc');
      obrys(x,y,w,h);
      pr(x,y+Math.round(h*0.34),w,1,'#000000');
      pr(x+w-5,y+5,2,Math.round(h*0.28),'#4f4f4f');
      pr(x+w-5,y+Math.round(h*0.4),2,Math.round(h*0.4),'#4f4f4f');
      pr(x+4,y+5,8,6,'#f8d878'); obrys(x+4,y+5,8,6);
      break;
    case 'wanna':
      pr(x,y,w,h,'#fffeff'); obrys(x,y,w,h);
      pr(x+3,y+3,w-6,h-8,'#64b0ff');
      for(let i=0;i<w-10;i+=10) pr(x+6+i,y+5,4,2,'#fffeff');
      break;
    case 'umywalka':
      pr(x,y,w,Math.round(h*0.45),'#fffeff'); obrys(x,y,w,Math.round(h*0.45));
      pr(x+3,y+3,w-6,Math.round(h*0.45)-6,'#c0dfff');
      pr(x+Math.round(w/2)-6,y+Math.round(h*0.45),12,Math.round(h*0.55),'#e4e594');
      obrys(x+Math.round(w/2)-6,y+Math.round(h*0.45),12,Math.round(h*0.55));
      pr(x+Math.round(w/2)-3,y-8,2,8,'#bcbcbc'); pr(x+Math.round(w/2)-3,y-10,8,2,'#bcbcbc');
      break;
    case 'lawka':
      pr(x,y,w,4,'#ac7c00'); pr(x,y,w,1,'#e45c10'); obrys(x,y,w,4);
      pr(x,y+7,w,3,'#ac7c00'); obrys(x,y+7,w,3);
      pr(x+2,y,3,h,'#503000'); pr(x+w-5,y,3,h,'#503000');
      break;
    case 'polkaButy':
      pr(x,y,w,3,'#ac7c00'); obrys(x,y,w,3);
      pr(x,y+9,w,3,'#ac7c00'); obrys(x,y+9,w,3);
      pr(x+1,y,3,h,'#503000'); pr(x+w-4,y,3,h,'#503000');
      break;
    case 'akwarium':
      blok(x, y+h-14, w, 14, '#e45c10', '#ac7c00', '#503000'); obrys(x, y+h-14, w, 14);
      pr(x+4, y-26, w-8, h-12, '#000000');
      pr(x+6, y-24, w-12, h-16, '#3cbcfc');
      pr(x+6, y-24, w-12, 3, '#c0dfff');
      for(let i=0;i<w-16;i+=14) pr(x+10+i, y-6, 4, 6, '#00a800');
      for(const [dx,dy] of [[18,-18],[46,-12],[70,-20]]) pr(x+dx, y+dy, 3, 3, '#fffeff');
      break;
    case 'schodki':
      blok(x,y,w,h,'#fffeff','#bcbcbc','#4f4f4f'); obrys(x,y,w,h);
      pr(x+4,y+5,w-8,h-5,'#adadad');
      break;
    case 'skrzynka':
      blok(x,y,w,h,'#e45c10','#ac7c00','#503000'); obrys(x,y,w,h);
      obrys(x+2,y+2,w-4,h-4);
      break;
    case 'sciankaW':
      // ścianka do wspinania: sklejka z kolorowymi chwytami
      pr(x,y,w,h,'#ac7c00'); obrys(x,y,w,h);
      pr(x,y,w,4,'#e45c10'); pr(x+2,y+1,w-4,2,'#f7d8a5');
      for(let j=12;j<h-6;j+=24) for(let i=6;i<w-8;i+=20){
        const kol = ['#d82800','#0058f8','#58d854','#f8d878','#fe6ecc','#7527fe'][((x+i+j)>>2)%6];
        pr(x+i, y+j, 8, 6, kol); obrys(x+i, y+j, 8, 6);
      }
      break;
    case 'murek':
      pr(x,y,w,h,'#bcbcbc'); pr(x,y,w,2,'#fffeff'); obrys(x,y,w,h);
      for(let i=0;i<w;i+=14) pr(x+i,y+2,1,h-2,'#4f4f4f');
      break;
    case 'dywan':
      pr(x,y,w,h,'#a80020'); pr(x,y,w,2,'#d82800'); obrys(x,y,w,h);
      for(let i=4;i<w-4;i+=12) pr(x+i,y+3,6,h-6,'#f8d878');
      break;
    default:
      blok(x,y,w,h,'#e45c10','#ac7c00','#503000'); obrys(x,y,w,h);
  }
}

function glosB(klucz){
  if(!klucz) return null;

  const pewny = klucze.find(k => k && gotowe[k] === true);

}

function glif(zn){

  const duza = zn.toUpperCase();
  if(CZC[duza]) return {rzedy: CZC[duza], gora:null, dol:null};
  const z = ZDOBIONE[duza];
  if(z) return {rzedy: CZC[z[0]], gora:z[1], dol:z[2]};
  return {rzedy: CZC['?'], gora:null, dol:null};
}
const pamiecTekstu = new Map();
function tekstNaKanwie(t, kol){
  const klucz = t + '␀' + kol;
  if(pamiecTekstu.has(klucz)) return pamiecTekstu.get(klucz);
  const znaki = [...t];
  const c = document.createElement('canvas');
  c.width = Math.max(1, znaki.length * 6); c.height = 9;
  const x = c.getContext('2d');
  x.fillStyle = kol;
  znaki.forEach((zn, i) => {
    const g = glif(zn), ox = i*6;
    if(g.gora) for(let k=0;k<5;k++) if(g.gora[k]==='#') x.fillRect(ox+k, 0, 1, 1);
    for(let j=0;j<7;j++) for(let k=0;k<5;k++)
      if(g.rzedy[j][k]==='#') x.fillRect(ox+k, 1+j, 1, 1);
    if(g.dol) for(let k=0;k<5;k++) if(g.dol[k]==='#') x.fillRect(ox+k, 8, 1, 1);
  });
  if(pamiecTekstu.size > 400) pamiecTekstu.clear();
  pamiecTekstu.set(klucz, c);
  return c;
}
function szerTekstu(t, skala){ return [...t].length * 6 * (skala||1); }

  const c = tekstNaKanwie(t, kol);
  const w = c.width*skala, h = c.height*skala;
  let px = Math.round(x), py = Math.round(y - h/2);
  if(wyr === 'center') px = Math.round(x - w/2);
  ctx.imageSmoothingEnabled = false;
  if(cien) ctx.drawImage(tekstNaKanwie(t, cien), px+skala, py+skala, w, h);
  ctx.drawImage(c, px, py, w, h);
}

const GRAW = 0.31, SKOK = 6.9, PREDKOSC = 1.95;
function zachodzi(a,b){ return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y; }

function aktualizujGre(){
  const p = POZ()[G.poziom], g = G.gracz;
  if(G.overlay){ G.overlay.t--; if(G.overlay.t<=0) G.overlay=null; }
  const blok = !!G.overlay;
  const lewo = !blok && klaw.ArrowLeft, prawo = !blok && klaw.ArrowRight;

  if(lewo && !prawo){ g.vx = -PREDKOSC; g.kier = -1; }
  else if(prawo && !lewo){ g.vx = PREDKOSC; g.kier = 1; }
  else g.vx = 0;

  if(!blok && nowy('ArrowUp')) g.bufor = 10;
  if(g.bufor>0) g.bufor--;
  if(g.coyote>0) g.coyote--;
  if(g.bufor>0 && g.coyote>0){ g.vy = -SKOK; g.bufor=0; g.coyote=0; sfx('sfx_skok'); }

  g.vy += GRAW;
  if(g.vy > 8.5) g.vy = 8.5;

  g.x += g.vx;
  for(const pl of p.platformy) if(!pl.przenikalna && zachodzi(g,pl)){
    if(g.vx>0) g.x = pl.x - g.w; else if(g.vx<0) g.x = pl.x + pl.w;
  }
  if(g.x < 0) g.x = 0;
  if(g.x + g.w > p.szer) g.x = p.szer - g.w;

  g.ziemia = false;
  const staryDol = g.y + g.h;
  g.y += g.vy;
  for(const pl of p.platformy){
    if(!zachodzi(g,pl)) continue;
    if(pl.przenikalna){
      if(g.vy > 0 && staryDol <= pl.y + 1){ g.y = pl.y - g.h; g.vy = 0; g.ziemia = true; }
    } else if(g.vy>0){ g.y = pl.y - g.h; g.vy=0; g.ziemia=true; }
    else if(g.vy<0){ g.y = pl.y + pl.h; g.vy=0; }
  }
  if(g.ziemia){ g.coyote = 8; g.bezpiecz = {x:g.x, y:g.y-2}; }
  if(g.y > H + 100){ g.x = g.bezpiecz.x; g.y = g.bezpiecz.y - 20; g.vy = 0; }
  if(Math.abs(g.vx)>0.1 && g.ziemia) g.chodT += 0.16;

  const cel = Math.max(0, Math.min(p.szer - W, g.x + g.w/2 - W/2));
  G.kamera += (cel - G.kamera) * 0.12;

  if(p.tata){
    const t = G.tata;
    const nast = p.zadania[G.zrobione];
    const czekaNaPrzytulas = nast && nast.typ === 'przytulas' && !nast.wziete;
    // przy przytulasie tata staje w jednym miejscu i czeka z otwartymi rękami
    const celX = czekaNaPrzytulas ? nast.x - 12 : g.x - 38;
    const celY = czekaNaPrzytulas ? 177        : g.y + g.h - 58;
    t.x += (celX - t.x) * (czekaNaPrzytulas ? 0.06 : 0.045);
    t.y += (celY - t.y) * 0.12;
  }

  if(!blok){
    for(let i=0;i<p.zadania.length;i++){
      const z = p.zadania[i];
      if(z.wziete) continue;
      const box = {x:z.x-13, y:z.y-14, w:26, h:28};
      if(!zachodzi(g,box)) continue;
      if(i !== G.zrobione){
        if(G.infoT<=0){ sfx('sfx_zle'); pokazInfo('Najpierw ' + tekstZadania(p, G.zrobione).toLowerCase()); mow('zle'); }
        continue;
      }
      if(z.typ === 'zeby'){ startMycia(); return; }
      z.wziete = true; G.zrobione++;
      G.ekwipunek.push(z.typ);
      const slot = z.stroj || z.typ;                 // legginsy -> spodnie, bluza -> koszulka
      if(z.zdejmij) G.stroj[z.zdejmij] = false;      // w szatni rzeczy się zdejmuje
      else if(slot in G.stroj) G.stroj[slot] = true;
      sfx('sfx_zbierz');
      iskry(z.x, z.y, ['#f8d878','#fffeff','#58d854','#3cbcfc']);
      const brawo = 'brawo' + (1 + ((Math.random()*4)|0));
      if(z.typ === 'pizama') przebierzWPizame();
      if(z.typ === 'sniadanie'){ G.overlay = {typ:'jedzenie', t:150}; mow('jedzenie'); }
      else if(z.typ === 'kolacja'){ G.overlay = {typ:'kolacja', t:170}; mow('kolacja_mniam'); }
      else if(z.typ === 'igor'){
        G.overlay = {typ:'czesc', t:170};
        sfx('sfx_sukces'); mow('czesc_igor');
      }
      else if(z.typ === 'przytulas'){

const RZECZY_NA_SCIANIE = [
  {x:232, w:30, h:26, y:120, co:'obrazek'},

const REKA_OD = 214, REKA_DO = 428, REKA_Y = 134;

  G.swiatlo = { reka:0.06, zapalone:false, koniecT:0, pudlo:0, klik:0 };

function rekaX(sw){ return REKA_OD + sw.reka * (REKA_DO - REKA_OD); }
function celPodRekao(sw){
  const x = rekaX(sw);
  return RZECZY_NA_SCIANIE.find(r => x > r.x - 12 && x < r.x + r.w + 12) || null;

function aktualizujSwiatlo(){
  const sw = G.swiatlo;
  if(sw.koniecT > 0){
    sw.koniecT--;
    if(sw.koniecT === 0) dalejPoPoziomie();
    aktualizujEfekty(); czyscNowe(); return;
  }
  if(sw.pudlo > 0) sw.pudlo--;
  if(sw.klik > 0) sw.klik--;

  let ruch = 0;
  if(klaw.ArrowLeft)  ruch -= 1;
  if(klaw.ArrowRight) ruch += 1;
  sw.reka = Math.max(0, Math.min(1, sw.reka + ruch*0.011));

  if(nowy('ArrowUp')){
    const cel = celPodRekao(sw);
    sw.klik = 12;
    if(cel && cel.co === 'kontakt'){
      sw.zapalone = true; sw.koniecT = 190;
      sfx('sfx_sukces'); cisza(); mow(glosB('swiatlo_ok'));

/* ==================== MINIGRA: WSTAWANIE ====================
   Wstać wcale nie jest łatwo. Naprzemienne ◀ ▶ wygrzebują Franka z łóżka,
   a sen ciągnie go z powrotem – co chwilę przychodzi „atak snu", w którym
   pasek spada dużo szybciej. */
function startWstawania(){
  G.wstawanie = { moc:0, ostatni:0, koniecT:0, atak:0, doAtaku:240, tupanie:0, powiedziano:0, czas:0 };
  G.czastki = []; G.ekran = 'wstawanie';
  graj('muz_gra');
  mow(najlepszyGlos('wstawanie_jak'));
}
function aktualizujWstawanie(){
  const w = G.wstawanie;
  if(w.koniecT > 0){
    w.koniecT--;
    if(w.koniecT === 0) dalejPoPoziomie();
    aktualizujEfekty(); czyscNowe(); return;
  }
  // Po 20 sekundach sen zaczyna odpuszczać – nawet powolne stukanie w końcu
  // wystarczy, bo w tej grze nie da się przegrać.
  w.czas++;
  const ulga = Math.min(1, Math.max(0, (w.czas - 1200)/1800));
  const kop = 0.075 + 0.05*ulga;

  // naprzemienne stukanie podnosi Franka
  let stuk = false;
  if(nowy('ArrowLeft')  && w.ostatni !== -1){ w.moc += kop; w.ostatni = -1; stuk = true; }
  if(nowy('ArrowRight') && w.ostatni !==  1){ w.moc += kop; w.ostatni =  1; stuk = true; }
  if(klaw.ArrowLeft || klaw.ArrowRight) w.moc += 0.0012;   // samo trzymanie nie wystarczy
  if(stuk){ w.tupanie = 8; sfx('sfx_skok'); }
  if(w.tupanie > 0) w.tupanie--;

  // sen ciągnie w dół, a w ataku snu ciągnie mocno
  if(w.atak > 0){
    w.atak--;
    w.moc -= 0.007 - 0.005*ulga;
    if(G.t % 8 === 0) G.czastki.push({x:150+Math.random()*40, y:150, vx:0.3, vy:-0.5,
                                      zyc:40, kol:'#c0dfff', r:2});
  } else {
    w.moc -= 0.0025 - 0.0018*ulga;
    if(--w.doAtaku <= 0 && w.moc < 0.94 && ulga < 0.9){
      w.atak = 80; w.doAtaku = 260 + ((Math.random()*120)|0);
      sfx('sfx_zle');
      if(w.powiedziano++ < 2) dopowiedz(najlepszyGlos('wstawanie_spij'));
    }
  }
  w.moc = Math.max(0, Math.min(1, w.moc));

  if(w.moc >= 1 && w.koniecT === 0){
    w.koniecT = 190; w.atak = 0;
    sfx('sfx_sukces'); cisza(); mow(glosB('wstawanie_ok'));
    iskry(300, 150, ['#f8d878','#fffeff','#58d854'], 30);
  }
  aktualizujEfekty(); czyscNowe();
}

/* ==================== MINIGRA: SIKU DO KIBELKA ====================
   Steruje się strumieniem: ◀ bliżej, ▶ dalej. Trzeba trafiać do wody
   w środku muszli i nie obsikać deski ani podłogi. Im pęcherz pustszy,
   tym mniejsze ciśnienie – strumień sam się skraca, więc trzeba dodawać ▶. */
const SIKU_SEK = 13;                       // ile sekund leci siku
const SIKU_OD = 258;                       // skąd startuje strumień
const MUSZLA = {x:294, w:86, rim:166, wodaOd:318, wodaDo:356};
function startSiku(){
  G.siku = { kat:0.42, pecherz:1, trafione:0, klatki:0, deska:0, kaluza:0,
             koniecT:0, ups:0, mowilOUps:0, splok:0 };
  G.czastki = []; G.ekran = 'siku';
  graj('muz_gra');
  mow(najlepszyGlos('siku_jak'));
}
function zasiegSiku(s){
  const cisnienie = 0.7 + 0.3*s.pecherz;
  return (30 + s.kat*132) * cisnienie + Math.sin(G.t*0.06)*3;
}
function strefaSiku(lx){
  if(lx < MUSZLA.x + 2) return 'podloga';
  if(lx < MUSZLA.wodaOd) return 'deska';
  if(lx <= MUSZLA.wodaDo) return 'woda';
  if(lx <= MUSZLA.x + MUSZLA.w) return 'deska';
  return 'sciana';
}
function aktualizujSiku(){
  const s = G.siku;
  if(s.koniecT > 0){
    s.koniecT--; s.splok++;
    if(s.koniecT === 0) dalejPoPoziomie();
    aktualizujEfekty(); czyscNowe(); return;
  }
  if(s.ups > 0) s.ups--;
  if(s.mowilOUps > 0) s.mowilOUps--;

  let ruch = 0;
  if(klaw.ArrowLeft)  ruch -= 1;
  if(klaw.ArrowRight) ruch += 1;
  s.kat = Math.max(0, Math.min(1, s.kat + ruch*0.013));

  const lx = SIKU_OD + zasiegSiku(s);
  const gdzie = strefaSiku(lx);
  s.klatki++;
  if(gdzie === 'woda'){
    s.trafione++;
    if(G.t % 4 === 0) G.czastki.push({x:lx+(Math.random()-0.5)*8, y:184, vx:(Math.random()-0.5)*1.2,
                                      vy:-0.9-Math.random(), zyc:20, kol:'#3cbcfc', r:1+Math.random()*2});
    if(G.t % 9 === 0) ton(300 + Math.random()*200, 0.05, 'triangle', 0.015);
  } else {
    if(gdzie === 'podloga'){ s.kaluza = Math.min(1, s.kaluza + 0.014); }
    else { s.deska = Math.min(1, s.deska + 0.014); }
    if(s.ups <= 0){
      s.ups = 70; sfx('sfx_zle');
      if(s.mowilOUps <= 0){ s.mowilOUps = 240; dopowiedz(najlepszyGlos('siku_deska')); }
    }
    if(G.t % 3 === 0) G.czastki.push({x:lx+(Math.random()-0.5)*6, y:MUSZLA.rim-2,
                                      vx:(Math.random()-0.5)*1.4, vy:-0.6-Math.random(),
                                      zyc:24, kol:'#f8d878', r:1+Math.random()*2});
  }

  s.pecherz -= 1/(60*SIKU_SEK);
  if(s.pecherz <= 0 && s.koniecT === 0){
    s.pecherz = 0; s.koniecT = 230; s.splok = 0;
    sfx('sfx_drzwi'); cisza();
    const czysto = s.deska < 0.05 && s.kaluza < 0.05;
    mow(najlepszyGlos(czysto ? 'siku_ok' : 'siku_koniec'));
  }
  aktualizujEfekty(); czyscNowe();
}

/* ==================== MINIGRA: MYCIE ZĘBÓW ====================
   Cztery strefy jak przy prawdziwym myciu: górne i dolne, z przodu i od środka.
   Ząbki mają widoczny brud, który schodzi dopiero od szorowania tam i z powrotem
   – samo trzymanie strzałki prawie nic nie daje. */
const ZEBOW = 8;
const STREFY = [
  {id:'gora_przod', nazwa:'GÓRNE Z PRZODU',  glos:'zeby_gora_przod',  gora:true,  tyl:false},
  {id:'dol_przod',  nazwa:'DOLNE Z PRZODU',  glos:'zeby_dol_przod',   gora:false, tyl:false},
  {id:'gora_tyl',   nazwa:'GÓRNE OD ŚRODKA', glos:'zeby_gora_tyl',    gora:true,  tyl:true},
  {id:'dol_tyl',    nazwa:'DOLNE OD ŚRODKA', glos:'zeby_dol_tyl',     gora:false, tyl:true}
];
function startMycia(){
  const brud = STREFY.map(() => {
    const rzad = [];
    for(let i=0;i<ZEBOW;i++) rzad.push({ile:1, plamy:[]});
    return rzad;
  });
  // plamki brudu – rysowane zawsze tak samo, znikają wraz z myciem
  brud.forEach((rzad, s) => rzad.forEach((z,i) => {
    const ile = 3 + ((i*7) % 3);
    for(let p=0;p<ile;p++)
      z.plamy.push({x: 3 + ((i*13 + p*29) % 22), y: 3 + ((i*17 + p*11) % 15), r: 3 + (p % 3)});
    // na kilku ząbkach siedzi coś większego: listek, okruszek albo bakteria
    const paskudy = [null,'liscie',null,'bakteria',null,null,'okruch',null];
    z.paskuda = paskudy[(i + s) % 8];
  }));
  G.mycie = {
    strefa:0, poz:0.5, ostatnia:0.5, kier:0, bonus:0,
    brud, pociagniecia:0,
    czas:CZAS_MYCIA_ZEBOW*60, max:CZAS_MYCIA_ZEBOW*60,
    koniecT:0, dzwiekT:0, powiedziano:{}, ostatniaLiczba:0, blyskStrefy:0
  };
  G.ekran = 'mycie';
  cisza(); mow('mycie2', STREFY[0].glos);
}
function czystoscStrefy(m, s){
  let suma = 0;
  for(const z of m.brud[s]) suma += 1 - z.ile;
  return suma / ZEBOW;
}
function czystoscCalosci(m){
  let suma = 0;
  for(let s=0;s<STREFY.length;s++) suma += czystoscStrefy(m, s);
  return suma / STREFY.length;
}
function zmienStrefe(m, nowa){
  if(nowa < 0 || nowa >= STREFY.length || nowa === m.strefa) return;
  m.strefa = nowa;
  m.blyskStrefy = 30;
  dopowiedz(STREFY[nowa].glos);
}
function aktualizujMycie(){
  const m = G.mycie;
  if(m.koniecT > 0){
    m.koniecT--;
    if(m.koniecT === 0){
      const p = POZ()[G.poziom];
      const zad = p.zadania[G.zrobione];
      if(zad) zad.wziete = true;
      G.zrobione++; G.ostatnieZadanie = -1;
      G.ekran = 'gra'; graj('muz_gra'); ogloszZadanie(false);
    }
    aktualizujEfekty(); return;
  }
  if(m.blyskStrefy > 0) m.blyskStrefy--;

  // strzałki góra/dół przełączają strefę ręcznie
  if(nowy('ArrowUp'))   zmienStrefe(m, m.strefa - 1);
  if(nowy('ArrowDown')) zmienStrefe(m, m.strefa + 1);

  m.ostatnia = m.poz;
  let ruch = 0;
  if(klaw.ArrowLeft) ruch -= 1;
  if(klaw.ArrowRight) ruch += 1;
  m.poz = Math.max(0, Math.min(1, m.poz + ruch*0.028));

  // zmiana kierunku = jedno pociągnięcie szczoteczką; to ono czyści naprawdę
  if(ruch !== 0 && ruch !== m.kier){
    m.kier = ruch;
    m.bonus = 40;
    m.pociagniecia++;
    sfx('sfx_skok');
  }
  if(m.bonus > 0) m.bonus--;

  const przesuniecie = Math.abs(m.poz - m.ostatnia);
  const szoruje = przesuniecie > 0.004 && m.bonus > 0;   // tuż po zmianie kierunku
  // Zegar leci zawsze – szorowanie 3x szybciej. Dzięki temu minigra kończy się
  // nawet wtedy, gdy dziecko dojedzie szczoteczką do krawędzi i przestanie ruszać.
  m.czas -= szoruje ? 3 : 1;
  if(przesuniecie > 0.004){
    const i = Math.min(ZEBOW-1, Math.max(0, Math.floor(m.poz*ZEBOW)));
    const zab = m.brud[m.strefa][i];
    const przed = zab.ile;
    zab.ile = Math.max(0, zab.ile - (szoruje ? 0.036 : 0.004));
    // sąsiednie zęby też trochę
    for(const d of [-1, 1]){
      const j = i + d;
      if(j >= 0 && j < ZEBOW) m.brud[m.strefa][j].ile =
        Math.max(0, m.brud[m.strefa][j].ile - (szoruje ? 0.014 : 0.001));
    }
    if(m.dzwiekT-- <= 0){ ton(280 + Math.random()*260, 0.04, 'sawtooth', 0.02); m.dzwiekT = 5; }
    if(szoruje && Math.random() < 0.6){
      const pkt = punktLuku(STREFY[m.strefa].gora, m.poz);
      G.czastki.push({x:pkt.x + (Math.random()-0.5)*10, y:pkt.y + (Math.random()-0.5)*10,
                      vx:(Math.random()-0.5)*1.4, vy:-0.5-Math.random(),
                      zyc:22+Math.random()*16, kol:'#fffeff', r:1+Math.random()*2});
    }
    if(przed > 0 && zab.ile === 0) sfx('sfx_zbierz');
  }

  // strefa czysta -> sama przechodzi do następnej
  if(czystoscStrefy(m, m.strefa) >= 0.999){
    const nastepna = STREFY.findIndex((_, s) => czystoscStrefy(m, s) < 0.999);
    if(nastepna >= 0 && nastepna !== m.strefa){
      dopowiedz('zeby_strefa_ok');
      zmienStrefe(m, nastepna);
    }
  }

  // zapowiedzi i odliczanie
  const sekRealne = Math.ceil(m.czas / (60 * 2.5));
  const odliczamy = sekRealne <= 5;
  const pokazSek = Math.max(0, Math.ceil(120 * m.czas / m.max));
  for(const [prog, klucz] of [[60,'zeby_minuta'], [30,'zeby_pol'], [20,'zeby_20']]){
    if(pokazSek > prog || m.powiedziano[klucz]) continue;
    m.powiedziano[klucz] = true;
    if(!odliczamy) dopowiedz(klucz);
  }
  if(odliczamy && sekRealne >= 1 && sekRealne !== m.ostatniaLiczba){
    m.ostatniaLiczba = sekRealne;
    dopowiedz('licz' + sekRealne);
  }

  const wszystkoCzyste = czystoscCalosci(m) >= 0.999;
  if((wszystkoCzyste || m.czas <= 0) && m.koniecT === 0){
    m.koniecT = 150; sfx('sfx_sukces'); mow('mycie_koniec');
    iskry(W/2, 140, ['#fffeff','#3cbcfc','#f8d878'], 34);
  }
  aktualizujEfekty(); czyscNowe();
}

/* --- widok jak u dentysty: szeroko otwarte usta, łuk górnych i dolnych ząbków,
   język w środku, a na ząbkach siedzi brud: plamy, listek, okruszek i bakteria.
   Szczoteczka jeździ po łuku – z przodu po zewnętrznej stronie ząbków,
   „od środka" po wewnętrznej. --- */
const LUK = {x:240, y:150, rx:142, ry:56, zabW:32, zabH:26, dol:0.90, rozstaw:12};
const LUK_OD = 1.028, LUK_DO = 1.972;          // 185° .. 355° (w wielokrotnościach PI)
/* Ząbki rozstawiamy po RÓWNEJ DŁUGOŚCI łuku, nie po równym kącie – inaczej
   przy bokach ust nachodziłyby na siebie. Tabelka liczona raz na start. */
const LUK_MAPA = (() => {
  const n = 300, kroki = [];
  const dA = Math.PI*(LUK_DO - LUK_OD)/n;
  let suma = 0;
  for(let i=0;i<=n;i++){
    const a = Math.PI*(LUK_OD + (LUK_DO-LUK_OD)*(i/n));
    if(i > 0){
      const sr = a - dA/2;
      suma += dA * Math.sqrt(LUK.rx*LUK.rx*Math.sin(sr)*Math.sin(sr) +
                             LUK.ry*LUK.ry*Math.cos(sr)*Math.cos(sr));
    }
    kroki.push({a, s:suma});
  }
  return {kroki, dl:suma};
})();
function katLuku(u){
  const cel = Math.max(0, Math.min(1, u)) * LUK_MAPA.dl, k = LUK_MAPA.kroki;
  for(let i=1;i<k.length;i++) if(k[i].s >= cel){
    const t = (cel - k[i-1].s) / ((k[i].s - k[i-1].s) || 1);
    return k[i-1].a + (k[i].a - k[i-1].a)*t;
  }
  return k[k.length-1].a;
}
function punktLuku(gora, u){
  const a = katLuku(u) * (gora ? 1 : -1);      // dolny łuk to odbicie górnego
  const rx = LUK.rx * (gora ? 1 : LUK.dol), ry = LUK.ry * (gora ? 1 : LUK.dol);
  const y0 = LUK.y + (gora ? -LUK.rozstaw : LUK.rozstaw);   // szczęki rozjechane
  return {
    x: LUK.x + rx*Math.cos(a),
    y: y0 + ry*Math.sin(a),
    // kąt normalnej (na zewnątrz łuku) – po nim obracamy ząbek i szczoteczkę
    nk: Math.atan2(Math.sin(a)/ry, Math.cos(a)/rx)
  };
}
const LISCIE = [
  "..gg....",".gGGgg..","gGllGGg.","gGlllGg.","gGllGGg.",".gGGgg..","..gg....","........"];
const OKRUCH = [
  "..kk....",".kjjk...","kjooojk.","kjoooojk","kjooojk.",".kjjjk..","..kk....","........"];
const BAKTERIA = [
  "..kkkk..",".kgggGk.","kgwgwggk","kgkgkggk","kggggggk","kgGggGgk",".kkkkkk.","..k..k.."];
function rysujZabLuk(zab, gora, u, aktywny, przygaszony){
  const p = punktLuku(gora, u);
  const w = LUK.zabW, h = LUK.zabH;
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(p.nk + Math.PI/2);                 // lokalne +y = do środka ust
  // dziąsło nad korzeniem
  pr(-w/2, -11, w, 12, przygaszony ? '#8a1236' : '#d8386a');
  pr(-w/2, -11, w, 3,  przygaszony ? '#a01a44' : '#fe6ecc');
  // ząbek – z zaokrąglonym „kopytkiem" od strony wnętrza ust
  pr(-w/2+1, -1, w-2, h, '#000000');
  pr(-w/2+2, 0, w-4, h-2, aktywny ? '#fffeff' : '#e4e4ee');
  pr(-w/2+2, 0, w-4, 3, '#fffeff');
  pr(-w/2+1, h-4, 3, 3, '#6e0040'); pr(w/2-4, h-4, 3, 3, '#6e0040');
  pr(-w/2+2, h-2, 2, 2, '#000000'); pr(w/2-4, h-2, 2, 2, '#000000');
  if(zab.ile > 0){
    ctx.globalAlpha = 0.45 * zab.ile;                 // żółty nalot – schodzi z myciem
    pr(-w/2+2, 0, w-4, h-2, '#e4e594');
    ctx.globalAlpha = 1;
    for(const pl of zab.plamy){
      const r = Math.max(0, Math.round(pl.r * zab.ile));
      if(r < 1) continue;
      const px = -w/2 + 3 + Math.min(w-6-r, pl.x);
      const py = Math.min(h-3-r, pl.y);
      pr(px, py, r, r, zab.ile > 0.55 ? '#ac7c00' : '#e4e594');
    }
    if(zab.paskuda && zab.ile > 0.45){
      const sp = zab.paskuda === 'liscie' ? LISCIE : (zab.paskuda === 'okruch' ? OKRUCH : BAKTERIA);
      const drg = zab.paskuda === 'bakteria' ? (Math.floor(G.t/8)%2) : 0;
      ctx.save(); ctx.scale(1.7, 1.7);
      rysujSpr('pask_'+zab.paskuda+drg, sp, -4, (h/2-8+drg)/1.7, false);
      ctx.restore();
    }
  } else {
    pr(w/2-7, 3, 2, 2, '#fffeff');            // błysk na czystym ząbku
    pr(w/2-9, 6, 2, 2, '#c0dfff');
  }
  if(przygaszony){ ctx.globalAlpha = 0.5; pr(-w/2, -12, w, h+13, '#6e0040'); ctx.globalAlpha = 1; }
  ctx.restore();
}
function elipsa(cx, cy, rx, ry, kol){
  for(let j=-ry;j<=ry;j++){
    const pol = rx*Math.sqrt(Math.max(0, 1 - (j*j)/(ry*ry)));
    if(pol < 0.5) continue;
    pr(cx-pol, cy+j, pol*2, 1, kol);
  }
}

  // cztery kwadraciki – po jednym na strefę
  for(let s=0;s<STREFY.length;s++){

  napis(Math.floor(sek/60)+':'+String(sek%60).padStart(2,'0'), W-33, 12, '#3cbcfc', '#000000', 1.6);

  pr(90,250,Math.round(300*czyste),14,'#58d854');
  napis('CZYSTE ZĄBKI '+Math.round(czyste*100)+'%', W/2, 257, '#fffeff', '#000000', 1);

  // podpowiedź / odliczanie na środku ust
  const odliczanie = m.koniecT === 0 && m.czas > 0 &&

    const wynik = Math.round(czystoscCalosci(m)*100);

    napis('UMYTE W ' + wynik + '%', W/2, 146, '#d82800', '#000000', 1.6);

/* ==================== MINIGRA: WYŚCIG DO FURTKI ====================
   Naciskanie ◀ i ▶ na zmianę rozpędza bohatera. Opiekun biegnie tuż obok,
   ale zawsze przegrywa o włos – dziecko ma wygrać. */
const META_WYSCIGU = 1400;
/* naprzemienne stukanie w strzałki dodaje prędkości (wspólne dla obu wyścigów) */
function rozpedzBieg(w){
  if(nowy('ArrowLeft')  && w.ostatni !== -1){ w.v += 0.55; w.ostatni = -1; sfx('sfx_skok'); }
  if(nowy('ArrowRight') && w.ostatni !==  1){ w.v += 0.55; w.ostatni =  1; sfx('sfx_skok'); }
  if(klaw.ArrowRight || klaw.ArrowLeft) w.v += 0.012;      // samo trzymanie też działa
  w.v = Math.max(0, Math.min(3.4, w.v - 0.028));
  w.x += w.v;
  w.faza += w.v * 0.22;
}
function startWyscigu(){
  G.wyscig = {
    x:0, v:0, opiekun:-30, ostatni:0, odliczanie:180,
    faza:0, koniecT:0, machanie:0
  };
  G.czastki = []; G.ekran = 'wyscig';
  graj('muz_jazda'); mow('wyscig_start', 'wyscig');
}
function aktualizujWyscig(){
  const w = G.wyscig;
  if(w.odliczanie > 0){ w.odliczanie--; aktualizujEfekty(); czyscNowe(); return; }
  if(w.koniecT > 0){
    w.koniecT--;
    if(w.koniecT === 0) dalejPoPoziomie();
    aktualizujEfekty(); czyscNowe(); return;
  }
  rozpedzBieg(w);

  // opiekun goni, ale nie wyprzedza – trzyma się tuż za bohaterem
  const celOp = Math.min(w.x - 12, META_WYSCIGU - 90);
  w.opiekun += (celOp - w.opiekun) * 0.05;

  if(w.x >= META_WYSCIGU && w.koniecT === 0){
    w.koniecT = 190; sfx('sfx_sukces'); mow(glosB('wygrana'));
    for(let i=0;i<60;i++) G.czastki.push({x:Math.random()*W, y:-8-Math.random()*80,
      vx:(Math.random()-0.5)*1, vy:0.6+Math.random()*1.6, zyc:200,
      kol:['#d82800','#f8d878','#58d854','#3cbcfc','#fe6ecc'][(Math.random()*5)|0], r:2+Math.random()*2});
  }
  aktualizujEfekty(); czyscNowe();
}

/* ==================== MINIGRA: WYŚCIG DO OKNA ====================
   Korytarz przedszkola: Franek biegnie do okna, a tata idzie tą samą drogą
   na zewnątrz, za szybą. Trzeba zdążyć, żeby pomachać mu na do widzenia.
   Tata – jak w wyścigu do furtki – zawsze jest odrobinę wolniejszy. */
const META_OKNA = 1100;
function startWyscigDoOkna(){
  G.okno = { x:0, v:0, opiekun:-70, ostatni:0, odliczanie:180,
             faza:0, fazaOp:0, koniecT:0 };
  G.czastki = []; G.ekran = 'wyscig_okno';
  graj('muz_jazda'); mow('wyscig_start', 'zad_okno', 'wyscig');
}
function aktualizujWyscigDoOkna(){
  const w = G.okno;
  if(w.odliczanie > 0){ w.odliczanie--; aktualizujEfekty(); czyscNowe(); return; }
  if(w.koniecT > 0){
    w.koniecT--;
    if(w.koniecT % 24 === 0) serduszka(384, 196, 3);
    if(w.koniecT === 0) dalejPoPoziomie();
    aktualizujEfekty(); czyscNowe(); return;
  }
  rozpedzBieg(w);
  if(w.x > META_OKNA) w.x = META_OKNA;

  const staryOp = w.opiekun;
  w.opiekun += (Math.min(w.x - 6, META_OKNA - 26) - w.opiekun) * 0.055;
  w.fazaOp += (w.opiekun - staryOp) * 0.24;

  if(w.x >= META_OKNA && w.koniecT === 0){
    w.koniecT = 260; sfx('sfx_sukces'); mow(glosB('pomachaj'));
    serduszka(384, 196, 10);
    for(let i=0;i<50;i++) G.czastki.push({x:Math.random()*W, y:-8-Math.random()*70,
      vx:(Math.random()-0.5)*1, vy:0.6+Math.random()*1.5, zyc:220,
      kol:['#d82800','#f8d878','#58d854','#3cbcfc','#fe6ecc'][(Math.random()*5)|0], r:2+Math.random()*2});
  }
  aktualizujEfekty(); czyscNowe();
}

/* ==================== MINIGRA: KÓŁKO POWITALNE ====================
   Franek wchodzi do sali, dzieci siedzą w kręgu na dywanie. ◀ ▶ obchodzą
   kółko, ▲ mówi „cześć". Trzeba przywitać się z każdym. */
const KRAG = { cx:240, cy:166, rx:162, ry:58 };
/* dzieci zajmują pięć miejsc na owalu, szóste (na górze) jest wolne dla Franka */
const KATY_DZIECI = [30, 90, 150, 210, 330].map(st => st*Math.PI/180);
function pozKregu(a){ return { x: KRAG.cx + KRAG.rx*Math.cos(a), y: KRAG.cy + KRAG.ry*Math.sin(a) }; }
function roznicaKatow(a, b){
  let d = (a - b) % (Math.PI*2);
  if(d >  Math.PI) d -= Math.PI*2;
  if(d < -Math.PI) d += Math.PI*2;
  return d;
}
function startKolka(){
  G.kolko = { kat:-Math.PI/2, faza:0, kier:1, przywitane:DZIECI.map(()=>false), ile:0,
              dymek:0, kto:-1, koniecT:0 };
  G.czastki = []; G.ekran = 'kolko';
  graj('muz_gra'); mow(najlepszyGlos('kolko_jak'));
}
function aktualizujKolko(){
  const k = G.kolko;
  if(k.koniecT > 0){
    k.koniecT--;
    if(k.koniecT === 0) dalejPoPoziomie();
    aktualizujEfekty(); czyscNowe(); return;
  }
  if(k.dymek > 0) k.dymek--;
  let ruch = 0;
  if(klaw.ArrowLeft)  ruch -= 1;
  if(klaw.ArrowRight) ruch += 1;
  k.kat += ruch * 0.026;
  k.faza += Math.abs(ruch) * 0.2;
  k.kier = ruch !== 0 ? ruch : (Math.cos(k.kat) > 0 ? -1 : 1);
  // czy Franek stoi już przy kimś, kogo nie przywitał? (wtedy świeci strzałka ^)
  k.blisko = KATY_DZIECI.some((a, i) => !k.przywitane[i] && Math.abs(roznicaKatow(a, k.kat)) < 0.44);

  if(nowy('ArrowUp')){
    let naj = -1, najD = 9;
    KATY_DZIECI.forEach((a, i) => {
      if(k.przywitane[i]) return;
      const d = Math.abs(roznicaKatow(a, k.kat));
      if(d < najD){ najD = d; naj = i; }
    });
    if(naj >= 0 && najD < 0.44){
      k.przywitane[naj] = true; k.ile++; k.dymek = 100; k.kto = naj;
      sfx('sfx_zbierz');
      const pz = pozKregu(KATY_DZIECI[naj]);
      serduszka(pz.x, pz.y - 34, 6);
      if(k.ile < DZIECI.length) dopowiedz('brawo' + (1 + ((Math.random()*4)|0)));
    } else sfx('sfx_zle');
  }
  if(k.ile >= DZIECI.length && k.koniecT === 0){
    k.koniecT = 200; sfx('sfx_sukces'); cisza(); mow(najlepszyGlos('kolko_ok'));
  }
  aktualizujEfekty(); czyscNowe();
}

  let cel = -1;

  doRysowania.sort((a, b) => a.y - b.y);

    napis(tekst, bx, by, '#d82800', null, 1);

    pr(x-7, 3, 14, 14, '#000000');
    pr(x-6, 4, 12, 12, k.przywitane[i] ? '#58d854' : '#4f4f4f');
  }
  if(k.koniecT > 0){
    ramka(W/2-150, 40, 300, 62, '#0000bc');

    k.koniecT--;

    aktualizujEfekty(); czyscNowe(); return;
  }
  if(k.start > 0){ k.start--; aktualizujEfekty(); czyscNowe(); return; }

  const leje = klaw.ArrowUp;
  if(leje){
    k.lalo = true;
    if(k.ile < 100){

      if(G.t % 9 === 0) ton(90 + k.ile, 0.05, 'sawtooth', 0.02);

        dopowiedz(najlepszyGlos(k.autobus ? 'bilet_zle' : 'tank_rozlane')); }

                                        zyc:34, kol:'#f8d878', r:2});

  if(!leje && k.lalo && k.ile >= TANK_ZIELONA && k.koniecT === 0){
    k.koniecT = 220; sfx('sfx_sukces'); cisza();
    mow(najlepszyGlos(k.rozlane > 0 ? (k.autobus ? 'bilet_zle' : 'tank_rozlane')
                                    : (k.autobus ? 'bilet_ok'  : 'tank_ok')));
  }
  if(k.rozlane > 34 && k.koniecT === 0){
    k.koniecT = 220; sfx('sfx_zle'); cisza();
    mow(najlepszyGlos(k.autobus ? 'bilet_zle' : 'tank_rozlane'));

  przebierzWPizame();

    if(d.t > 140 && (nowy('ArrowUp') || d.t > 340)){
      if(G.brud > 0){ d.etap = 'goni'; d.t = 0; graj('muz_jazda'); sfx('sfx_zle'); }
      else { d.etap = 'ok'; d.t = 0; sfx('sfx_sukces'); }

    rozpedzBieg(d);
    d.mv = 2.6 + Math.min(1.7, d.t/240);          // mama w końcu zawsze dogania

const CZESCI_CIALA = [

      plamy.push({ x: 4 + ((i*17 + p*29) % Math.max(1, c.w-12)),
                   y: 3 + ((i*11 + p*13) % Math.max(1, c.h-8)),
                   r: 2 + (p % 3) });
    return { ile:1, plamy };
  });
  G.kapiel = { etap:'mycie', i:0, poz:0.5, ostatnia:0.5, kier:0, bonus:0,
               brud, mokro:1, czas:90*60, koniecT:0, dzwiekT:0, blysk:0 };

function strefaKapieli(k){ return CZESCI_CIALA[k.i]; }
function zmienCzesc(k, nowa){
  if(nowa < 0 || nowa >= CZESCI_CIALA.length || nowa === k.i) return;

/* ▲ ▼ przeskakują tylko na te części, które są jeszcze brudne – dzięki temu
   nie da się utknąć na wyszorowanej już nóżce */
function nastepnaBrudna(k, kierunek){
  for(let d=1; d<=CZESCI_CIALA.length; d++){
    const i = k.i + kierunek*d;
    if(i < 0 || i >= CZESCI_CIALA.length) continue;
    if(k.brud[i].ile > 0) return i;
  }
  return k.i;
}
function aktualizujKapiel(){
  const k = G.kapiel;
  if(k.koniecT > 0){
    k.koniecT--;
    if(k.koniecT === 0){ G.brud = 0; owinWRecznik(); dalejPoPoziomie(); }
    aktualizujEfekty(); czyscNowe(); return;
  }
  if(k.blysk > 0) k.blysk--;
  k.czas--;

  if(k.etap === 'mycie'){
    if(nowy('ArrowUp'))   zmienCzesc(k, nastepnaBrudna(k, -1));
    if(nowy('ArrowDown')) zmienCzesc(k, nastepnaBrudna(k, +1));
  }

  k.ostatnia = k.poz;
  let ruch = 0;
  if(klaw.ArrowLeft) ruch -= 1;
  if(klaw.ArrowRight) ruch += 1;
  k.poz = Math.max(0, Math.min(1, k.poz + ruch*0.03));
  if(ruch !== 0 && ruch !== k.kier){          // zmiana kierunku = jedno pociągnięcie
    k.kier = ruch; k.bonus = 40; sfx('sfx_skok');
  }
  if(k.bonus > 0) k.bonus--;

  const przesuniecie = Math.abs(k.poz - k.ostatnia);
  const szoruje = przesuniecie > 0.004 && k.bonus > 0;
  const c = strefaKapieli(k);

  if(przesuniecie > 0.004){
    if(k.dzwiekT-- <= 0){ ton(200 + Math.random()*180, 0.05, 'sawtooth', 0.02); k.dzwiekT = 6; }
    const gx = c.x + k.poz*(c.w-16) + 8, gy = c.y + c.h/2;
    if(k.etap === 'mycie'){
      const z = k.brud[k.i], przed = z.ile;
      z.ile = Math.max(0, z.ile - (szoruje ? 0.007 : 0.0012));
      if(Math.random() < (szoruje ? 0.7 : 0.2))
        G.czastki.push({x:gx + (Math.random()-0.5)*14, y:gy + (Math.random()-0.5)*14,
                        vx:(Math.random()-0.5)*1.2, vy:-0.6-Math.random(),
                        zyc:24+Math.random()*16, kol:'#fffeff', r:1+Math.random()*2});
      if(przed > 0 && z.ile === 0){
        sfx('sfx_zbierz');
        const nastepna = k.brud.findIndex(b => b.ile > 0);
        if(nastepna >= 0){ dopowiedz('kapiel_czysta'); zmienCzesc(k, nastepna); }
      }
    } else {
      k.mokro = Math.max(0, k.mokro - (szoruje ? 0.005 : 0.0009));
    }
  }
  // gdyby dziecko utknęło – po dwóch minutach kąpiel kończy się sama
  if(k.czas <= 0){
    if(k.etap === 'mycie') k.brud.forEach(b => b.ile = 0);
    else k.mokro = 0;
  }

  if(k.etap === 'mycie' && k.brud.every(b => b.ile <= 0)){
    k.etap = 'recznik'; k.poz = 0.5; k.kier = 0; k.bonus = 0; k.czas = 60*60;
    sfx('sfx_sukces'); cisza(); mow(najlepszyGlos('kapiel_recznik'));
    iskry(240, 140, ['#fffeff','#3cbcfc','#f8d878'], 30);
  } else if(k.etap === 'recznik' && k.mokro <= 0){
    k.etap = 'gotowe'; k.koniecT = 180;
    sfx('sfx_sukces'); cisza(); mow(najlepszyGlos('kapiel_koniec'));
    iskry(240, 140, ['#fffeff','#f8d878','#fe6ecc'], 34);
  }
  aktualizujEfekty(); czyscNowe();
}

  if(!rysujPortret(boh.portretOp, 174, 190+b, 76, 92)) rysujTate(140, 120+b, 1, 0);
  if(G.kto === 'franek' && !rysujPortret(RODZICE[boh.domownik].portret, 274, 190+b, 76, 92))
    rysujMame(240, 120+b, -1, 0);

  napis('BRAWO ' + bohater().imie + '!', W/2, 200, '#f8d878', '#000000', 3);
  napis(bohater().koniecOpis, W/2, 226, '#fffeff', '#000000', 1);
  if(Math.floor(G.t/20)%2===0) napis('NACIŚNIJ  ^  ŻEBY ZAGRAĆ JESZCZE RAZ', W/2, 250, '#fffeff', '#000000', 1);
  rysujEfekty();
}

/* ==================== PĘTLA GŁÓWNA ==================== */
let ostatni = 0, akum = 0;
function petla(ts){
  requestAnimationFrame(petla);
  if(!ostatni) ostatni = ts;
  let dt = (ts - ostatni)/1000; ostatni = ts;
  if(dt > 0.25) dt = 0.25;
  akum += dt;
  let kroki = 0;
  while(akum >= 1/60 && kroki < 5){ akum -= 1/60; krok(); kroki++; }
  rysuj();
}
let ostatniEkranPrzyciskow = null;
const ETAPY_DWA_KCIUKI = ['mycie','wyscig','wyscig_okno','swiatlo','wstawanie','siku',
                          'lapanie','dom','kapiel'];
function odswiezPrzyciski(){
  if(G.ekran === ostatniEkranPrzyciskow) return;
  ostatniEkranPrzyciskow = G.ekran;
  document.body.classList.toggle('wAucie', G.ekran === 'jazda');
  document.body.classList.toggle('wMenu', G.ekran === 'wybor' || G.ekran === 'intro');
  // etapy, w których ◀ i ▶ idą do obu krawędzi – gra się dwoma kciukami
  document.body.classList.toggle('dwaKciuki', ETAPY_DWA_KCIUKI.includes(G.ekran));
  document.body.classList.toggle('strefy', G.ekran === 'mycie' || G.ekran === 'kapiel');
}
function krok(){
  G.t++;
  odswiezPrzyciski();
  switch(G.ekran){
    case 'wybor':
      // zmiana bohatera zeruje etap – Franek ma ich 27, Pola 12
      if(nowy('ArrowLeft') && G.kto !== 'franek'){ G.kto='franek'; G.poziom=0; sfx('sfx_zbierz'); }
      if(nowy('ArrowRight') && G.kto !== 'pola'){ G.kto='pola'; G.poziom=0; sfx('sfx_zbierz'); }
      if(nowy('ArrowUp')){
        sfx('sfx_sukces');
        G.opiekun = DOMYSLNY_OPIEKUN[G.kto];
        ustawOpiekuna(G.opiekun);
        G.ekran = 'opiekun';
        mow(najlepszyGlos(bohater().glosWyborOpiekuna));
      }
      czyscNowe(); break;
    case 'opiekun':
      if(nowy('ArrowLeft')  && G.opiekun !== 'mama'){ G.opiekun='mama'; sfx('sfx_zbierz'); }
      if(nowy('ArrowRight') && G.opiekun !== 'tata'){ G.opiekun='tata'; sfx('sfx_zbierz'); }
      if(nowy('ArrowUp')){
        sfx('sfx_sukces'); ustawOpiekuna(G.opiekun);
        G.ekran='intro'; mow(bohater().glosStart);
      }
      czyscNowe(); break;
    case 'intro':
      if(nowy('ArrowUp')){ sfx('sfx_sukces'); nowaGra(); kartaPoziomu(0); }
      czyscNowe(); break;
    case 'karta':
      G.kartaT++;
      if(G.kartaT > 60 && (nowy('ArrowUp')||nowy('ArrowRight')||nowy('ArrowLeft'))) startPoziomu(G.poziom);
      else if(G.kartaT > 260) startPoziomu(G.poziom);
      czyscNowe(); break;
    case 'gra': aktualizujGre(); break;
    case 'swiatlo': aktualizujSwiatlo(); break;
    case 'wstawanie': aktualizujWstawanie(); break;
    case 'siku': aktualizujSiku(); break;
    case 'mycie': aktualizujMycie(); break;
    case 'jazda': aktualizujJazde(); break;
    case 'wyscig': aktualizujWyscig(); break;
    case 'wyscig_okno': aktualizujWyscigDoOkna(); break;
    case 'kolko': aktualizujKolko(); break;
    case 'dzien': aktualizujDzien(); break;
    case 'lapanie': aktualizujLapanie(); break;
    case 'tankowanie': aktualizujTankowanie(); break;
    case 'dom': aktualizujDom(); break;
    case 'igorek': aktualizujZabaweUIgora(); break;
    case 'kapiel': aktualizujKapiel(); break;
    case 'ksiazka': aktualizujKsiazke(); break;
    case 'sen': aktualizujSen(); break;
    case 'koniec':
      if(G.t % 5 === 0 && G.czastki.length < 120)
        G.czastki.push({x:Math.random()*W, y:-6, vx:(Math.random()-0.5)*1, vy:0.6+Math.random()*1.4,
          zyc:240, kol:['#d82800','#f8d878','#58d854','#3cbcfc','#fe6ecc'][(Math.random()*5)|0], r:2+Math.random()*2});
      aktualizujEfekty();
      if(nowy('ArrowUp')){ G.czastki=[]; G.ekran='wybor'; graj('muz_menu'); mow('wybor'); }
      czyscNowe(); break;
  }
}
function rysuj(){
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0,0,W,H);
  switch(G.ekran){
    case 'wybor': rysujWybor(); break;

    case 'jazda': rysujJazde(); break;
    case 'wyscig': rysujWyscig(); break;
    case 'wyscig_okno': rysujWyscigDoOkna(); break;
    case 'kolko': rysujKolko(); break;

  }
}
// muzyka menu + powitanie startują po pierwszym geście gracza
let powitano = false;
function powitaj(){ if(powitano) return; powitano = true; graj('muz_menu'); mow('wybor'); }
['keydown','pointerdown','touchstart'].forEach(z => addEventListener(z, powitaj, {once:false}));
requestAnimationFrame(petla);

/* ==================== PWA: przycisk „zainstaluj" ====================
   Chrome sam nie pyta – chowa instalację w menu ⋮, a Safari na iPhonie w ogóle
   jej nie proponuje. Dlatego gra ma własny przycisk: na Androidzie i na
   komputerze otwiera prawdziwe okienko instalacji, a na iPhonie tłumaczy,
   gdzie kliknąć. Przycisk pokazuje się tylko w menu, żeby nie zasłaniać gry. */
const przyciskInstaluj = document.getElementById('instaluj');
const okienkoJak = document.getElementById('jakInstalowac');
let zachetaInstalacji = null;

function juzZainstalowana(){
  return matchMedia('(display-mode: standalone)').matches
      || matchMedia('(display-mode: fullscreen)').matches
      || navigator.standalone === true;
}
function pokazPrzyciskInstaluj(napisNaPrzycisku){
  if(juzZainstalowana()) return;
  przyciskInstaluj.textContent = napisNaPrzycisku;
  document.body.classList.add('mozna');
}
const naIPhonie = /iPhone|iPad|iPod/.test(navigator.userAgent)
               || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function tekstJakZainstalowac(){
  if(naIPhonie) return 'Na iPhonie i iPadzie instaluje się ręcznie, w <b>Safari</b>:<br><br>' +
    '1. dotknij <b>Udostępnij</b> (kwadracik ze strzałką w górę, na dole ekranu)<br>' +
    '2. przewiń listę i wybierz <b>Do ekranu początkowego</b><br>' +
    '3. potwierdź <b>Dodaj</b><br><br>' +
    'Gra pojawi się jako ikona z Frankiem i będzie chodzić na pełnym ekranie.';
  return 'Jeśli przeglądarka nie proponuje instalacji sama:<br><br>' +
    '• <b>Android, Chrome:</b> menu <b>⋮</b> w prawym górnym rogu → <b>Zainstaluj aplikację</b> ' +
    '(albo <b>Dodaj do ekranu głównego</b>)<br>' +
    '• <b>Komputer, Chrome / Edge:</b> ikonka instalacji po prawej stronie paska adresu<br><br>' +
    'Gdyby tego nie było, odśwież stronę – gra musi się raz wczytać do końca.';
}
przyciskInstaluj.addEventListener('click', async e => {
  e.stopPropagation();
  if(zachetaInstalacji){
    try{
      zachetaInstalacji.prompt();
      const wybor = await zachetaInstalacji.userChoice.catch(() => null);
      zachetaInstalacji = null;
      if(wybor && wybor.outcome === 'accepted') document.body.classList.remove('mozna');
      return;
    }catch(err){
      zachetaInstalacji = null;      // okienko się nie otworzyło – zostaje instrukcja
    }
  }
  document.getElementById('jakTresc').innerHTML = tekstJakZainstalowac();
  okienkoJak.classList.add('widac');
});
document.getElementById('zamknijJak').addEventListener('click', e => {
  e.stopPropagation(); okienkoJak.classList.remove('widac');
});
addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  zachetaInstalacji = e;
  pokazPrzyciskInstaluj('📲 ZAINSTALUJ GRĘ');
});
addEventListener('appinstalled', () => {
  zachetaInstalacji = null;
  document.body.classList.remove('mozna');
});
// iPhone nigdy nie da zachęty; na innych czekamy chwilę i też podpowiadamy ręcznie
if(naIPhonie) pokazPrzyciskInstaluj('📲 JAK ZAINSTALOWAĆ?');
else setTimeout(() => { if(!zachetaInstalacji) pokazPrzyciskInstaluj('📲 JAK ZAINSTALOWAĆ?'); }, 4000);

/* ==================== PWA: zawsze świeża wersja ====================
   Service worker trzyma grę offline, ale index.html bierze najpierw z sieci,
   więc po każdym wejściu gra jest w najnowszej wersji. Gdy w tle pojawi się
   nowa wersja, strona przeładowuje się sama (ale nigdy w środku zabawy). */
if('serviceWorker' in navigator){
  const bylJuzWorker = !!navigator.serviceWorker.controller;
  let przeladowano = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if(!bylJuzWorker || przeladowano) return;   // pierwsza instalacja nie przeładowuje
    przeladowano = true;
    location.reload();
  });
  addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js', {scope:'./', updateViaCache:'none'}).then(rej => {
      const sprawdz = () => { if(document.visibilityState === 'visible') rej.update().catch(()=>{}); };
      addEventListener('visibilitychange', sprawdz);
      setInterval(sprawdz, 15 * 60 * 1000);      // gra bywa włączona godzinami
    }).catch(()=>{});
  });
}
